<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galaxis Hub Demo</title>
  <meta name="description" content="Galaxis Hub prototype: V1 features and V2 integrations, leads and attribution, built to the Galaxis Product Design Figma.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&family=Radio+Canada+Big:wght@400;500;700&display=swap">
  <script src="https://unpkg.com/lucide@0.546.0/dist/umd/lucide.min.js"></script>
  <style>
/* Galaxis Hub — design tokens and components, taken from the Figma "Product Hub" page */
:root {
  --primary: #398FF7;
  --primary-hover: #2E72C6;
  --primary-dark: #225694;
  --link: #0366D8;
  --tint: #ECF5FF;
  --blue-light: #66ACFD;

  --text: #2B2B2B;
  --text-secondary: #656565;
  --text-muted: #AEAEAE;
  --border: #DFDFDF;
  --border-light: #EAEAEA;
  --page: #FCFCFC;
  --surface: #FFFFFF;
  --grey-light: #F2F2F2;

  --success: #36A93F;
  --success-bg: #E7F7E8;
  --success-pill: #8CDA93;
  --warning: #F59E1B;
  --warning-bg: #FFF4E3;
  --warning-pill: #F9C576;
  --warning-dark: #C47E16;
  --error: #E4100E;
  --error-bg: #FDE3E3;
  --error-pill: #F78483;
  --info-pill: #66ACFD;

  --r-xs: 2px;
  --r-sm: 4px;
  --r-md: 8px;
  --r-lg: 16px;
  --r-pill: 99px;

  --shadow-soft: 0 0 10px rgba(43, 43, 43, .10);
  --shadow-light: 0 0 24px rgba(43, 43, 43, .06);

  --font-head: 'Radio Canada Big', system-ui, sans-serif;
  --font-body: 'Arimo', system-ui, sans-serif;

  --sidebar-w: 212px;
  --devbar-h: 44px;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 20px;
  letter-spacing: .25px;
  color: var(--text);
  background: var(--page);
  padding-top: var(--devbar-h);
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; }
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }
[hidden] { display: none !important; }
svg.lucide { width: 16px; height: 16px; stroke-width: 1.75; flex-shrink: 0; }

/* ---------- Typography ---------- */
.h-page { font-family: var(--font-head); font-weight: 700; font-size: 24px; line-height: 28px; color: var(--primary); margin: 0; }
.h-welcome { font-family: var(--font-head); font-weight: 700; font-size: 32px; line-height: 36px; margin: 0; }
.h-section { font-family: var(--font-head); font-weight: 700; font-size: 20px; line-height: 24px; margin: 0; }
.h-card { font-family: var(--font-head); font-weight: 700; font-size: 16px; line-height: 20px; letter-spacing: .5px; margin: 0; }
.t-body { font-size: 16px; line-height: 20px; letter-spacing: .5px; }
.t-caption { font-size: 12px; line-height: 16px; letter-spacing: .5px; }
.t-muted { color: var(--text-muted); }
.t-secondary { color: var(--text-secondary); }
.t-bold { font-weight: 700; }
.t-success { color: var(--success); }
.t-warning { color: var(--warning); }
.t-error { color: var(--error); }
.t-primary { color: var(--primary); }
.t-link { color: var(--link); font-weight: 700; background: none; border: 0; padding: 0; display: inline-flex; align-items: center; gap: 4px; font-size: 12px; }
.t-link:hover { text-decoration: underline; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }

/* ---------- Layout ---------- */
.app { display: flex; min-height: calc(100vh - var(--devbar-h)); }
.sidebar {
  position: fixed; top: var(--devbar-h); bottom: 0; left: 0; width: var(--sidebar-w);
  background: var(--surface); box-shadow: var(--shadow-light);
  display: flex; flex-direction: column; padding: 24px 20px; z-index: 50;
}
.sidebar-logo { font-family: var(--font-head); font-size: 26px; font-weight: 500; letter-spacing: -.5px; color: var(--text); padding: 0 4px 18px; border-bottom: 1px solid var(--border); margin-bottom: 20px; display: flex; align-items: center; gap: 2px; }
.sidebar-nav { display: flex; flex-direction: column; gap: 6px; }
.nav-item {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--r-md);
  color: var(--text-muted); font-size: 12px; font-weight: 700; letter-spacing: .5px; background: none; border: 0; text-align: left; width: 100%;
}
.nav-item:hover { background: var(--grey-light); color: var(--text-secondary); text-decoration: none; }
.nav-item.active { color: var(--primary); }
.nav-item .nav-badge { margin-left: auto; }
.sidebar-footer { margin-top: auto; display: flex; flex-direction: column; gap: 2px; border-top: 1px solid var(--border); padding-top: 14px; }

.main { margin-left: var(--sidebar-w); flex: 1; min-width: 0; padding: 32px 40px 64px; }
.main-inner { max-width: 1240px; margin: 0 auto; }
.page-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; padding-bottom: 18px; border-bottom: 1px solid var(--border); margin-bottom: 28px; }
.page-header .page-desc { color: var(--text-muted); font-size: 14px; margin-top: 6px; letter-spacing: .5px; }
.page-header-right { display: flex; align-items: center; gap: 14px; }
.avatar-btn { width: 36px; height: 36px; border-radius: 50%; background: var(--text-muted); color: #fff; border: 0; display: grid; place-items: center; }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--tint); color: var(--primary); font-weight: 700; font-size: 12px; display: grid; place-items: center; flex-shrink: 0; }

.stack { display: flex; flex-direction: column; gap: 24px; }
.stack-sm { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; align-items: center; gap: 12px; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px; }
.grid-5 { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 24px; }
.divider { height: 1px; background: var(--border); border: 0; margin: 16px 0; }

/* ---------- Cards ---------- */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 24px; }
.card-tight { padding: 16px; }
.card-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
.card-sub { color: var(--text-muted); font-size: 12px; letter-spacing: .5px; margin-top: 6px; }
.kpi-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 18px 16px; min-height: 124px; }
.kpi-title { display: flex; align-items: center; gap: 6px; font-size: 12px; letter-spacing: .5px; color: var(--text); }
.kpi-value { font-family: var(--font-head); font-weight: 700; font-size: 24px; line-height: 28px; margin: 14px 0 12px; }
.kpi-sub { font-size: 12px; color: var(--text-secondary); letter-spacing: .5px; }
.kpi-sub b { color: var(--primary); }
.kpi-locked .kpi-value { color: var(--text-muted); }

.info-tip { position: relative; display: inline-flex; color: var(--primary); cursor: help; }
.info-tip svg.lucide { width: 12px; height: 12px; }
.info-tip .tip {
  display: none; position: absolute; left: 50%; top: calc(100% + 8px); transform: translateX(-50%);
  width: 240px; background: var(--text); color: #fff; font-size: 12px; line-height: 16px; padding: 10px 12px; border-radius: var(--r-md); z-index: 300; font-weight: 400; letter-spacing: .25px;
}
.info-tip:hover .tip, .info-tip:focus .tip { display: block; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 36px; padding: 0 16px;
  border-radius: var(--r-pill); font-weight: 700; font-size: 14px; letter-spacing: .1px; border: 1.5px solid transparent; white-space: nowrap;
  transition: background .15s, border-color .15s, color .15s;
}
.btn-sm { height: 30px; padding: 0 12px; font-size: 12px; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-hover); }
.btn-outline { background: var(--surface); color: var(--primary); border-color: var(--primary); }
.btn-outline:hover { background: var(--tint); }
.btn-ghost { background: none; color: var(--primary); }
.btn-ghost:hover { background: var(--tint); }
.btn-danger { background: var(--error); color: #fff; }
.btn-danger:hover { background: #A40C0A; }
.btn-danger-outline { background: var(--surface); color: var(--error); border-color: var(--error); }
.btn:disabled, .btn.disabled { background: var(--grey-light); color: var(--text-muted); border-color: var(--grey-light); cursor: not-allowed; }
.icon-btn {
  width: 36px; height: 36px; border-radius: 50%; display: inline-grid; place-items: center;
  border: 1.5px solid var(--primary); background: var(--surface); color: var(--primary); position: relative;
}
.icon-btn:hover { background: var(--tint); }
.icon-btn .count { position: absolute; top: -4px; right: -4px; background: var(--primary); color: #fff; font-size: 10px; min-width: 16px; height: 16px; border-radius: 8px; display: grid; place-items: center; padding: 0 4px; }
.kebab { width: 28px; height: 28px; border-radius: 50%; border: 0; background: none; display: inline-grid; place-items: center; color: var(--text); }
.kebab:hover { background: var(--grey-light); }

/* ---------- Tabs ---------- */
.page-tabs { display: flex; gap: 24px; margin-bottom: 28px; flex-wrap: wrap; }
.page-tab { display: inline-flex; align-items: center; gap: 8px; padding: 4px 0; border: 0; background: none; color: var(--text-muted); font-weight: 700; font-size: 14px; border-bottom: 2px solid transparent; }
.page-tab:hover { color: var(--text-secondary); }
.page-tab.active { color: var(--primary); border-bottom-color: var(--primary); }
.seg { display: inline-flex; padding: 4px; border-radius: var(--r-pill); background: var(--surface); box-shadow: var(--shadow-soft); gap: 2px; }
.seg button { border: 0; background: none; padding: 6px 14px; border-radius: var(--r-pill); color: var(--text-muted); font-weight: 700; font-size: 12px; letter-spacing: .5px; }
.seg button:hover { color: var(--text-secondary); }
.seg button.active { background: var(--primary); color: #fff; }
.seg-block { display: flex; width: 100%; }
.seg-block button { flex: 1; padding: 8px 14px; }
.cat-tabs { display: flex; gap: 24px; margin: 16px 0 20px; flex-wrap: wrap; }
.cat-tab { display: inline-flex; align-items: center; gap: 8px; border: 0; background: none; padding: 2px 0; color: var(--text-muted); font-weight: 700; font-size: 14px; border-bottom: 2px solid transparent; }
.cat-tab.active { color: var(--primary); border-bottom-color: var(--primary); }

/* ---------- Pills, chips, dots ---------- */
.pill { display: inline-flex; align-items: center; justify-content: center; min-width: 96px; height: 22px; padding: 0 12px; border-radius: var(--r-pill); color: #fff; font-size: 12px; font-weight: 700; letter-spacing: .5px; white-space: nowrap; }
.pill-green { background: var(--success-pill); }
.pill-blue { background: var(--info-pill); }
.pill-red { background: var(--error-pill); }
.pill-orange { background: var(--warning-pill); }
.pill-grey { background: var(--text-muted); }
.pill-sm { min-width: 0; height: 20px; padding: 0 10px; font-size: 11px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 12px; border-radius: var(--r-pill); background: var(--tint); color: var(--blue-light); font-size: 11px; letter-spacing: .25px; white-space: nowrap; }
.chip-outline { background: var(--surface); border: 1px solid var(--border); color: var(--text); height: 28px; padding: 0 10px; font-size: 12px; }
.chip-dark { background: var(--tint); color: var(--link); font-weight: 700; }
.chip-remove { border: 0; background: none; padding: 0; color: inherit; display: inline-flex; }
.chips { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.more-count { font-size: 12px; color: var(--text); }
.dot-label { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; letter-spacing: .5px; }
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
.dot-green { background: var(--success-pill); } .dot-green-strong { background: var(--success); }
.dot-blue { background: var(--primary); }
.dot-orange { background: var(--warning-pill); } .dot-orange-strong { background: var(--warning); }
.dot-red { background: var(--error-pill); } .dot-red-strong { background: var(--error); }
.dot-grey { background: var(--text-muted); }
.metric-dot { display: inline-flex; align-items: center; gap: 6px; }
.metric-dot.good { color: var(--success); } .metric-dot.mid { color: var(--warning); } .metric-dot.bad { color: var(--error); }
.metric-dot::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

/* ---------- Banners ---------- */
.banner { display: flex; align-items: center; gap: 14px; border-radius: var(--r-md); padding: 14px 18px; border: 1px solid; }
.banner-warning { background: var(--warning-bg); border-color: var(--warning); color: var(--warning-dark); }
.banner-warning .banner-title { color: var(--warning); }
.banner-error { background: var(--error-bg); border-color: var(--error-pill); color: #A40C0A; }
.banner-info { background: var(--tint); border-color: var(--blue-light); color: var(--link); }
.banner-success { background: var(--success-bg); border-color: var(--success-pill); color: #26762C; }
.banner-title { font-weight: 700; font-size: 14px; }
.banner-text { font-size: 12px; letter-spacing: .25px; }
.banner .banner-action { margin-left: auto; font-weight: 700; font-size: 12px; text-decoration: underline; background: none; border: 0; color: inherit; white-space: nowrap; }
.banner svg.lucide { width: 20px; height: 20px; }

/* ---------- Forms ---------- */
.field { display: flex; flex-direction: column; gap: 8px; }
.field-label { font-size: 12px; color: var(--text-secondary); letter-spacing: .5px; }
.field-label .req { color: var(--error); margin-left: 2px; }
.input, .select, .textarea {
  height: 38px; width: 100%; border: 1px solid var(--border); border-radius: var(--r-sm); background: var(--surface);
  padding: 0 12px; font-size: 14px; outline: none; letter-spacing: .25px;
}
.textarea { height: auto; min-height: 80px; padding: 10px 12px; resize: vertical; }
.input::placeholder, .textarea::placeholder { color: var(--text-muted); }
.input:focus, .select:focus, .textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(57, 143, 247, .15); }
.input.invalid { border-color: var(--error); }
.field-error { color: var(--error); font-size: 12px; }
.field-hint { color: var(--text-muted); font-size: 12px; }
.input:disabled, .select:disabled { background: var(--grey-light); color: var(--text-muted); }
.search { position: relative; }
.search .input { padding-right: 34px; height: 36px; font-size: 12px; }
.search svg.lucide { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); width: 14px; height: 14px; }
.check { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-size: 14px; }
.check input { width: 16px; height: 16px; accent-color: var(--primary); margin: 0; }
.toggle { position: relative; width: 36px; height: 20px; flex-shrink: 0; }
.toggle input { opacity: 0; width: 0; height: 0; }
.toggle span { position: absolute; inset: 0; background: var(--border); border-radius: 10px; transition: .15s; cursor: pointer; }
.toggle span::before { content: ''; position: absolute; width: 16px; height: 16px; left: 2px; top: 2px; background: #fff; border-radius: 50%; transition: .15s; }
.toggle input:checked + span { background: var(--primary); }
.toggle input:checked + span::before { transform: translateX(16px); }
.kv-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px 48px; }
.kv-label { font-size: 12px; color: var(--text-muted); letter-spacing: .5px; margin-bottom: 12px; }
.kv-value { font-size: 16px; letter-spacing: .5px; }
.form-section-title { font-size: 12px; font-weight: 400; letter-spacing: .5px; padding-bottom: 10px; border-bottom: 1px solid var(--border); margin: 24px 0 20px; }

/* ---------- Tables ---------- */
.table-wrap { border: 1px solid var(--border); border-radius: var(--r-md); overflow-x: auto; }
.table { width: 100%; border-collapse: collapse; font-size: 12px; letter-spacing: .25px; }
.table th { background: var(--tint); text-align: left; font-weight: 700; padding: 12px 14px; white-space: nowrap; font-size: 12px; }
.table td { padding: 14px; border-top: 1px solid var(--border-light); vertical-align: middle; }
.table tr.clickable { cursor: pointer; }
.table tr.clickable:hover td { background: #F8FBFF; }
.table td.num, .table th.num { text-align: right; }
.table .cell-sub { color: var(--text-muted); font-size: 11px; margin-top: 2px; }
.th-sort { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; padding: 0; font-weight: 700; font-size: 12px; cursor: pointer; }
.th-sort .sort-ind { color: var(--text-muted); font-size: 11px; }
.th-sort.sorted .sort-ind { color: var(--primary); }
/* Action column pinned to the right edge (tables marked by markActionColumns() in core.js).
   :where() keeps specificity low so row states (hover, pending, muted) still colour the cell. */
:where(.table.has-action-col) tr > :last-child { position: sticky; right: 0; z-index: 2; background: var(--surface); }
:where(.table.has-action-col) thead tr > :last-child { background: var(--tint); }
/* While more columns are hidden behind the action column (.is-overflowing without .at-end): a fade over the
   scrolling columns, a divider and a stronger shadow. They disappear once the table is scrolled to the end. */
:where(.table-wrap.is-overflowing:not(.at-end)) .table.has-action-col tr > :last-child { box-shadow: -10px 0 12px -10px rgba(43, 43, 43, .28), inset 1px 0 0 var(--border); }
:where(.table-wrap.is-overflowing:not(.at-end)) .table.has-action-col tr > :last-child::before {
  content: ''; position: absolute; top: 0; bottom: 0; right: 100%; width: 48px; pointer-events: none;
  background: linear-gradient(to right, rgba(255, 255, 255, 0), var(--surface));
}
:where(.table-wrap.is-overflowing:not(.at-end)) .table.has-action-col thead tr > :last-child::before { background: linear-gradient(to right, rgba(236, 245, 255, 0), var(--tint)); }
:where(.table-wrap.is-overflowing:not(.at-end)) .table.has-action-col tr.clickable:hover > :last-child::before { background: linear-gradient(to right, rgba(248, 251, 255, 0), #F8FBFF); }
:where(.table.has-action-col) tr > :last-child.menu-open-cell { z-index: 60; }
/* First column pinned to the left edge of every table. Once scrolled (.is-scrolled), a divider, shadow and
   fade show that columns are passing underneath it. */
:where(.table-wrap > .table) tr > :first-child:not([colspan]) { position: sticky; left: 0; z-index: 2; background: var(--surface); }
:where(.table-wrap > .table) thead tr > :first-child:not([colspan]) { background: var(--tint); }
:where(.table-wrap.is-scrolled) > .table tr > :first-child:not([colspan]) { box-shadow: 10px 0 12px -10px rgba(43, 43, 43, .28), inset -1px 0 0 var(--border); }
:where(.table-wrap.is-scrolled) > .table tr > :first-child:not([colspan])::after {
  content: ''; position: absolute; top: 0; bottom: 0; left: 100%; width: 48px; pointer-events: none;
  background: linear-gradient(to left, rgba(255, 255, 255, 0), var(--surface));
}
:where(.table-wrap.is-scrolled) > .table thead tr > :first-child::after { background: linear-gradient(to left, rgba(236, 245, 255, 0), var(--tint)); }
:where(.table-wrap.is-scrolled) > .table tr.clickable:hover > :first-child::after { background: linear-gradient(to left, rgba(248, 251, 255, 0), #F8FBFF); }
.table-empty { text-align: center; padding: 40px 16px !important; color: var(--text-muted); }
.table-toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
.table-toolbar .search { width: 260px; }
.pagination { display: flex; align-items: center; justify-content: space-between; margin-top: 20px; font-size: 12px; }
.pagination .per-page { display: inline-flex; align-items: center; gap: 6px; }
.pagination select { border: 0; border-bottom: 1px solid var(--text); background: none; font-size: 12px; padding: 0 2px; }
.pagination .pages { display: inline-flex; align-items: center; gap: 4px; }
.page-btn { min-width: 28px; height: 28px; border: 0; background: none; border-radius: 50%; font-size: 12px; color: var(--text); display: inline-grid; place-items: center; }
.page-btn.muted { color: var(--text-muted); }
.page-btn.active { background: var(--tint); color: var(--primary); font-weight: 700; }
.page-btn:disabled { color: var(--border); cursor: default; }

/* Compact headers: multi-word column names sit on two balanced lines (thLabel in core.js), never more (table.table-wrap-heads). */
.table.table-wrap-heads thead tr:last-child th { white-space: normal; vertical-align: bottom; line-height: 15px; }
.table.table-wrap-heads thead tr:last-child th .th-sort { text-align: left; align-items: flex-end; }
.table.table-wrap-heads thead tr:last-child th .th-line { display: block; white-space: nowrap; }
.table.table-wrap-heads thead tr:last-child th .th-sort .sort-ind { white-space: nowrap; }

/* ---------- Collapsible column groups (colGroupHeaderRow in core.js) ---------- */
/* Tones: neutral (account / details), ads + ads2 (alternating ad groups), seo, crm. */
/* One colour for every group band, deeper than the column-header tint so the two rows read apart; tone classes
   are kept on cells but no longer change the colour. Group dividers: 2px, a soft mid blue. */
.table { --colgrp-bg: #D2E5FD; --colgrp-fg: #0356B8; --colgrp-line: #A8CDFB; }
.table .colgrp-start { border-left: 2px solid var(--colgrp-line); }
.table thead tr.colgrp-row > th { padding: 0; height: 30px; border-bottom: 1px solid var(--surface); }
.table thead tr.colgrp-row > th.colgrp-band { background: var(--colgrp-bg); }
.table thead tr.colgrp-row > th.colgrp-blank { background: var(--surface); }
.colgrp-btn { display: flex; align-items: center; gap: 6px; width: 100%; height: 30px; padding: 0 12px; border: 0; background: none;
  color: var(--colgrp-fg); font-size: 11px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; white-space: nowrap; text-align: left; }
.colgrp-btn:hover { background: rgba(255, 255, 255, .45); }
/* A band widens its columns only a little (labels up to 180px); longer labels end in "…". */
.colgrp-band .colgrp-btn { max-width: 180px; overflow: hidden; }
.colgrp-band[colspan] .colgrp-btn { max-width: none; }
.colgrp-label { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.colgrp-btn svg.lucide, .colgrp-more { flex-shrink: 0; }
.colgrp-btn svg.lucide { width: 14px; height: 14px; }
.colgrp-more { margin-left: 2px; padding: 0 6px; border-radius: var(--r-pill); background: var(--surface); font-size: 10px; letter-spacing: 0; }
.colgrp-band.is-collapsed .colgrp-btn { padding-right: 8px; }
.colgrp-all { display: inline-flex; align-items: center; gap: 4px; height: 30px; padding: 0 12px; border: 0; background: none;
  color: var(--link); font-size: 11px; font-weight: 700; white-space: nowrap; }
.colgrp-all:hover { text-decoration: underline; }
.colgrp-all svg.lucide { width: 13px; height: 13px; }

/* ---------- Platform badges ---------- */
.platform { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border: 1px solid var(--border); border-radius: var(--r-pill); font-size: 12px; background: var(--surface); }
.platform-plain { border: 0; padding: 0; height: auto; font-weight: 700; }
.logo { width: 16px; height: 16px; display: inline-block; flex-shrink: 0; }
.logo-lg { width: 32px; height: 32px; }
.logo-xl { width: 40px; height: 40px; }
.product-logo { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: #fff; font-size: 12px; flex-shrink: 0; overflow: hidden; }

/* ---------- Dropdowns / menus ---------- */
.menu-anchor { position: relative; display: inline-block; }
.menu {
  position: absolute; right: 0; top: calc(100% + 6px); min-width: 200px; background: var(--surface); border-radius: var(--r-md);
  box-shadow: var(--shadow-soft); padding: 6px; z-index: 400; display: none;
}
.menu.open { display: block; }
.menu-left { right: auto; left: 0; }
.menu-item { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none; padding: 9px 10px; border-radius: var(--r-sm); text-align: left; font-size: 12px; letter-spacing: .5px; }
.menu-item:hover { background: var(--grey-light); }
.menu-item.danger { color: var(--error); }
.menu-item:disabled { color: var(--text-muted); cursor: not-allowed; background: none; }
.menu-sep { height: 1px; background: var(--border-light); margin: 4px 0; }
.filter-panel { position: absolute; right: 0; top: calc(100% + 8px); width: 340px; background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow-soft); padding: 20px; z-index: 400; display: none; }
.filter-panel.open { display: block; }
.filter-group { margin-bottom: 18px; }
.filter-group-title { font-size: 12px; font-weight: 700; margin-bottom: 10px; letter-spacing: .5px; }
.filter-options { display: flex; flex-direction: column; gap: 10px; }
.filter-options .check { font-size: 12px; }
.filter-actions { display: flex; justify-content: flex-end; gap: 8px; border-top: 1px solid var(--border-light); padding-top: 14px; }

/* ---------- Workspace switcher ---------- */
.ws-trigger { display: inline-flex; align-items: center; gap: 10px; min-width: 260px; height: 36px; padding: 0 16px; border-radius: var(--r-pill); border: 1px solid var(--border); background: var(--surface); font-weight: 700; font-size: 12px; letter-spacing: .5px; }
.ws-trigger .chev { margin-left: auto; }
.ws-panel { position: absolute; right: 0; top: calc(100% + 8px); width: 420px; background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow-soft); padding: 18px; z-index: 500; display: none; }
.ws-panel.open { display: block; }
.ws-section-label { font-size: 11px; font-weight: 700; color: var(--text-muted); letter-spacing: .5px; text-transform: uppercase; margin: 14px 0 8px; }
.ws-option { display: flex; align-items: center; gap: 12px; width: 100%; border: 1px solid transparent; background: none; padding: 10px; border-radius: var(--r-md); text-align: left; }
.ws-option:hover { background: var(--grey-light); }
.ws-option.current { border-color: var(--primary); background: var(--tint); }
.ws-option .ws-name { font-weight: 700; font-size: 14px; }
.ws-option .ws-meta { font-size: 12px; color: var(--text-muted); }
.ws-list { max-height: 320px; overflow-y: auto; }

/* ---------- Modals & drawers ---------- */
.modal-backdrop { position: fixed; inset: 0; background: rgba(252, 252, 252, .55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 24px; }
.modal-backdrop.open { display: flex; }
.modal { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow-soft); width: 100%; max-width: 500px; max-height: calc(100vh - 80px); overflow-y: auto; padding: 24px; }
.modal-lg { max-width: 640px; }
.modal-title { font-family: var(--font-head); font-weight: 700; font-size: 20px; line-height: 24px; margin: 0; }
.modal-desc { font-size: 14px; color: var(--text); margin: 6px 0 22px; letter-spacing: .25px; }
.modal-body { display: flex; flex-direction: column; gap: 18px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 26px; }
.modal-actions.center { justify-content: center; }
.modal-confirm { text-align: center; max-width: 500px; padding: 32px 36px; }
.modal-confirm .confirm-icon { color: var(--warning); margin-bottom: 18px; }
.modal-confirm .confirm-icon.danger { color: var(--error); }
.modal-confirm .confirm-icon svg.lucide { width: 52px; height: 52px; stroke-width: 2; }
.modal-confirm .modal-desc { color: var(--text-muted); margin-bottom: 0; }

.drawer-backdrop { position: fixed; inset: 0; background: rgba(43, 43, 43, .08); z-index: 900; display: none; }
.drawer-backdrop.open { display: block; }
.drawer { position: fixed; top: var(--devbar-h); right: 0; bottom: 0; width: 460px; max-width: 100vw; background: var(--surface); box-shadow: var(--shadow-soft); z-index: 950; transform: translateX(100%); transition: transform .2s ease; display: flex; flex-direction: column; }
.drawer.open { transform: translateX(0); }
.drawer-wide { width: 640px; }
.drawer-close { position: absolute; top: 14px; right: 16px; z-index: 2; background: var(--surface); box-shadow: 0 0 0 6px var(--surface); }
.drawer-body { padding: 56px 32px 32px; overflow-y: auto; flex: 1; border-top: 1px solid transparent; }
.drawer::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 52px; background: var(--surface); z-index: 1; border-radius: 0; }
.drawer-footer { padding: 16px 32px; border-top: 1px solid var(--border-light); display: flex; justify-content: flex-end; gap: 10px; }
.drawer h4 { font-size: 14px; font-weight: 700; margin: 24px 0 10px; }
.drawer ul { margin: 0; padding-left: 18px; font-size: 14px; }

/* ---------- Toast ---------- */
.toast { position: fixed; bottom: 24px; right: 24px; background: var(--text); color: #fff; padding: 12px 18px; border-radius: var(--r-md); display: none; align-items: center; gap: 10px; z-index: 2000; font-size: 14px; box-shadow: var(--shadow-soft); max-width: 420px; animation: toastIn .2s ease; }
.toast.show { display: flex; }
@keyframes toastIn { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---------- Column picker (colPickerButton in core.js) ---------- */
.colpick-panel { width: 400px; max-height: min(70vh, 580px); overflow-y: auto; padding: 20px 22px 16px; }
.colpick-head { margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid var(--border-light); }
.colpick-head .card-sub { margin-top: 4px; line-height: 16px; }
.colpick-panel .filter-group { margin-bottom: 16px; }
.colpick-group-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.colpick-group-head .filter-group-title { margin-bottom: 0; }
.colpick-group-head .t-link { color: var(--link); font-size: 12px; }
.colpick-options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 16px; }
.colpick-options .check { display: flex; align-items: center; gap: 8px; font-size: 12px; line-height: 16px; min-width: 0; }
.colpick-options .check input { flex-shrink: 0; }
.colpick-panel .filter-actions { gap: 8px; padding-top: 14px; }

/* ---------- Date filter (ported from V1) ---------- */
.date-filter { position: relative; }
.date-trigger { display: inline-flex; align-items: center; justify-content: space-between; gap: 24px; min-width: 240px; height: 44px; padding: 0 16px; border: 1px solid var(--border); border-radius: var(--r-md); background: var(--surface); font-size: 16px; letter-spacing: .5px; }
.date-popover { position: absolute; right: 0; top: calc(100% + 8px); width: 340px; background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow-soft); padding: 16px; z-index: 450; display: none; }
.date-filter.open .date-popover { display: block; }
.date-popover .seg { margin-bottom: 16px; }
.date-config-row { display: flex; align-items: center; gap: 8px; }
.date-config-row .input, .date-config-row .select { height: 34px; }
.date-preview { margin-top: 10px; font-size: 12px; color: var(--text-secondary); }
.date-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

/* ---------- Progress ---------- */
.progress { height: 10px; background: var(--grey-light); border-radius: var(--r-pill); overflow: hidden; }
.progress > span { display: block; height: 100%; background: var(--primary); border-radius: var(--r-pill); }
.legend { display: flex; gap: 20px; flex-wrap: wrap; font-size: 12px; margin-top: 12px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }

/* ---------- Org header card ---------- */
.org-card { display: flex; gap: 28px; align-items: center; }
.org-logo { width: 84px; height: 84px; display: grid; place-items: center; border-radius: var(--r-md); font-family: var(--font-head); font-weight: 700; font-size: 22px; color: var(--primary); background: var(--tint); flex-shrink: 0; }
.org-name { font-family: var(--font-head); font-weight: 700; font-size: 24px; line-height: 28px; }
.org-meta { display: flex; gap: 20px; flex-wrap: wrap; font-size: 12px; margin-top: 12px; }
.org-meta span { display: inline-flex; align-items: center; gap: 6px; }
.org-desc { font-size: 12px; color: var(--text-muted); margin-top: 12px; }

/* ---------- Empty state ---------- */
.empty { text-align: center; padding: 40px 20px; color: var(--text-muted); }
.empty svg.lucide { width: 32px; height: 32px; margin-bottom: 10px; color: var(--border); }
.empty-title { color: var(--text); font-weight: 700; margin-bottom: 4px; }

/* ---------- Dev toolbar ---------- */
.devbar { position: fixed; top: 0; left: 0; right: 0; height: var(--devbar-h); background: #10151F; color: #CBD5E1; z-index: 1500; display: flex; align-items: center; gap: 16px; padding: 0 16px; font-size: 12px; font-family: system-ui, sans-serif; letter-spacing: 0; }
.devbar-title { font-weight: 700; color: #fff; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.devbar-title .tag { background: #F59E1B; color: #10151F; font-size: 10px; padding: 1px 6px; border-radius: 4px; }
.devbar select { background: #1E2533; color: #fff; border: 1px solid #334155; border-radius: 6px; height: 28px; padding: 0 8px; font-size: 12px; max-width: 260px; }
.devbar-toggles { display: flex; gap: 6px; overflow-x: auto; flex: 1; align-items: center; }
.devbar-toggles .lbl { color: #64748B; white-space: nowrap; }
.dev-toggle { background: #1E2533; color: #CBD5E1; border: 1px solid #334155; border-radius: 6px; height: 26px; padding: 0 10px; font-size: 11px; white-space: nowrap; }
.dev-toggle.active { background: #398FF7; border-color: #398FF7; color: #fff; }

/* ---------- Charts ---------- */
.chart-tooltip { position: fixed; pointer-events: none; background: var(--text); color: #fff; font-size: 12px; padding: 8px 10px; border-radius: var(--r-md); z-index: 600; display: none; line-height: 16px; }

/* ---------- Responsive ---------- */
@media (max-width: 1280px) {
  .grid-5 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 960px) {
  :root { --sidebar-w: 72px; }
  .nav-item span, .sidebar-logo .logo-text { display: none; }
  .main { padding: 24px 20px 48px; }
  .grid-2, .grid-3 { grid-template-columns: 1fr; }
  .page-header { flex-direction: column; }
}

/* ---------- Column / group reordering ---------- */
.colpick-sortable { grid-template-columns: 1fr; gap: 2px; }
.colpick-item { display: flex; align-items: center; gap: 4px; padding: 3px 6px 3px 0; border-radius: var(--r-sm); }
.colpick-item:hover { background: var(--page); }
.colpick-item .check { flex: 1; }
.colpick-grip { width: 22px; height: 22px; display: grid; place-items: center; border: 0; background: none; color: var(--text-muted); cursor: grab; border-radius: var(--r-sm); flex-shrink: 0; padding: 0; }
.colpick-grip:hover, .colpick-grip:focus-visible { color: var(--primary); background: var(--tint); }
.colpick-grip svg.lucide { width: 14px; height: 14px; }
.colpick-group-head .colpick-grip { margin-left: -4px; }
.colpick-group-head .filter-group-title { flex: 1; }
.colpick-first { font-size: 10px; font-weight: 700; color: var(--primary); background: var(--tint); padding: 2px 6px; border-radius: var(--r-pill); white-space: nowrap; }
.is-dragging { opacity: .45; }
.colpick-item.is-drop-before { box-shadow: inset 0 2px 0 var(--primary); }
.colpick-item.is-drop-after { box-shadow: inset 0 -2px 0 var(--primary); }
.colpick-group.is-drop-before { box-shadow: 0 -2px 0 var(--primary); }
.colpick-group.is-drop-after { box-shadow: 0 2px 0 var(--primary); }
.table thead th[draggable="true"] { cursor: grab; }
.table thead th.is-drop-before { box-shadow: inset 3px 0 0 var(--primary); }
.table thead th.is-drop-after { box-shadow: inset -3px 0 0 var(--primary); }
.colpick-panel.is-group-drag .colpick-options { display: none; }
.colpick-panel.is-group-drag .colpick-group { margin-bottom: 4px; padding: 6px 8px; border: 1px dashed var(--border); border-radius: var(--r-sm); background: var(--surface); }
.colpick-panel.is-group-drag .colpick-group-head { margin-bottom: 0; }
.colpick-panel.is-group-drag .colpick-group-head .t-link { visibility: hidden; }

/* dashboard module styles — component-specific only; shared components live in design.css */

/* ---------- Welcome header ---------- */
.dash-welcome { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; margin-bottom: 28px; }
.dash-welcome-sub { margin: 10px 0 0; font-size: 16px; line-height: 20px; letter-spacing: .5px; color: var(--text); }

/* ---------- Products & Connections panel (client) ---------- */
/* One card, three sections of three rows; --hub-row fixes the row height so rows line up across sections. */
.dash-hub { padding: 24px; margin-bottom: 24px; }
.dash-hub-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
.dash-hub-head .card-sub { margin-top: 6px; }
.dash-hub-count { font-size: 12px; color: var(--text-muted); white-space: nowrap; }
.dash-hub-count b { color: var(--text); }
.dash-hub-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-top: 24px; }
.dash-hub-card { position: relative; display: flex; flex-direction: column; gap: 10px; padding: 16px; border: 1px solid var(--border); border-radius: var(--r-lg); background: var(--surface); min-width: 0; }
.dash-hub-card-top { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 2px; }
.dash-hub-card-top .grow { min-width: 0; }
.dash-hub-card-top .dash-svc-icon { display: inline-grid; place-items: center; }
.dash-hub-name { line-height: 22px; padding-right: 40px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dash-hub-sub { color: var(--text-muted); font-size: 12px; letter-spacing: .5px; margin-top: 4px; }
.dash-hub-card-actions { position: absolute; top: 14px; right: 8px; display: flex; gap: 0; }
.dash-hub-icon-btn { width: 24px; height: 26px; color: var(--link); }
.dash-hub-icon-btn svg.lucide { width: 14px; height: 14px; }
.dash-hub-status { margin-top: 4px; }
.dash-hub-status-green { color: var(--success); }
.dash-hub-status-red { color: var(--error); }
.dash-hub-status-orange { color: var(--warning-dark); }
.dash-hub-status-grey { color: var(--text-muted); }
.dash-hub-fix { margin-left: auto; font-size: 12px; }
.dash-hub-meta, .dash-hub-desc { font-size: 12px; color: var(--text-muted); letter-spacing: .25px; line-height: 1.5; }
.dash-hub-plats { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
.dash-hub-plat { gap: 5px; padding: 0 9px 0 7px; color: var(--text); }
.dash-hub-plat .logo { width: 12px; height: 12px; }
.dash-hub-none { font-size: 13px; padding: 8px 0; }
@media (max-width: 1280px) { .dash-hub-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 720px) { .dash-hub-grid { grid-template-columns: 1fr; } .dash-hub-head { flex-wrap: wrap; } }

/* ---------- Agency KPI grid ---------- */
.dash-top { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; margin-bottom: 24px; }
.dash-donut-card { display: flex; flex-direction: column; padding: 20px; }
.dash-metric { padding: 18px 20px; min-height: 150px; }
.dash-metric .kpi-value { margin: 12px 0 14px; }
.dash-donut-wrap { flex: 1; display: flex; align-items: center; gap: 32px; padding: 8px 4px; }
.dash-donut { position: relative; width: 190px; height: 190px; flex-shrink: 0; }
.dash-donut svg { width: 100%; height: 100%; display: block; }
.dash-donut-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.dash-donut-num { font-family: var(--font-head); font-weight: 700; font-size: 32px; line-height: 36px; }
.dash-legend { flex: 1; display: flex; flex-direction: column; gap: 12px; font-size: 12px; letter-spacing: .5px; min-width: 0; }
.dash-legend-row { display: flex; align-items: center; gap: 10px; }
.dash-legend-sw { width: 16px; height: 6px; border-radius: 3px; flex-shrink: 0; }

.dash-plat-row { display: flex; align-items: center; gap: 10px; font-size: 12px; letter-spacing: .5px; min-height: 30px; }
.dash-plat-name { display: inline-flex; align-items: center; gap: 8px; min-width: 64px; }
.dash-plat-val { margin-left: auto; text-align: right; white-space: nowrap; }
.dash-spend-row { min-height: 36px; }
.dash-bar { flex: 1; height: 6px; min-width: 30px; }
.dash-bar-fill { display: block; height: 100%; border-radius: var(--r-pill); }
.dash-bar-google { background: #FBBC04; }
.dash-bar-meta { background: #0866FF; }
.dash-pct { display: block; color: var(--text-muted); font-size: 11px; }

/* ---------- Attention list ---------- */
.dash-att-card { margin-bottom: 24px; scroll-margin-top: 64px; }
.dash-att-list { display: flex; flex-direction: column; gap: 10px; max-height: 330px; overflow-y: auto; padding-right: 8px; }
.dash-att-item { display: flex; align-items: center; gap: 16px; padding: 16px 14px; border-radius: var(--r-md); background: var(--surface); box-shadow: var(--shadow-light); border: 1px solid var(--border-light); }
.dash-att-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 12px; letter-spacing: .5px; }
.dash-att-desc { font-size: 12px; color: var(--text-muted); margin-top: 8px; letter-spacing: .25px; }
.dash-prio { min-width: 52px; }
.dash-att-cta { white-space: nowrap; }

/* ---------- Filter dropdown (Figma "Managed / Attention Account Filter") ---------- */
.dash-fp { width: 380px; padding: 20px 20px 16px; background: #FBFBFB; }
.dash-fp-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.dash-fp-body { max-height: 320px; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; padding-right: 6px; }
.dash-fp-ghead { display: flex; align-items: center; gap: 8px; }
.dash-fp-toggle { flex: 1; display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; padding: 0; font-size: 14px; text-align: left; }
.dash-fp-ghead .check { font-size: 12px; gap: 6px; }
.dash-fp-opts { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; padding-left: 4px; }
.dash-fp-opts .check { font-size: 14px; }
.dash-fp-foot { display: flex; justify-content: flex-end; gap: 8px; border-top: 1px solid var(--border-light); padding-top: 14px; margin-top: 16px; }

/* ---------- Managed Accounts ---------- */
.dash-search { width: 260px; }
.dash-nowrap { white-space: nowrap; flex-wrap: nowrap; }
.dash-name-link { border: 0; background: none; padding: 0; font-weight: 700; font-size: 12px; text-align: left; color: var(--text); }
.dash-name-link:hover { color: var(--link); text-decoration: underline; }
.dash-table-wrap .table td, .dash-table-wrap .table th { padding: 12px 10px; }
.dash-table-wrap .platform { height: 24px; padding: 0 8px; gap: 4px; }
.dash-table-wrap .chips { gap: 4px; }
.dash-email { display: inline-block; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: middle; }

/* ---------- Client KPIs ---------- */
.dash-kpis { gap: 20px; margin-bottom: 24px; }
.dash-kpis .kpi-sub b.dash-warn { color: var(--warning); }
.dash-kpis .kpi-sub b.dash-bad { color: var(--error); }

// ---------- Deterministic random ----------
function seededRandom(seed) {
  let s = seed * 9301 + 49297;
  return () => {
    s = (s * 9301 + 49297) % 233280;
    return s / 233280;
  };
}

// ---------- Agency CRM (internal) ----------
// One converted CRM account per workspace: account manager, agency assignees, client contacts and live services.
// Each service belongs to a contract with its own dates (a client can have concurrent contracts, e.g. ads and SEO).
// monthlyBudget is SGD; for ad services it is the monthly media budget used for pacing. adAccountIds are the CRM's
// Google Ads customer ID / Meta ad account ID (join keys for auto-linking ad accounts).
const CRM_SERVICE_TYPES = ['SEO', 'Content Marketing', 'SEM', 'Google Ads', 'Facebook Ads', 'Social Media', 'Aurix'];
const CRM_AD_SERVICES = ['SEM', 'Google Ads', 'Facebook Ads'];   // services whose budget is ad spend
const agencyCrm = { status: 'connected', lastSynced: '2026-10-22T07:30:00', accountsSynced: 0 };
const crmAccounts = {};
// Demo variety: media budget relative to the workspace's spend level (below 1 = tighter budget, so pacing runs ahead).
const CRM_BUDGET_FACTOR = { 'ws-technova': 0.8, 'ws-kinspired': 1.25, 'ws-bright': 0.8, 'ws-synergy': 1.3, 'ws-pinnacle': 1.2, 'ws-lumaforge': 0.85 };
// Demo variety: days until each contract ends, by workspace (ads / SEO / content). Others are seeded.
const CRM_DAYS_LEFT = { 'ws-visual': { ads: 72, seo: 41 }, 'ws-bright': { ads: 150, seo: 25 }, 'ws-technova': { ads: 18, seo: 210 }, 'ws-kinspired': { seo: 56 } };
(function crmSeed() {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const contract = (no, months, daysLeft) => {
    const end = new Date(today); end.setDate(end.getDate() + daysLeft);
    const start = new Date(end); start.setMonth(start.getMonth() - months);
    return { contractNo: no, start: iso(start), end: iso(end) };
  };
  workspaces.forEach(ws => {
    const r = seededRandom(ws.seed * 17 + 3);
    const pick = list => list[Math.floor(r() * list.length)];
    const days = CRM_DAYS_LEFT[ws.id] || {};
    const yymm = `${ws.createdAt.slice(2, 4)}${ws.createdAt.slice(5, 7)}`;
    const linked = p => adAccounts.find(a => a.workspaceId === ws.id && a.platform === p);
    const plats = ['google', 'meta'].filter(linked);
    const services = [];
    // Ads contract: a live ad service can exist before its account is linked.
    const ad = plats.length ? plats : ['google'];
    const split = ad.length === 2 ? [0.6, 0.4] : [1];
    const adC = contract(`${yymm}-${String(ws.seed).padStart(3, '0')}`, 12, days.ads ?? pick([34, 88, 120, 165, 240, 300]));
    ad.forEach((p, i) => services.push({ type: p === 'google' ? 'Google Ads' : 'Facebook Ads', monthlyBudget: Math.round(ws.budget * split[i] * (CRM_BUDGET_FACTOR[ws.id] || 1) / 100) * 100, ...adC }));
    // SEO contract: separate, usually 12 months.
    if (seoProjects[ws.id]) services.push({ type: 'SEO', monthlyBudget: 2000 + Math.round(r() * 8) * 500, ...contract(`${yymm}-${String(ws.seed + 40).padStart(3, '0')}`, 12, days.seo ?? pick([48, 95, 130, 200, 280])) });
    // Aurix (OOm chatbot): live for some clients; a few aren't linked to Aurix in Galaxis yet.
    if (['ws-visual', 'ws-kinspired', 'ws-innowave', 'ws-nexgen', 'ws-bright'].includes(ws.id)) services.push({ type: 'Aurix', monthlyBudget: 800, ...contract(`${yymm}-${String(ws.seed + 90).padStart(3, '0')}`, 12, pick([70, 145, 260])) });
    // Content: shorter ad-hoc contracts.
    if (ws.seed % 3 === 0) services.push({ type: 'Content Marketing', monthlyBudget: 1500 + Math.round(r() * 3) * 500, ...contract(`${yymm}-${String(ws.seed + 70).padStart(3, '0')}`, 6, pick([22, 64, 110])) });
    const assigned = members.filter(m => m.org === 'agency' && m.workspaces.includes(ws.id));
    const am = assigned.find(m => m.roleId === 'r-a-am') || members.find(m => m.id === 'm-a3');
    const assignees = [{ role: 'Account Manager', memberId: am.id }];
    if (seoProjects[ws.id]) assignees.push({ role: 'SEO Specialist', memberId: 'm-a2' });
    const pl = assigned.find(m => m.roleId === 'r-a-pl');
    if (pl) assignees.push({ role: 'Project Lead', memberId: pl.id });
    const contacts = members.filter(m => m.org === ws.id).slice(0, 3).map(m => ({ name: m.name, email: m.email, role: m.isPrimary ? 'Primary contact' : 'Marketing' }));
    crmAccounts[ws.id] = {
      crmId: `CRM-${1000 + ws.seed}`, stage: 'converted', convertedAt: ws.createdAt, services, accountManager: am.id, assignees, clientContacts: contacts, source: 'crm',
      adAccountIds: { google: linked('google')?.id || null, meta: linked('meta')?.id || null },
      followUpsDue: [0, 0, 1, 0, 2, 0, 1, 0, 0, 1, 0, 1, 0][(ws.seed - 1) % 13]   // [PLACEHOLDER] open CRM follow-up tasks
    };
  });
  agencyCrm.accountsSynced = Object.keys(crmAccounts).length;
})();


// ---- src/core.js ----
// Galaxis Hub demo — core: state, routing, formatting and shared UI helpers.
// Every module is a classic script; functions called from inline handlers must be global.

const state = {
  ctx: null,              // null = agency ("My Workspace"); otherwise a workspace id
  page: 'dashboard',      // dashboard | organisation | team | integrations | leads
  params: {},             // page-specific route params, e.g. { tab: 'members' } or { leadId }
  persona: 'agency',      // who is viewing a client workspace: 'agency' (agency admin) | 'client' (client user)
  flags: {},              // dev-toolbar scenario flags, owned by each module
  sorts: {},              // table sort state, keyed by table id
  pagers: {},             // pagination state, keyed by table id
  ui: {}                  // per-module transient UI state (search text, open tabs, filters)
};

const screens = {};
const devToggleRegistry = {};

// ---------- Context helpers ----------
function isAgency() { return state.ctx === null; }
function currentWs() { return state.ctx ? workspaces.find(w => w.id === state.ctx) : null; }
function currentOrgId() { return state.ctx || 'agency'; }
function wsById(id) { return workspaces.find(w => w.id === id); }
function activeWorkspaces() { return workspaces.filter(w => !w.archived); }
// The viewer can manage agency-only settings (ad linking, agency access) in this context.
function viewerIsAgency() { return isAgency() || state.persona === 'agency'; }
function productById(id) { return products.find(p => p.id === id); }
function memberById(id) { return members.find(m => m.id === id); }
function roleById(id) { return roles.find(r => r.id === id); }
function teamById(id) { return teams.find(t => t.id === id); }
function wsProducts(wsId) { return workspaceProducts[wsId] || (workspaceProducts[wsId] = {}); }
// The connected, active CRM for a workspace, or null. Drives CRM mode on the dashboard and the Leads nav item.
function activeCrm(wsId) {
  const entries = Object.entries(wsProducts(wsId));
  const hit = entries.find(([pid, s]) => productById(pid)?.category === 'CRM' && s.active && s.status === 'connected');
  return hit ? productById(hit[0]) : null;
}
// The client workspace's single Primary Contact (V1 rule: exactly one per workspace), or null.
function wsPrimaryContact(wsId) { return members.find(m => m.org === wsId && m.isPrimary && m.status !== 'deactivated') || null; }
// One connected product per lane: a workspace can have only one CRM, one chat platform and one call tracker.
const PRODUCT_LANES = {
  crm:   { label: 'CRM', noun: 'CRM', ids: () => products.filter(p => p.category === 'CRM').map(p => p.id) },
  chat:  { label: 'Automated Chat', noun: 'chat platform', ids: () => ['aurix', 'sleekflow', 'wati'] },
  calls: { label: 'Call Tracking', noun: 'call tracker', ids: () => ['delacon'] }
};
function productLane(pid) { return Object.keys(PRODUCT_LANES).find(k => PRODUCT_LANES[k].ids().includes(pid)) || null; }
// The product already holding pid's lane in this workspace (any status), or null.
function laneOccupant(wsId, pid) {
  const lane = productLane(pid);
  if (!lane) return null;
  const hit = PRODUCT_LANES[lane].ids().find(id => id !== pid && wsProducts(wsId)[id]);
  return hit ? productById(hit) : null;
}
// Monthly ad budget for a workspace: the CRM's SEM + Google Ads + Facebook Ads services, else the workspace default.
function wsAdBudget(wsId) {
  const services = (crmAccounts[wsId]?.services || []).filter(x => CRM_AD_SERVICES.includes(x.type));
  return services.length ? services.reduce((t, x) => t + x.monthlyBudget, 0) : (wsById(wsId)?.budget || 0);
}
// CRM services that are live today (started and not yet ended), each with daysLeft until its contract ends.
function crmLiveServices(wsId) {
  const today = toDateInput(new Date());
  return (crmAccounts[wsId]?.services || []).filter(x => (!x.start || x.start <= today) && (!x.end || x.end >= today))
    .map(x => ({ ...x, daysLeft: x.end ? Math.round((new Date(x.end + 'T00:00:00') - new Date(today + 'T00:00:00')) / 86400000) : null }));
}
// Open an OOm product's web app in a new tab (product.url), or say it isn't available in the demo.
function openProductApp(pid) {
  const p = productById(pid);
  if (p?.url) window.open(p.url, '_blank', 'noopener,noreferrer');
  else showToast(`Opening ${p ? p.name : 'the product'}…`, 'external-link');
}
function wsAdAccounts(wsId) { return adAccounts.filter(a => a.workspaceId === wsId); }
function wsPlatforms(wsId) { return ['google', 'meta'].filter(p => wsAdAccounts(wsId).some(a => a.platform === p)); }

// ---------- Screens & routing ----------
// def: { contexts: ['agency','client'], title(), desc(), render() -> html, afterRender?(), key?() -> specs key }
function registerScreen(page, def) { screens[page] = def; }
function registerDevToggles(screenKey, fn) { devToggleRegistry[screenKey] = fn; }

function screenKey() {
  const def = screens[state.page];
  if (def && def.key) return def.key();
  return `${isAgency() ? 'agency' : 'client'}-${state.page}`;
}

function navigate(page, params = {}) {
  const def = screens[page];
  if (!def) return;
  const ctx = isAgency() ? 'agency' : 'client';
  if (def.contexts && !def.contexts.includes(ctx)) page = 'dashboard';
  state.page = page;
  state.params = params;
  closeAllPopovers();
  closeDrawer();
  render();
  window.scrollTo(0, 0);
}

function switchWorkspace(wsId) {
  state.ctx = wsId;
  if (!wsId) state.persona = 'agency';
  const def = screens[state.page];
  const ctx = wsId ? 'client' : 'agency';
  const params = state.page === 'team' || state.page === 'organisation' ? { tab: state.params.tab } : {};
  if (!def || (def.contexts && !def.contexts.includes(ctx))) navigate('dashboard');
  else navigate(state.page, params);
  showToast(wsId ? `Switched to ${wsById(wsId).name}` : 'Switched to My Workspace (Agency)', 'repeat');
}

function render() {
  const def = screens[state.page];
  renderShell();
  const root = document.getElementById('screen-root');
  root.innerHTML = def ? def.render() : '';
  if (def && def.afterRender) def.afterRender();
  renderDevBar();
  refreshIcons();
}

// Re-render only the page body (keeps the shell). Use after state changes inside a screen.
function rerender() {
  const def = screens[state.page];
  const root = document.getElementById('screen-root');
  const y = window.scrollY;
  root.innerHTML = def ? def.render() : '';
  if (def && def.afterRender) def.afterRender();
  renderSidebar();
  renderDevBar();
  refreshIcons();
  window.scrollTo(0, y);
}

// Replace one region's HTML (keeps focus in inputs elsewhere on the page).
function renderRegion(id, html) {
  const el = document.getElementById(id);
  if (!el) return;
  el.innerHTML = html;
  refreshIcons();
}

function refreshIcons() { if (window.lucide) window.lucide.createIcons(); }

// ---------- Formatting ----------
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
// Quote a value for use inside an inline onclick="fn('…')" attribute.
function q(s) { return esc(String(s ?? '').replace(/\\/g, '\\\\').replace(/'/g, "\\'")); }
function fmtMoney(n, dp = 0) { return '$' + Number(n || 0).toLocaleString('en-SG', { minimumFractionDigits: dp, maximumFractionDigits: dp }); }
function fmtNum(n) { return Number(n || 0).toLocaleString('en-SG'); }
function fmtPct(n, dp = 2) { return `${Number(n || 0).toFixed(dp)}%`; }
// Dates follow the Figma copy: "02 Jan 2026" and "6 Sep 2026, 11:32" (day first, SGT).
// Fixed month names: en-GB renders September as "Sept", which Figma does not use.
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
function sgtParts(d) {
  const p = {};
  new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Singapore', year: 'numeric', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false })
    .formatToParts(d).forEach(x => { p[x.type] = x.value; });
  return p;
}
function toDate(v) { return v instanceof Date ? v : new Date(v.length === 10 ? v + 'T00:00:00+08:00' : v); }
function fmtDate(v) {
  if (!v) return '—';
  const p = sgtParts(toDate(v));
  return `${p.day.padStart(2, '0')} ${MONTHS[p.month - 1]} ${p.year}`;
}
function fmtDateTime(v) {
  if (!v) return '—';
  const p = sgtParts(toDate(v));
  return `${Number(p.day)} ${MONTHS[p.month - 1]} ${p.year}, ${p.hour === '24' ? '00' : p.hour}:${p.minute}`;
}
function initials(name) { return String(name || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase(); }
function uid(prefix) { return `${prefix}-${Math.random().toString(36).slice(2, 8)}`; }
function isEmail(s) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(s || '').trim()); }

// ---------- Small render helpers ----------
const STATUS_PILL = { active: ['Active', 'pill-green'], new: ['New', 'pill-blue'], attention: ['Attention Required', 'pill-red'], inactive: ['Inactive', 'pill-orange'], cancelled: ['Cancelled', 'pill-red'], paused: ['Paused', 'pill-grey'] };

// ---------- Modals ----------
// openModal({ title, desc, body, size: 'lg', actions: [{ label, kind: 'primary'|'outline'|'danger', onClick, close: true }] })
// onClick returning false keeps the modal open (e.g. validation failed).
let modalActions = [];
function openModal({ title, desc = '', body = '', actions = [], size = '', onOpen } = {}) {
  modalActions = actions;

  root.innerHTML = `
    <div class="modal-backdrop open" onclick="if (event.target === this) closeModal()">
      <div class="modal ${size === 'lg' ? 'modal-lg' : ''}" role="dialog" aria-modal="true">
        ${title ? `<h3 class="modal-title">${esc(title)}</h3>` : ''}

        <div class="modal-body">${body}</div>
        ${actions.length ? `<div class="modal-actions">${actions.map((a, i) => `<button type="button" class="btn btn-${a.kind || 'primary'}" id="modal-action-${i}" onclick="runModalAction(${i})">${a.icon ? `<i data-lucide="${a.icon}"></i>` : ''}${esc(a.label)}</button>`).join('')}</div>` : ''}
      </div>

function runModalAction(i) {

}
function closeModal() { document.getElementById('modal-root').innerHTML = ''; modalActions = []; }

// Centred confirmation modal (Figma: warning icon, title, grey text, Cancel + Confirm).

// ---------- Menus & popovers ----------
// Markup: <div class="menu-anchor"><button onclick="toggleMenu('id', event)">…</button><div class="menu" id="id">…</div></div>
function toggleMenu(id, ev) {
  if (ev) ev.stopPropagation();
  const el = document.getElementById(id);
  if (!el) return;
  const wasOpen = el.classList.contains('open');
  closeAllPopovers();
  if (wasOpen) return;
  el.classList.add('open');
  el.closest('td, th')?.classList.add('menu-open-cell');
  // Menus inside scrollable tables would be clipped: pin them to the viewport next to their trigger.
  const trigger = ev && ev.currentTarget;
  if (trigger && el.closest('.table-wrap')) {
    const r = trigger.getBoundingClientRect();

      ${d.defaultHidden || d.defaultCollapsed || d.collapsible ? `<button type="button" class="btn btn-ghost btn-sm" onclick="colResetDefault('${id}')" ${colIsDefault(id) ? 'disabled' : ''}>Reset to default</button>` : ''}

function colSet(id, key, on) {

}

  d.hidden = [...h];

}

// ---------- Collapsible column groups ----------
// colLayout(id, cols): cols = the table's visible column defs (each with .group). Returns the columns to render in the
// viewer's order (a collapsed group keeps only its first visible column) and the band groups.
function colLayout(id, cols) {
  const d = columnPickers[id];
  const columns = [], groups = [];
  colGroupOrder(id).forEach(key => {
    const [, label, o = {}] = d.groups.find(g => g[0] === key);
    const items = colSortGroup(id, key, cols.filter(c => c.group === key));
    if (!items.length) return;
    const collapsed = !!d.collapsible && d.collapsed.includes(key);
    const shown = collapsed ? [items[0]] : items;
    const tone = o.tone || 'neutral';
    groups.push({ key, label, tone, collapsed, span: shown.length, hidden: items.length - shown.length });
    shown.forEach((c, i) => columns.push({ ...c, colGroup: key, colTone: tone, colStart: i === 0 }));

}
// Classes for a grouped header or body cell: group tone, plus a separator on each group's first column.
function colCellClass(c) { return c.colGroup ? `colgrp-${c.colTone}${c.colStart ? ' colgrp-start' : ''}` : ''; }

// The lead cell holds "Collapse all / Expand all".
function colGroupHeaderRow(id, layout, { lead = 1, trail = 0 } = {}) {
  const anyOpen = layout.groups.some(g => !g.collapsed);
  const toggleAll = layout.groups.length > 1
    ? `<button type="button" class="colgrp-all" onclick="colSetAllGroups('${id}', ${anyOpen})"><i data-lucide="${anyOpen ? 'chevrons-left-right' : 'chevrons-right-left'}"></i>${anyOpen ? 'Collapse all' : 'Expand all'}</button>` : '';
  const blank = (n, cls, content = '') => n ? `<th class="colgrp-blank ${cls}"${n > 1 ? ` colspan="${n}"` : ''}>${content}</th>` : '';
  return `<tr class="colgrp-row">${blank(lead, 'colgrp-lead', toggleAll)}${layout.groups.map(g => `
    <th class="colgrp-band colgrp-${g.tone} colgrp-start ${g.collapsed ? 'is-collapsed' : ''}"${g.span > 1 ? ` colspan="${g.span}"` : ''}${colDragAttrs(id, 'group', g.key)}>
      <button type="button" class="colgrp-btn" onclick="colToggleGroup('${id}', '${g.key}')" aria-expanded="${!g.collapsed}"
        title="${esc(g.label)} · ${g.collapsed ? `${g.hidden} more column${g.hidden === 1 ? '' : 's'} — click to expand` : 'click to collapse'}">
        <i data-lucide="${g.collapsed ? 'chevron-right' : 'chevron-down'}"></i><span class="colgrp-label">${esc(g.label)}</span>${g.collapsed && g.hidden ? `<span class="colgrp-more">+${g.hidden}</span>` : ''}
      </button></th>`).join('')}${blank(trail, 'colgrp-trail')}</tr>`;

function colToggleGroup(id, key) {
  const d = columnPickers[id];

function colSetAllGroups(id, collapse) {

}
function colSaveGroups(id) {
  const d = columnPickers[id];

// ---------- Pinned first and action columns ----------
// The first column of every table is pinned by CSS; this marks action columns and the scroll state.
// A table's last column is pinned when it is an action column: its header says Action/Actions or carries an
// *action* class, or the header is blank/Remove/Manage and every body row's last cell holds a button or row menu.
function markActionColumns(root = document) {
  root.querySelectorAll('.table-wrap > .table').forEach(table => {
    const head = table.querySelector('thead tr:last-child > :last-child');   // the column-name row, not a group band row
    const rows = [...table.querySelectorAll('tbody tr')].filter(r => r.children.length > 1);
    const explicit = !!head && (/action/i.test(head.textContent) || /action/i.test(head.className));
    const implicit = !!head && /^(remove|manage|)$/i.test(head.textContent.trim()) && rows.length > 0 &&
      rows.every(r => r.lastElementChild.querySelector('button, .menu-anchor, a'));
    table.classList.toggle('has-action-col', explicit || implicit);
    markTableScroll(table.parentElement);
  });
}
// is-overflowing: columns are hidden horizontally; at-end: scrolled fully right, nothing left behind the action column;
// is-scrolled: scrolled away from the start, so columns are passing under the pinned first column.
function markTableScroll(wrap) {
  wrap.classList.toggle('is-overflowing', wrap.scrollWidth > wrap.clientWidth + 1);
  wrap.classList.toggle('at-end', wrap.scrollLeft + wrap.clientWidth >= wrap.scrollWidth - 1);
  wrap.classList.toggle('is-scrolled', wrap.scrollLeft > 1);
}
let actionColFrame;
new MutationObserver(() => { cancelAnimationFrame(actionColFrame); actionColFrame = requestAnimationFrame(() => markActionColumns()); })
  .observe(document.documentElement, { childList: true, subtree: true });
window.addEventListener('resize', () => markActionColumns());
document.addEventListener('scroll', e => { if (e.target.classList?.contains('table-wrap')) markTableScroll(e.target); }, true);

// ---------- Global listeners ----------
document.addEventListener('click', e => {
  if (!e.target.closest('.menu, .filter-panel, .ws-panel, .date-filter, .menu-anchor, [data-popover-trigger]')) closeAllPopovers();
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  closeAllPopovers();
  if (document.getElementById('modal-root').innerHTML) closeModal();
  else if (document.getElementById('drawer-root').innerHTML) closeDrawer();
});
