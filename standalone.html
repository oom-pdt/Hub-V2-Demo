// ---------- Column picker (show / hide columns; shared helper in core.js) ----------
// Name and Action are always shown; every other column (Status included) can be hidden or collapsed with its group.
// Overview group: Ad Format and Status, shown before the metrics (Spend joins them from DASH_CT_COLS).
const DASH_CT_DETAIL_COLS = [{ key: 'format', group: 'details', label: 'Ad Format' }, { key: 'status', group: 'details', label: 'Status' }];
registerColumnPicker('campaigns', {
  columns: () => DASH_CT_DETAIL_COLS.concat(DASH_CT_COLS, activeCrm(state.ctx) ? DASH_CT_CRM_COLS : []),
  groups: [['details', 'Overview', { summary: 'spend', tone: 'neutral' }], ['delivery', 'Impressions', { summary: 'impressions', tone: 'ads' }],
    ['clicks', 'Clicks', { summary: 'ctr', tone: 'ads2' }], ['conversions', 'Conversions', { summary: 'conversions', tone: 'ads' }],
    ['engagement', 'Engagement', { summary: 'engRate', tone: 'ads2' }], ['crm', 'CRM', { summary: 'roas', tone: 'crm' }]],
  collapsible: true,

  defaultHidden: [],
  defaultCollapsed: ['delivery', 'clicks', 'conversions', 'engagement', 'crm'],
  storageKey: 'galaxis-demo:campaign-columns-hidden-v5',
  collapsedKey: 'galaxis-demo:campaign-groups-collapsed-v3'
});

function dashCampaignBody() {
  const u = state.ui;
  const level = u.dashLevel;
  const m = dashMetrics(state.ctx, 'client');
  const crm = !!activeCrm(state.ctx);
  const f = u.dashCtFilter;
  const term = u.dashCtSearch.trim().toLowerCase();
  const byId = new Map(DASH_LEVELS.flatMap(l => m[l].map(e => [e.id, e])));
  const selPaths = u.dashEntSel.map(id => byId.get(id)).filter(Boolean).map(e => e.path);
  let rows = m[level].filter(e => {
    if (u.dashDrill && !dashPathsMatch(e.path, u.dashDrill.path)) return false;
    if (f.platform.length && !f.platform.includes(e.platform)) return false;
    if (f.status.length && !f.status.includes(e.status)) return false;
    if (f.format.length && !e.formats.some(x => f.format.includes(x))) return false;
    if (selPaths.length && !selPaths.some(p => dashPathsMatch(e.path, p))) return false;
    if (term && !`${e.name} ${e.parents.join(' ')} ${PLATFORM_NAME[e.platform]}`.toLowerCase().includes(term)) return false;
    return true;
  });
  if (!state.sorts['dash-ct']) state.sorts['dash-ct'] = { col: 'spend', dir: 'desc' };
  const metricCols = DASH_CT_COLS.concat(crm ? DASH_CT_CRM_COLS : []);
  rows = applySort(rows, 'dash-ct', {
    name: e => e.name.toLowerCase(), format: e => e.formats[0] || '', status: e => DASH_STATUS_RANK[e.status],
    ...Object.fromEntries(metricCols.map(c => [c.key, e => e[c.key] || 0]))
  });
  const total = rows.length;
  const page = paginate(rows, 'dash-ct', 10);
  const ref = m.total;
  const next = DASH_LEVELS[DASH_LEVELS.indexOf(level) + 1];
  // Grouped, collapsible columns (core.js colLayout): Overview · Impressions · Clicks · Conversions · Engagement · CRM.
  const layout = colLayout('campaigns', DASH_CT_DETAIL_COLS.concat(metricCols).filter(c => colVisible('campaigns', c.key)));
  const cols = layout.columns;
  const colDef = Object.fromEntries(metricCols.map(c => [c.key, c]));
  const fn = 'dashRefreshCampaignTable';
  const head = `${colGroupHeaderRow('campaigns', layout, { lead: 1, trail: next ? 1 : 0 })}
    <tr><th>${sortHeader('dash-ct', 'name', DASH_NAME_COL[level], fn)}</th>${cols.map(c => `<th class="${colCellClass(c)}"${colDragAttrs('campaigns', 'col', c.key, c.group)}${colDef[c.key] ? ` title="${esc(colDef[c.key].tip)}"` : ''}>${sortHeader('dash-ct', c.key, c.label, fn)}</th>`).join('')}${next ? '<th>Action</th>' : ''}</tr>`;
  const cell = (e, c) => {
    if (c === 'format') return dashFormatCell(e.formats);
    if (c === 'status') return statusPill(DASH_STATUS_KEY[e.status], e.status);
    const d = colDef[c];
    if (d.needs && !e[d.needs]) return '<span class="t-muted">—</span>';
    const text = d.fmt(e[c] || 0);
    return d.quality ? dashDot(text, dashQuality(e[c], ref[c], d.quality === 'high')) : text;
  };
  const body = page.map(e => `
    <tr ${next ? `class="clickable" onclick="dashDrill('${q(e.id)}')"` : ''}>
      <td>${dashNameCell(e, level)}</td>
      ${cols.map(c => `<td class="dash-nowrap ${colCellClass(c)}">${cell(e, c.key)}</td>`).join('')}
      ${next ? `<td onclick="event.stopPropagation()">${rowMenu(`dash-ctm-${dashHash(e.id)}`, [{ label: `View ${DASH_LEVEL_TAB[next].toLowerCase()} (${e.childCount})`, icon: 'arrow-right', onClick: `dashDrill('${q(e.id)}')` }])}</td>` : ''}
    </tr>`).join('');
  const drill = u.dashDrill ? `<div class="dash-drill"><span>Filtered for ${DASH_LEVEL_LABEL[u.dashDrill.level]}: <b>${esc(u.dashDrill.name)}</b></span><button type="button" class="chip-remove" onclick="dashClearDrill()" aria-label="Clear filter"><i data-lucide="x"></i></button></div>` : '';
  return `${dashEntityChips(byId)}${drill}
    <div class="table-wrap dash-table-wrap"><table class="table table-wrap-heads">
      <thead>${head}</thead>
      <tbody>${body || `<tr><td colspan="${cols.length + 1 + (next ? 1 : 0)}" class="table-empty">No data matches criteria.</td></tr>`}</tbody>
    </table></div>
    ${paginationBar('dash-ct', total, fn)}`;
}
function dashNameCell(e, level) {
  if (level === 'platform') return `<span class="dash-name-plat">${platformLogo(e.platform)}<b>${esc(e.name)}</b></span>`;
  const parent = level === 'campaign' ? PLATFORM_NAME[e.platform] : e.parents.join(' › ');
  return `<div class="dash-name"><span class="dash-name-parent" title="${esc(parent)}">${platformLogo(e.platform)}<span>${esc(parent)}</span></span><b>${esc(e.name)}</b></div>`;
}
function dashFormatCell(formats) {
  if (!formats.length) return '<span class="t-muted">—</span>';
  const more = formats.length > 1 ? `<span class="more-count" title="${esc(formats.slice(1).join(', '))}">+${formats.length - 1}</span>` : '';
  return `<span class="chips dash-nowrap"><span class="chip">${esc(formats[0])}</span>${more}</span>`;
}

// ---------- Entity multi-select dropdown ----------
function dashEntities() {
  const m = dashMetrics(state.ctx, 'client');
  return [
    ...m.campaign.map(e => ({ e, type: 'campaign', parent: `${PLATFORM_NAME[e.platform]} Ads` })),
    ...m.adgroup.map(e => ({ e, type: 'adgroup', parent: `in ${e.campaignName} · ${PLATFORM_NAME[e.platform]}` })),
    ...m.ad.map(e => ({ e, type: 'ad', parent: `in ${e.adGroupName} · ${PLATFORM_NAME[e.platform]}` }))
  ];
}
function dashEntityShown() {
  const term = state.ui.dashEntQ.trim().toLowerCase();
  const type = state.ui.dashEntType;
  return dashEntities().filter(x => (type === 'all' || x.type === type) && (!term || `${x.e.name} ${x.parent}`.toLowerCase().includes(term)));
}
function dashEntityLabel() {
  const sel = state.ui.dashEntSel;
  if (!sel.length) return 'All Campaigns, Groups &amp; Ads';
  const types = dashEntities().filter(x => sel.includes(x.e.id)).map(x => x.type);
  const parts = [];
  const c = types.filter(t => t === 'campaign').length, g = types.filter(t => t === 'adgroup').length, a = types.filter(t => t === 'ad').length;
  if (c) parts.push(`${c} Camp.`);
  if (g) parts.push(`${g} Grp.`);
  if (a) parts.push(`${a} Ad${a > 1 ? 's' : ''}`);
  return `${sel.length} selected (${parts.join(', ')})`;
}
function dashEntityRegion() {
  const all = dashEntities();
  const shown = dashEntityShown();

// totals: the figures the days add up to (default: the workspace total); seed: the random-stream prefix
// (default: the workspace id, so the All Platforms chart keeps its shape). Platform views pass their own.
function dashDailySeries(totals, seed) {
  const ws = currentWs();
  const tot = totals || dashMetrics(ws.id, 'client').total;
  const key = seed || ws.id;
  const range = resolveDateRange(state.dateFilters.client);
  const days = dateRangeDays('client');
  const start = new Date((range ? range.start : toDateInput(new Date())) + 'T00:00:00');
  const phase = dashRng(`${key}:phase`)() * 6;
  const pts = [];
  for (let i = 0; i < days; i++) {
    const d = new Date(start);
    d.setDate(start.getDate() + i);
    const r = dashRng(`${key}:${toDateInput(d)}`);
    const dow = d.getDay();
    const w = Math.max(0.2, 1 + 0.28 * Math.sin(i / 3.1 + phase) + (dow === 0 || dow === 6 ? -0.16 : 0.04) + 0.14 * (r() - 0.5));
    pts.push({ d, w, wc: w * (0.85 + r() * 0.3), wv: w * (0.75 + r() * 0.5) });
  }
  const sw = pts.reduce((s, p) => s + p.w, 0), sc = pts.reduce((s, p) => s + p.wc, 0), sv = pts.reduce((s, p) => s + p.wv, 0);
  return pts.map(p => ({
    d: p.d,
    spend: tot.spend * p.w / sw,
    clicks: Math.round(tot.clicks * p.wc / sc),
    conversions: Math.round(tot.conversions * p.wv / sv)
  }));
}
function dashNiceMax(v) {
  const raw = v / 5;
  const mag = Math.pow(10, Math.floor(Math.log10(raw || 1)));
  const step = [1, 2, 2.5, 5, 10].map(s => s * mag).find(s => s >= raw) || 10 * mag;
  return step * 5;
}
function dashSmoothPath(pts, floor) {
  if (!pts.length) return '';
  let d = `M ${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  const t = 0.16;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    const c1 = [p1[0] + (p2[0] - p0[0]) * t, Math.min(floor, p1[1] + (p2[1] - p0[1]) * t)];
    const c2 = [p2[0] - (p3[0] - p1[0]) * t, Math.min(floor, p2[1] - (p3[1] - p1[1]) * t)];
    d += ` C ${c1[0].toFixed(1)} ${c1[1].toFixed(1)}, ${c2[0].toFixed(1)} ${c2[1].toFixed(1)}, ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
  }
  return d;
}
// Smooth line chart with area fill, axis labels, hover guide and tooltip. Used by Daily Performance and the
// SEO Average Position trend. o: { id, series: [{ d: Date, v }], lo, hi, ticks: [values], fmtAxis(v),
// invert (lo at the top, e.g. ranking positions), tip(i) -> tooltip html, height }
// o: { id, series: [{ d: Date, v }], lo, hi, ticks, fmtAxis, invert, tip(i), height,
//      dateLabel(d) (x-axis text), rotateLabels (angled x labels), allDots (a dot on every point) }
function dashLineChart(wrap, o) {
  if (!wrap) return;
  const svg = wrap.querySelector('svg');
  const series = o.series;
  const n = series.length;
  const W = Math.max(320, wrap.clientWidth || 600), H = o.height || 280;
  const p = { l: 18 + Math.max(...o.ticks.map(v => o.fmtAxis(v).length)) * 7, r: 16, t: 12, b: o.rotateLabels ? 54 : 34 };
  const iw = W - p.l - p.r, ih = H - p.t - p.b;
  const span = (o.hi - o.lo) || 1;
  const x = i => p.l + (n === 1 ? iw / 2 : i * iw / (n - 1));
  const y = v => o.invert ? p.t + (v - o.lo) / span * ih : p.t + ih - (v - o.lo) / span * ih;
  const ticks = n <= 6 ? series.map((_, i) => i) : Array.from({ length: 6 }, (_, j) => Math.round(j * (n - 1) / 5));
  const lbl = o.dateLabel || (d => `${String(d.getDate()).padStart(2, '0')} ${MONTHS[d.getMonth()]}`);
  const bottom = o.invert ? o.hi : o.lo;
  let out = `<defs><linearGradient id="${o.id}-area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#398FF7" stop-opacity=".14"/><stop offset="1" stop-color="#398FF7" stop-opacity="0"/></linearGradient></defs>`;
  o.ticks.forEach(v => {
    out += `<text x="${p.l - 14}" y="${y(v) + 4}" text-anchor="end" class="dash-axis">${o.fmtAxis(v)}</text>`;
    if (v !== bottom) out += `<line x1="${p.l}" x2="${W - p.r}" y1="${y(v)}" y2="${y(v)}" class="dash-grid"/>`;
  });
  out += `<line x1="${p.l}" y1="${p.t}" x2="${p.l}" y2="${p.t + ih}" class="dash-axis-line"/><line x1="${p.l}" y1="${p.t + ih}" x2="${W - p.r}" y2="${p.t + ih}" class="dash-axis-line"/>`;
  ticks.forEach(i => {
    out += o.rotateLabels
      ? `<text x="${x(i)}" y="${p.t + ih + 14}" text-anchor="end" transform="rotate(-45 ${x(i)} ${p.t + ih + 14})" class="dash-axis">${lbl(series[i].d)}</text>`
      : `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" class="dash-axis">${lbl(series[i].d)}</text>`;
  });
  const pts = series.map((s, i) => [x(i), y(s.v)]);
  const line = dashSmoothPath(pts, p.t + ih);
  out += `<path d="${line} L ${x(n - 1)} ${p.t + ih} L ${x(0)} ${p.t + ih} Z" fill="url(#${o.id}-area)"/>`;
  out += `<path d="${line}" fill="none" stroke="#398FF7" stroke-width="1.75" stroke-linejoin="round"/>`;
  (o.allDots ? series.map((_, i) => i) : ticks).forEach(i => { out += `<circle cx="${pts[i][0]}" cy="${pts[i][1]}" r="${o.allDots ? 3 : 3.5}" fill="#66ACFD" stroke="#398FF7" stroke-width="1"/>`; });
  out += `<line class="dash-guide" x1="0" x2="0" y1="${p.t}" y2="${p.t + ih}" stroke="#AEAEAE" stroke-dasharray="3 3" visibility="hidden"/>`;
  out += `<circle class="dash-hover-dot" r="5" fill="#fff" stroke="#398FF7" stroke-width="2" visibility="hidden"/>`;
  out += `<rect class="dash-hover-rect" x="${p.l}" y="${p.t}" width="${iw}" height="${ih}" fill="transparent"/>`;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.setAttribute('height', H);
  svg.innerHTML = out;
  const rect = svg.querySelector('.dash-hover-rect');
  const guide = svg.querySelector('.dash-guide');
  const dot = svg.querySelector('.dash-hover-dot');
  rect.addEventListener('mousemove', ev => {
    const bb = svg.getBoundingClientRect();
    const px = (ev.clientX - bb.left) * (W / bb.width);
    const i = Math.max(0, Math.min(n - 1, Math.round((px - p.l) / (iw || 1) * (n - 1))));
    guide.setAttribute('x1', pts[i][0]); guide.setAttribute('x2', pts[i][0]); guide.setAttribute('visibility', 'visible');
    dot.setAttribute('cx', pts[i][0]); dot.setAttribute('cy', pts[i][1]); dot.setAttribute('visibility', 'visible');
    dashTip(ev, o.tip(i));
  });
  rect.addEventListener('mouseleave', () => { guide.setAttribute('visibility', 'hidden'); dot.setAttribute('visibility', 'hidden'); dashTipHide(); });
}

// Average spend per hour (and cost per conversion) for each weekday × hour, Asia/Singapore.
function dashHeatData() {
  const ws = currentWs();
  const m = dashMetrics(ws.id, 'client');
  const days = dateRangeDays('client');
  const rnd = dashRng(`${ws.id}:heat`);
  const metaShare = m.total.spend && m.byPlatform.meta ? m.byPlatform.meta.spend / m.total.spend : 0;
  const dayF = [1, 1.05, 1.18, 1.08, 1, 0.72, 0.66];
  const w = [], eff = [];
  for (let d = 0; d < 7; d++) {
    w.push([]); eff.push([]);
    for (let h = 0; h < 24; h++) {
      const work = Math.exp(-((h - 14) ** 2) / 14);
      const eve = Math.exp(-((h - 20.5) ** 2) / 5) * metaShare * 0.9;
      const night = h < 6 ? 0.1 : 0.28;
      w[d].push((night + work + eve) * dayF[d] * (0.85 + rnd() * 0.3));
      eff[d].push(0.6 + 0.5 * Math.exp(-((h - 11) ** 2) / 18) + 0.25 * rnd());
    }
  }
  const sumW = w.flat().reduce((a, b) => a + b, 0);
  const meanE = eff.flat().reduce((a, b) => a + b, 0) / 168;
  const occ = Math.max(1, days / 7);
  return {
    spend: w.map(row => row.map(v => m.total.spend * v / sumW / occ)),
    cpa: eff.map(row => row.map(e => m.total.cpa * meanE / e))
  };
}
function dashRamp(n) {
  const stops = [[0, [191, 226, 176]], [0.5, [249, 213, 143]], [1, [243, 160, 156]]];
  const i = n <= 0.5 ? 0 : 1;
  const [a, ca] = stops[i], [b, cb] = stops[i + 1];
  const t = Math.max(0, Math.min(1, (n - a) / (b - a)));
  return `rgb(${ca.map((c, k) => Math.round(c + (cb[k] - c) * t)).join(',')})`;
}
function dashHeatBody() {
  const metric = state.ui.dashHeatMetric;
  const data = dashHeatData()[metric];
  const flat = data.flat();
  const min = Math.min(...flat), max = Math.max(...flat);
  const target = metric === 'spend' ? max : min;
  const pi = flat.indexOf(target);
  const pd = Math.floor(pi / 24), ph = pi % 24;
  let g = '<div></div>';
  for (let h = 0; h < 24; h++) g += `<div class="dash-heat-hour">${h % 3 === 0 ? h : ''}</div>`;
  data.forEach((row, d) => {
    g += `<div class="dash-heat-day">${DASH_DAYS[d]}</div>`;
    row.forEach((v, h) => {
      const n = max > min ? (v - min) / (max - min) : 0;
      g += `<div class="dash-heat-cell" style="background:${dashRamp(n)}" data-d="${d}" data-h="${h}" data-v="${v.toFixed(2)}"></div>`;
    });
  });
  const when = `${DASH_DAYS[pd]} ${String(ph).padStart(2, '0')}:00`;
  const callout = metric === 'spend'
    ? `Peak spend: ${when} (about ${fmtMoney(target, 2)} per hour on average)`
    : `Lowest cost per conversion: ${when} (about ${fmtMoney(target, 2)} per conversion on average)`;
  return `<div class="dash-heat" id="dash-heat">${g}</div>
    <div class="dash-heat-legend"><span>Low</span><span class="dash-heat-ramp"></span><span>High</span></div>
    <div class="dash-heat-callout">${esc(callout)}</div>`;
}
function dashBindHeatmap() {

  });

}

// ---------- Views: All Platforms | Google Ads | Meta Ads ----------
// All Platforms appears with both platforms linked (or more than one ad account); a platform view appears when
// that platform is linked. state.params.view deep-links a view; state.ui.dashAdView remembers the last one.
function dashAdViews(ws) {
  const plats = dashPlatforms(ws.id);
  const accounts = wsAdAccounts(ws.id).filter(a => plats.includes(a.platform));
  return [...(plats.length > 1 || accounts.length > 1 ? ['all'] : []), ...plats];
}
function dashAdView(ws) {
  const views = dashAdViews(ws);
  const v = state.params.view || state.ui.dashAdView || 'all';
  return views.includes(v) ? v : views[0] || 'all';
}
function dashSetAdView(v) {
  state.params = { ...state.params, tab: 'ads', view: v };
  state.ui.dashAdView = v;
  closeAllPopovers();
  rerender();
}
function dashViewLogo(p) { return `<span class="dash-view-logo">${platformLogo(p)}</span>`; }
function dashViewSwitcher(ws, view) {
  const views = dashAdViews(ws);
  if (!views.length) return '';
  const logos = v => v === 'all' ? `<span class="dash-view-logos">${dashPlatforms(ws.id).map(dashViewLogo).join('')}</span>` : dashViewLogo(v);
  const btn = v => `<button type="button" role="tab" aria-selected="${v === view}" class="${v === view ? 'active' : ''}" onclick="dashSetAdView('${v}')">${logos(v)}${DASH_VIEW_LABEL[v]}</button>`;
  const note = views.length === 1 ? `<span class="dash-views-note">Only ${DASH_VIEW_LABEL[views[0]]} is linked to this workspace.</span>` : '';
  return `<div class="dash-views"><div class="seg dash-view-seg" role="tablist" aria-label="Ad platform view">${views.map(btn).join('')}</div>${note}</div>`;
}

// ---------- Mock data ----------
function dashSlug(s) { return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); }
// Date-independent attributes per campaign / ad group / ad, and the Google keyword list.
function dashPfStatic(wsId) {
  const key = `${wsId}|${wsPlatforms(wsId).join(',')}`;
  if (dashCache.pfStatic[key]) return dashCache.pfStatic[key];
  const t = dashTree(wsId);
  const ws = wsById(wsId);
  const site = ws.site || 'www.example.com';
  const attrs = {}, keywords = [];
  const base = pred => t.ads.filter(pred).reduce((s, a) => ({ spend: s.spend + a.base.spend, clicks: s.clicks + a.base.clicks }), { spend: 0, clicks: 0 });
  const round5 = v => Math.max(5, Math.round(v / 5) * 5);
  t.campaigns.forEach(c => {
    const r = dashRng(`${c.id}:platform-attrs`);
    const daily = round5(base(a => a.path.campaign === c.id).spend / 30 * (1.1 + r() * 0.4));
    if (c.platform === 'google') {
      const type = DASH_G_CAMP_TYPE[c.name] || 'Search';
      const bids = DASH_G_BID[type];
      attrs[c.id] = { pfStatus: dashGStatus(c), campType: type, bid: bids[Math.floor(r() * bids.length)], budget: { amount: daily, kind: 'daily', daily } };
    } else {
      const objective = DASH_M_OBJECTIVE[c.name] || 'Traffic';
      const cbo = r() < 0.55, lifetime = r() < 0.35;
      attrs[c.id] = {
        pfStatus: c.status === 'Paused' ? 'Paused' : c.limited ? 'Learning limited' : 'Active', campType: objective, cbo, attribution: DASH_M_ATTRIBUTION,
        budget: cbo ? (lifetime ? { amount: daily * 30, kind: 'lifetime', daily } : { amount: daily, kind: 'daily', daily }) : { note: 'Using ad set budget' }
      };
    }
  });
  t.adGroups.forEach(g => {
    const c = attrs[g.path.campaign];
    const r = dashRng(`${g.id}:platform-attrs`);
    const roll = r(), spread = r();
    const b = base(a => a.path.adgroup === g.id);
    if (g.platform === 'google') {
      attrs[g.id] = { pfStatus: dashGStatus(g), campType: c.campType, agType: DASH_G_AG_TYPE[c.campType] };
      if (c.campType !== 'Search') return;
      const kr = dashRng(`${g.id}:keywords`);
      const brand = ws.name.split(/\s+/)[0].toLowerCase(), ind = (ws.industry || 'services').toLowerCase();
      const cpc = b.clicks ? b.spend / b.clicks : 1;
      const n = 3 + Math.floor(kr() * 4);
      dashShuffle(DASH_KW_POOL, kr).slice(0, n).forEach((tpl, i) => {
        const id = `${g.id}~k${i + 1}`;
        const match = DASH_G_MATCH[Math.floor(kr() * 3)];
        const qs = Math.max(1, Math.min(10, Math.round(2.5 + kr() * 7.5)));
        const w = 0.25 + kr();
        const paused = kr() < 0.1;
        keywords.push({
          id, level: 'keyword', platform: 'google', adgroupId: g.id, name: tpl.replace('{b}', brand).replace('{i}', ind), match, qs, w,
          maxCpc: cpc * (1.15 + kr() * 0.5), pfStatus: g.status === 'Paused' || paused ? 'Paused' : 'Enabled', campType: 'Search',
          parents: [g.campaignName, g.name], campaignName: g.campaignName, adGroupName: g.name, path: { ...g.path, keyword: id }, childCount: 0
        });
      });
    } else {
      const delivery = g.status === 'Paused' ? 'Paused' : g.limited ? 'Learning limited' : roll < 0.25 ? 'Learning' : 'Active';
      const daily = round5(b.spend / 30 * (1.1 + spread * 0.4));
      attrs[g.id] = { pfStatus: delivery, campType: c.campType, attribution: DASH_M_ATTRIBUTION, optGoal: DASH_M_GOAL[c.campType],
        budget: c.cbo ? { note: 'Using campaign budget' } : { amount: daily, kind: 'daily', daily } };
    }
  });
  t.ads.forEach(a => {
    const g = attrs[a.path.adgroup];
    if (a.platform === 'google') attrs[a.id] = { pfStatus: dashGStatus(a), campType: g.campType, adType: DASH_G_AD_TYPE[a.format], finalUrl: `https://${site}/${dashSlug(a.adGroupName)}` };
    else attrs[a.id] = {
      pfStatus: a.status === 'Paused' ? 'Paused' : a.limited ? 'Learning limited' : /^Learning/.test(g.pfStatus) ? g.pfStatus : 'Active',
      campType: g.campType, adFormat: DASH_M_FORMAT[a.format], attribution: DASH_M_ATTRIBUTION
    };
  });
  return (dashCache.pfStatic[key] = { attrs, keywords });
}

// Extra platform metrics for one ad, as ratios of its (date-scaled) consolidated metrics, so they follow the
// date filter. A fixed number of draws keeps every ad's stream stable whatever branch it takes.
function dashPfAdExt(a, att) {
  const r = dashRng(`${a.id}:platform-ext`);
  const u = Array.from({ length: 16 }, () => r());
  const o = Object.fromEntries(DASH_PF_SUM_KEYS.map(k => [k, 0]));
  const video = a.format === 'Video';
  if (a.platform === 'google') {
    o.allConv = Math.round(a.conversions * (1.08 + u[0] * 0.37));
    if (att.campType === 'Search' && a.impressions) {   // impression share: Search campaigns only (10–90%)
      const is = 0.1 + u[1] * 0.8, top = is * (0.55 + u[2] * 0.35), abs = top * (0.35 + u[3] * 0.35), rank = (1 - is) * (0.35 + u[4] * 0.5);
      const elig = a.impressions / is;
      Object.assign(o, { siImpr: a.impressions, siElig: elig, siTop: elig * top, siAbs: elig * abs, siRank: elig * rank, siBudget: elig * (1 - is - rank) });
    }
    if (video) {
      const p25 = 0.55 + u[5] * 0.25, p50 = p25 * (0.6 + u[6] * 0.2), p75 = p50 * (0.6 + u[7] * 0.2), p100 = p75 * (0.55 + u[8] * 0.25);
      Object.assign(o, { vImpr: a.impressions, vViews: Math.round(a.impressions * (0.18 + u[9] * 0.2)), v25: a.impressions * p25, v50: a.impressions * p50, v75: a.impressions * p75, v100: a.impressions * p100 });
    }
    if (!video && u[10] < 0.25) o.storeVisits = Math.round(a.clicks * (0.004 + u[11] * 0.016));   // sparse
  } else {
    o.allClicks = Math.round(a.clicks * (1.5 + u[0] * 1.1));
    o.lpv = Math.round(a.clicks * (0.58 + u[1] * 0.28));
    o.shares = Math.round(a.engagements * (0.008 + u[2] * 0.027));
    o.saves = Math.round(a.engagements * (0.004 + u[3] * 0.016));
    o.igFollows = Math.round(a.engagements * (0.002 + u[4] * 0.007));
    o.igVisits = Math.round(a.engagements * (0.015 + u[5] * 0.035));
    if (u[6] < 0.4) o.msgs = Math.round(a.clicks * (0.02 + u[7] * 0.05));
    if (video) {
      const v25 = Math.round(a.impressions * (0.18 + u[8] * 0.16)), v50 = Math.round(v25 * (0.55 + u[9] * 0.2)), v75 = Math.round(v50 * (0.55 + u[10] * 0.2));
      Object.assign(o, { vImpr: a.impressions, v25, v50, v75, v100: Math.round(v75 * (0.5 + u[11] * 0.25)), thruplays: Math.round(v50 * (0.7 + u[12] * 0.25)) });
    }
    o.addsToCart = Math.round(a.purchases * (2.5 + u[13] * 3));
    o.checkouts = Math.round(a.purchases * (1.4 + u[14]));
  }
  return o;
}
function dashPfDerive(o) {
  dashDerive(o);
  const si = k => o.siElig ? o[k] / o.siElig * 100 : 0;
  o.is = si('siImpr'); o.topIs = si('siTop'); o.absIs = si('siAbs'); o.lostRank = si('siRank'); o.lostBudget = si('siBudget');
  const vr = k => o.vImpr ? o[k] / o.vImpr * 100 : 0;
  o.v25r = vr('v25'); o.v50r = vr('v50'); o.v75r = vr('v75'); o.v100r = vr('v100');
  o.ctrAll = o.impressions ? o.allClicks / o.impressions * 100 : 0;
  o.cpcAll = o.allClicks ? o.spend / o.allClicks : 0;
  o.cplpv = o.lpv ? o.spend / o.lpv : 0;
  o.cpMsg = o.msgs ? o.spend / o.msgs : 0;
  return o;
}
function dashPfSum(items) {
  const o = {};
  DASH_SUM_KEYS.concat(DASH_PF_SUM_KEYS).forEach(k => { o[k] = items.reduce((s, c) => s + (c[k] || 0), 0); });
  return dashPfDerive(o);
}
// Keywords split their ad group's metrics (counts stay whole and add up exactly); impression share varies per keyword.
function dashPfKeywords(st, adgroups) {
  const out = [];
  const keys = DASH_SUM_KEYS.concat(DASH_PF_SUM_KEYS).filter(k => !/^si/.test(k));
  adgroups.forEach(g => {
    const kws = st.keywords.filter(k => k.adgroupId === g.id);
    if (!kws.length) return;
    const r = dashRng(`${g.id}:kw-split`);
    const rows = kws.map(k => ({ ...k }));
    keys.forEach(key => {
      const w = kws.map(k => k.w * (0.8 + r() * 0.4));
      const sw = w.reduce((a, b) => a + b, 0);
      const all = g[key] || 0;
      let left = all;
      rows.forEach((row, i) => {
        if (i === rows.length - 1) { row[key] = Math.max(0, left); return; }
        const v = Math.min(left, DASH_PF_INT_KEYS.has(key) ? Math.round(all * w[i] / sw) : all * w[i] / sw);
        row[key] = v; left -= v;
      });
    });
    const gIs = g.siElig ? g.siImpr / g.siElig : 0;
    rows.forEach(row => {
      const x = r();
      if (gIs && row.impressions) {
        const is = Math.max(0.08, Math.min(0.95, gIs * (0.75 + x * 0.5)));
        const elig = row.impressions / is;
        const topF = g.siTop / g.siImpr, absF = g.siAbs / g.siTop, rankF = g.siRank / ((g.siRank + g.siBudget) || 1);
        Object.assign(row, { siImpr: row.impressions, siElig: elig, siTop: elig * is * topF, siAbs: elig * is * topF * absF, siRank: elig * (1 - is) * rankF, siBudget: elig * (1 - is) * (1 - rankF) });
      } else Object.assign(row, { siImpr: 0, siElig: 0, siTop: 0, siAbs: 0, siRank: 0, siBudget: 0 });
      out.push(dashPfDerive(row));
    });
  });
  return out;
}
// Every level for platform p under the client date filter and the attribution model (CRM columns).
function dashPfData(wsId, p) {
  const m = dashMetrics(wsId, 'client');
  const key = `${wsId}|${m.days}|${state.ui.dashModel || 'mta'}|${wsPlatforms(wsId).join(',')}|${p}`;
  if (dashCache.pf[key]) return dashCache.pf[key];
  const st = dashPfStatic(wsId);
  const ad = m.ad.filter(a => a.platform === p).map(a => dashPfDerive({ ...a, ...st.attrs[a.id], ...dashPfAdExt(a, st.attrs[a.id]) }));
  const roll = (parents, kids, lk) => parents.filter(x => x.platform === p).map(x => {
    const ks = kids.filter(c => c.path[lk] === x.id);
    return { ...x, ...st.attrs[x.id], ...dashPfSum(ks), childCount: ks.length };
  });
  const adgroup = roll(m.adgroup, ad, 'adgroup');
  const campaign = roll(m.campaign, adgroup, 'campaign');
  const keyword = p === 'google' ? dashPfKeywords(st, adgroup) : [];
  adgroup.forEach(g => { g.kwCount = keyword.filter(k => k.path.adgroup === g.id).length; });
  campaign.forEach(c => { c.kwCount = keyword.filter(k => k.path.campaign === c.id).length; });
  return (dashCache.pf[key] = { campaign, adgroup, ad, keyword, total: dashPfSum(campaign), days: m.days });
}

// ---------- Download CSV (the native "Download report") ----------
// Current level, every column switched on in the column picker (collapsed groups included), all filtered rows
// in the current sort order (not just this page), then a total row. Numbers are plain values; money in SGD.
function dashCsvCell(v) {
  if (typeof v === 'number') return String(v);
  let s = String(v ?? '');
  if (/^[=+\-@\t\r]/.test(s)) s = `'${s}`;   // stop spreadsheet formula injection from text cells
  return /[",\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}
function dashPfCsvValue(e, c) {
  const v = e[c.key];
  if (c.t === 'status' || c.t === 'text' || c.t === 'url') return v || '';
  if (c.t === 'budget') return dashPfBudgetText(v);
  if (c.t === 'qs') return v || '';
  if (c.needs && !e[c.needs]) return '';
  return c.t === 'int' ? Math.round(v || 0) : Number((v || 0).toFixed(2));
}
function dashPfCsv(p) {
  try {
    const ws = currentWs();
    const s = dashPfState(p);
    const level = s.level;
    const rows = dashPfRows(p);
    const cols = colOrdered(`pf-${p}`, dashPfLevelCols(p, level).filter(c => colVisible(`pf-${p}`, c.key)));
    const parentHead = level === 'campaign' ? [] : level === 'adgroup' ? ['Campaign'] : ['Campaign', DASH_PF_LEVEL_ONE[p].adgroup];
    const label = c => c.t.startsWith('money') || c.t === 'budget' ? `${c.label} (SGD)` : c.t === 'pct' && !c.label.includes('%') ? `${c.label} (%)` : c.label;
    const parents = e => level === 'campaign' ? [] : level === 'adgroup' ? [e.campaignName] : [e.campaignName, e.adGroupName];
    const lines = [[DASH_PF_NAME_COL[p][level], ...parentHead, ...cols.map(label)]];
    rows.forEach(e => lines.push([e.name, ...parents(e), ...cols.map(c => dashPfCsvValue(e, c))]));
    const tot = dashPfSum(rows);
    if (rows.length) lines.push(['Total', ...parentHead.map(() => ''), ...cols.map(c => c.group === 'attr' ? '' : dashPfCsvValue(tot, c))]);
    const csv = '﻿' + lines.map(r => r.map(dashCsvCell).join(',')).join('\r\n');
    const range = resolveDateRange(state.dateFilters.client) || { start: '', end: '' };
    const name = `${dashSlug(ws.name)}_${p}-ads_${dashSlug(DASH_PF_LEVEL_TAB[p][level])}_${range.start}_${range.end}.csv`;
    const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    state.ui.dashPfLastCsv = { name, rows: rows.length, cols: cols.length + 1 + parentHead.length };
    showToast(`Downloaded ${name}`, 'download');
  } catch (err) {
    showToast('The CSV could not be created. Try again.', 'triangle-alert');
  }
}

function dashPfSpecCommon(name) {
  return `
### Screen Purpose & Objectives
A dedicated **${name}** view inside the Ad Performance tab that replicates the native ${name} report in the Galaxis style, so customers and agency users can stop opening ${name === 'Google Ads' ? 'Google Ads' : 'Meta Ads Manager'}: the full, configurable report is here. Google and Meta are separate views because some columns exist on one platform only. Source of truth for which metrics exist on which platform: the *Google & Meta Ads Metrics* sheet (Metrics (Original) for names and definitions, Metrics (Dev Notes) for API fields). Each metric uses **${name}'s own column name**.

### Key Functional Specifications
- **View switcher**: All Platforms | Google Ads | Meta Ads under the page tabs (rules in \`client-dashboard-ads\`). Route \`view: '${name === 'Google Ads' ? 'google' : 'meta'}'\`.
- **Totals agree with All Platforms**: Cost / Impressions / Clicks / Conversions in this view (KPIs and the table's total row) equal the ${name === 'Google Ads' ? 'Google' : 'Meta'} platform row of the consolidated Campaigns and Ads table for the same dates. Both read the same platform data.
- **Leads & Revenue** (CRM mode): the same section as All Platforms, scoped to this platform. Ad-only mode shows the locked cards and the Connect CRM banner.
- **Report table**: level tabs, search, filter, column picker, **Download CSV**; grouped, collapsible column bands like the native column sets; every column sortable (default Cost / Amount spent, high to low; rows with no data sort last); 10 rows per page (10 / 20 / 50); name column and Action pinned; two-line headers; header tooltips with the sheet's definitions. Name cells show the parent above (campaign: ad account; lower levels: campaign › ad group). A grey **Total** row sums every filtered row (all pages), "Filtered" when a search, filter or drill-down applies; ratios are recalculated from the sums.
- **Drill-down**: clicking a row, or "View …" in the ⋮ menu, opens the next level with a "Filtered for X ✕" badge; ✕ returns to Campaigns. Level tabs keep the drill-down filter.
- **Table principle (22/10/2026; collapsible groups reinstated 23/10/2026 after feedback that they help on long tables)**: these views replicate the native Google Ads and Meta Ads reports as closely as possible, so clients never need the native UIs. **All columns shown by default, in collapsed state**. Every metric group starts collapsed to its primary field ("+N" on the band shows how many columns are folded in); the Attributes / Settings group starts expanded, with Status / Delivery as its primary field when collapsed. "Collapse all / Expand all" above the name column; the column picker hides or shows single columns; **Reset to default** restores the defaults. Choices are remembered per viewer (prototype: localStorage; product: per user). **Reordering (23/10/2026)**: viewers can reorder columns within a group and reorder the groups themselves, by dragging the grip handles in the column picker (arrow keys also work) or dragging the column headers / group bands in the table; columns only move within their own group. **A collapsed group always shows its first column** (the picker tags it "Shown when collapsed"); by default each group's key column is placed first, so the default collapsed view is unchanged. Dragging a whole group in the picker folds every group's column list, leaving just the group names to reorder. The order is remembered per viewer and also drives the CSV export; **Reset to default** restores it.
- Only columns that exist at the current level natively are offered (e.g. Quality Score only for keywords).
- Quality dots (green / orange / red vs this platform's total) on CTR, CPC, CPM and cost per conversion / result.
- **Download CSV** (the native "Download report"): exports the current level, every column switched on in the column picker (collapsed groups included, since collapsing is only a display choice), every filtered row in the current sort order (not only the current page), then a Total row. Name and parent columns (Campaign, Ad group / Ad set) come first. Plain numbers: money in SGD to 2 dp ("(SGD)" in the header), percentages as numbers ("(%)"), "—" cells empty. UTF-8 with BOM for Excel. File name: \`{workspace}_${name === 'Google Ads' ? 'google' : 'meta'}-ads_{level}_{start}_{end}.csv\`. Text cells starting with = + - @ are prefixed with ' so spreadsheets do not run them as formulas.
- **Daily Performance**: below the table, a daily line chart for this platform only (${name === 'Google Ads' ? 'Cost / Conversions / Clicks' : 'Amount spent / Results / Link clicks'} toggle, hover tooltip), adding up to this platform's totals.
- **Date filter**: the shared client date filter applies to every number, as on All Platforms. **Prototype note:** mock data is scaled to the range, not filtered by event date.
- **Mock data**: new platform metrics are generated per ad from their own random streams, so the consolidated numbers never change, and rolled up through the levels as sums or recalculated ratios.

### Open questions
- **Attribution windows differ**: Meta reports conversions under each ad set's attribution setting (default 7-day click, 1-day view); Google uses each conversion action's window and data-driven attribution. Platform totals are not like-for-like; how should All Platforms label or reconcile them?
- **Exact native column sets to support** need performance-team sign-off (which columns, their order and the primary field of each group).
- Are **keyword and search-term reports** needed (Google), and should keywords show search terms, negative keywords or match-type breakdowns?
- **Currency and time zone per ad account**: the prototype assumes SGD and Asia/Singapore. Accounts billed in other currencies or time zones need conversion rules and labelling.
- Should Google conversions be segmentable by **conversion action** (to show Leads / Purchases / Adds to cart separately, as the sheet suggests)?
- Should CRM-attributed columns appear at Google keyword level (needs click-ID matching)?

### Dev toolbar states
- **Viewing as Agency Admin / Client User** (shared). **Ad-only (no CRM)** / **CRM connected**: CRM columns and the Leads & Revenue section. **No ad accounts linked**: empty state. **Single platform (Google only)**: workspaces with both platforms show only the Google Ads view.
`;
}

function orgPad2(n) { return String(n).padStart(2, '0'); }

    };

// ---------- Downloads ----------
function orgDownloadBlob(filename, content, type = 'text/plain;charset=utf-8') {
  const blob = content instanceof Blob ? content : new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.style.display = 'none';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function orgSlug(s) { return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); }

function orgCardHead(title, sub, right = '') {
  return `<div class="card-header"><div><h2 class="h-card org-card-title">${esc(title)}</h2><div class="org-card-sub">${esc(sub)}</div></div>${right}</div>`;
}
function orgKV(label, value, opts = {}) {
  return `<div class="${opts.full ? 'org-kv-full' : ''}"><div class="kv-label">${esc(label)}</div><div class="kv-value">${value === '' || value == null ? '<span class="t-muted">—</span>' : esc(value)}</div>${opts.hint ? `<div class="field-hint" style="margin-top:6px">${esc(opts.hint)}</div>` : ''}</div>`;
}
function orgField(id, label, value, opts = {}) {
  const err = state.ui.orgErrors[id];
  const req = opts.required ? '<span class="req">*</span>' : '';
  let control;
  if (opts.options) {
    control = `<select class="select" id="${id}" ${opts.attrs || ''}>${opts.options.map(o => {
      const [v, l, extra] = Array.isArray(o) ? o : [o, o, ''];
      return `<option value="${esc(v)}" ${String(v) === String(value) ? 'selected' : ''} ${extra || ''}>${esc(l)}</option>`;
    }).join('')}</select>`;
  } else {
    control = `<input class="input ${err ? 'invalid' : ''}" id="${id}" value="${esc(value)}" ${opts.placeholder ? `placeholder="${esc(opts.placeholder)}"` : ''} ${opts.attrs || ''}>`;
  }
  return `<div class="field ${opts.full ? 'org-kv-full' : ''}"><label class="field-label" for="${id}">${esc(label)}${req}</label>${control}
    ${err ? `<div class="field-error">${esc(err)}</div>` : opts.hint ? `<div class="field-hint">${esc(opts.hint)}</div>` : ''}</div>`;
}

function orgSaveBusiness() {
  const id = currentOrgId();
  const cands = orgContactCandidates(id);
  const d = {
    name: orgVal('org-f-name'), uen: orgVal('org-f-uen'), industry: orgVal('org-f-industry'), size: orgVal('org-f-size'),
    founded: orgVal('org-f-founded'), site: orgVal('org-f-site'), address: orgVal('org-f-address'), postal: orgVal('org-f-postal'),
    unit: orgVal('org-f-unit'), building: orgVal('org-f-building'), contactNumber: orgVal('org-f-contactNumber'),
    contactMember: cands.length ? orgVal('org-f-contactMember') : '',
    contactName: cands.length ? '' : orgVal('org-f-contactName'),
    contactEmail: orgVal('org-f-contactEmail')
  };
  const e = {};
  if (!d.name) e['org-f-name'] = 'Organisation name is required.';
  else {
    const clash = [AGENCY_ORG, ...workspaces].find(o => o.id !== id && o.name.trim().toLowerCase() === d.name.toLowerCase());
    if (clash) e['org-f-name'] = `“${clash.name}” already exists. Choose a different name.`;
  }
  if (d.founded && (!/^\d{4}$/.test(d.founded) || +d.founded > 2026 || +d.founded < 1800)) e['org-f-founded'] = 'Enter a 4-digit year, no later than 2026.';
  if (d.site && !/^[^\s]+\.[^\s]{2,}$/.test(d.site)) e['org-f-site'] = 'Enter a valid domain, e.g. example.com.';
  if (!/^\d{6}$/.test(d.postal)) e['org-f-postal'] = 'Postal code must be 6 digits.';
  if (d.contactNumber && !/^\+?[\d\s-]{8,}$/.test(d.contactNumber)) e['org-f-contactNumber'] = 'Enter a valid phone number, e.g. +65 0000 0000.';
  if (cands.length) { if (!d.contactMember) e['org-f-contactMember'] = 'Choose the primary contact.'; }
  else {
    if (!d.contactName) e['org-f-contactName'] = 'Contact person is required.';
    if (!isEmail(d.contactEmail)) e['org-f-contactEmail'] = 'Enter a valid email address.';
  }
  if (Object.keys(e).length) {
    state.ui.orgDraft = d; state.ui.orgErrors = e;
    rerender();
    document.getElementById(Object.keys(e)[0])?.focus();
    return;
  }
  const ent = orgEntity(id), p = orgProfile(id);
  const renamed = ent.name !== d.name;
  Object.assign(ent, { name: d.name, industry: d.industry, site: d.site });
  Object.assign(p, { uen: d.uen, size: d.size, founded: d.founded, address: d.address, postal: d.postal, unit: d.unit, building: d.building, contactNumber: d.contactNumber });
  if (cands.length) {
    // Single-primary rule (V1): exactly one Primary Contact per workspace.
    members.filter(m => m.org === id).forEach(m => { m.isPrimary = m.id === d.contactMember; });
    const m = memberById(d.contactMember);
    p.contactName = m.name; p.contactEmail = m.email;
  } else { p.contactName = d.contactName; p.contactEmail = d.contactEmail; }
  if (orgBillingStore[id] && renamed) orgBillingStore[id].contact.legal = /pte|ltd|inc\.?$/i.test(d.name) ? d.name : `${d.name} Pte Ltd`;
  state.ui.orgEdit.business = false; state.ui.orgDraft = null; state.ui.orgErrors = {};
  render(); // full render: the workspace switcher and header show the new name
  showToast(renamed ? `Saved — organisation renamed to ${d.name}` : 'Business information saved');
}

  }
  const today = toDateInput(new Date());
  const live = x => (!x.start || x.start <= today) && (!x.end || x.end >= today);
  const total = acc.services.filter(live).reduce((t, x) => t + x.monthlyBudget, 0);
  const am = memberById(acc.accountManager);

      <td>${live(x) ? '<span class="pill pill-sm pill-green">Live</span>' : x.start > today ? '<span class="pill pill-sm pill-blue">Upcoming</span>' : '<span class="pill pill-sm pill-grey">Ended</span>'}</td></tr>`;
  }).join('');
  return `<section class="card org-section">${head}
    <div class="org-svc-kpis">
      <div><div class="kv-label">Total monthly budget</div><div class="org-plan-value">${fmtMoney(total)}</div><div class="org-plan-sub">Live services only</div></div>

      <div><div class="kv-label">Account manager</div><div class="org-plan-value">${esc(am?.name || '—')}</div><div class="org-plan-sub">${esc(am?.email || 'Not mapped to a Galaxis user')}</div></div>
    </div>
    <div class="table-wrap org-svc-table"><table class="table">
      <thead><tr><th>Service</th><th>Contract</th><th class="num">Monthly budget</th><th>Start date</th><th>End date</th><th>Days left</th><th>Status</th></tr></thead>
      <tbody>${rows || '<tr><td class="table-empty" colspan="7">No services in the CRM record.</td></tr>'}</tbody></table></div>

function orgSavePlan() {
  const id = currentOrgId();
  const b = orgBilling(id);
  const planId = document.querySelector('input[name="org-plan"]:checked')?.value;
  const cycle = document.querySelector('input[name="org-cycle"]:checked')?.value || b.cycle;
  const plan = ORG_PLANS.find(p => p.id === planId);
  const used = orgSeatsUsed(id);
  if (plan.seats < used) {
    document.getElementById('org-plan-error').textContent = `${plan.name} includes ${plan.seats} seats, but ${used} are in use. Remove members or choose a larger plan.`;
    return false;
  }
  const changed = plan.id !== b.plan || cycle !== b.cycle;
  b.plan = plan.id; b.cycle = cycle;
  if (id === 'agency') AGENCY_ORG.seats = plan.seats; else b.seats = plan.seats;

function orgSaveCard(update) {
  const b = orgBilling();
  const holder = orgVal('org-c-holder'), num = orgVal('org-c-number').replace(/[\s-]/g, ''), exp = orgVal('org-c-expiry'), cvc = orgVal('org-c-cvc'), email = orgVal('org-c-email');
  const errs = [];
  if (!holder) errs.push('Enter the cardholder name.');
  if (!/^\d{13,19}$/.test(num)) errs.push('Card number must be 13–19 digits.');
  const m = exp.match(/^(\d{2})\/(\d{2})$/);
  if (!m || +m[1] < 1 || +m[1] > 12) errs.push('Expiry must be in MM/YY format.');
  else if (new Date(2000 + +m[2], +m[1], 0) < new Date(ORG_DEMO_TODAY)) errs.push('This card has expired.');
  if (!/^\d{3,4}$/.test(cvc)) errs.push('CVC must be 3 or 4 digits.');
  if (!isEmail(email)) errs.push('Enter a valid billing email.');
  document.querySelectorAll('#modal-root .input').forEach(el => el.classList.remove('invalid'));
  if (errs.length) { document.getElementById('org-card-error').innerHTML = errs.map(esc).join('<br>'); return false; }
  const brand = num[0] === '4' ? 'Visa' : num[0] === '5' ? 'Mastercard' : num[0] === '3' ? 'Amex' : 'Card';
  const info = { brand, last4: num.slice(-4), expiry: exp, holder };
  b.billingEmail = email;
  if (update) Object.assign(b.cards.find(c => c.isDefault), info);
  else {
    const makeDefault = !b.cards.length || document.getElementById('org-c-default')?.checked;
    if (makeDefault) b.cards.forEach(c => { c.isDefault = false; });
    b.cards.push({ id: uid('card'), ...info, isDefault: makeDefault });
  }
  rerender();
  showToast(update ? `Card updated — ${brand} •••• ${info.last4}` : `${brand} •••• ${info.last4} added`, 'credit-card');
}
function orgMakeDefaultCard(cardId) {
  const b = orgBilling();
  b.cards.forEach(c => { c.isDefault = c.id === cardId; });
  const c = b.cards.find(x => x.id === cardId);
  rerender();
  showToast(`${c.brand} •••• ${c.last4} is now the default card`, 'credit-card');
}
function orgRemoveCard(cardId) {
  const b = orgBilling();
  const c = b.cards.find(x => x.id === cardId);
  confirmDialog({
    title: 'Remove card?', text: `${c.brand} •••• ${c.last4} will no longer be available for billing.`, confirmLabel: 'Remove', danger: true,
    onConfirm: () => { b.cards = b.cards.filter(x => x.id !== cardId); rerender(); showToast('Card removed'); }
  });
}

function orgDownloadAsset(assetId) {
  const id = currentOrgId();
  const a = orgBrand(id).assets.find(x => x.id === assetId);
  if (!a) return;
  if (a.dataUrl) {
    const link = document.createElement('a');
    link.href = a.dataUrl; link.download = a.fileName; document.body.appendChild(link); link.click(); link.remove();
  } else {
    const text = [
      `PLACEHOLDER DOCUMENT — ${a.name.toUpperCase()} (${a.kind})`,
      `Organisation: ${orgEntity(id).name}`,
      '',
      'This file stands in for the real brand asset, which has not been supplied yet.',
      '',
      'Generated by the Galaxis Hub demo prototype.'
    ].join('\n');
    orgDownloadBlob(`${orgSlug(orgEntity(id).name)}-${orgSlug(a.name)}-PLACEHOLDER.txt`, text);
  }
  showToast(`Downloaded ${a.name}${a.dataUrl ? '' : ' (placeholder)'}`, 'download');
}
function orgAssetPicked(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  if (file.size > 5 * 1024 * 1024) { showToast('Brand assets must be 5 MB or smaller in this demo', 'triangle-alert'); input.value = ''; return; }
  const orgId = currentOrgId();
  const reader = new FileReader();
  reader.onload = () => {
    const ext = (file.name.split('.').pop() || 'File').toUpperCase();
    const size = file.size > 1024 * 1024 ? `${(file.size / 1024 / 1024).toFixed(1)} MB` : `${Math.max(1, Math.round(file.size / 1024))} KB`;
    orgBrand(orgId).assets.push({ id: uid('asset'), name: file.name.replace(/\.[^.]+$/, ''), kind: ext, icon: 'file', size, dataUrl: reader.result, fileName: file.name });
    rerender();
    showToast(`${file.name} uploaded`, 'upload');
  };
  reader.readAsDataURL(file);
}
function orgRemoveAsset(assetId) {
  const br = orgBrand();
  const a = br.assets.find(x => x.id === assetId);
  confirmDialog({
    title: 'Remove brand asset?', text: `“${a.name}” will no longer be available to your team and agency partners.`, confirmLabel: 'Remove', danger: true,
    onConfirm: () => { br.assets = br.assets.filter(x => x.id !== assetId); rerender(); showToast('Brand asset removed'); }
  });
}

function teamPermGroups(scope) { return permissionCatalogue.filter(g => !g.scope || g.scope === scope); }
function teamGroupPermIds(g) { return g.subgroups.flatMap(sg => sg.perms.map(p => p.id)); }
function teamAllPermIds(scope) { return teamPermGroups(scope).flatMap(teamGroupPermIds); }
function teamPermById(id) { for (const g of permissionCatalogue) for (const sg of g.subgroups) { const p = sg.perms.find(x => x.id === id); if (p) return p; } return null; }
// Does a role grant a permission? Locked roles hold '*'.
function teamRoleHas(role, permId) { return !!role && (role.perms.includes('*') || role.perms.includes(permId)); }

// Seed sensible permissions for the non-locked roles (only where none are set yet).
(function teamSeedRolePerms() {
  const view = ['org.view', 'members.view', 'teams.view', 'roles.view', 'integ.view', 'integ.open'];
  const seed = {
    'r-a-am':       [...view, 'perm-ws-view', 'perm-ws-client', 'perm-ad-map', 'perm-team-invite', 'members.edit'],
    'r-a-seolead':  [...view, 'perm-ws-view', 'teams.edit', 'teams.products'],
    'r-a-pl':       [...view, 'perm-ws-view', 'perm-ws-client', 'perm-team-invite', 'members.edit', 'teams.create', 'teams.edit', 'teams.products'],
    'r-a-analyst':  ['org.view', 'members.view', 'integ.view', 'integ.open', 'perm-ws-view', 'perm-ws-client'],
    'r-a-viewer':   ['org.view', 'perm-ws-view'],
    'r-c-admin':    teamAllPermIds('client').filter(id => !['roles.delete', 'settings.billing', 'settings.security'].includes(id)),
    'r-c-hom':      [...view, 'org.edit', 'org.brand', 'perm-team-invite', 'members.edit', 'teams.create', 'teams.edit', 'teams.products', 'integ.connect', 'integ.activate'],
    'r-c-mexec':    [...view, 'org.brand'],
    'r-c-hor':      [...view, 'perm-team-invite', 'members.edit', 'teams.edit'],
    'r-c-exec':     [...view],
    'r-c-sales':    ['org.view', 'members.view', 'integ.view', 'integ.open'],
    'r-c-employee': ['org.view', 'integ.view', 'integ.open']
  };
  roles.forEach(r => { if (!r.locked && (!r.perms || !r.perms.length) && seed[r.id]) r.perms = [...seed[r.id]]; });
})();

// Members in this org, roles in this scope.
function teamOrgMembers(org = currentOrgId()) { return members.filter(m => m.org === org); }
function teamOrgTeams(org = currentOrgId()) { return teams.filter(t => t.org === org); }
function teamScopeRoles(scope = teamScope()) { return roles.filter(r => r.org === scope); }
// Lowest role (V1: deleting a role downgrades its members to Viewer). Client equivalent: Employee.
function teamLowestRole(scope, excludeId) {
  const pref = roles.find(r => r.id === (scope === 'agency' ? 'r-a-viewer' : 'r-c-employee') && r.id !== excludeId);
  if (pref) return pref;
  const list = teamScopeRoles(scope).filter(r => r.id !== excludeId);
  return list.filter(r => !r.locked).pop() || list.pop() || null;
}
// Products this org can hand out (connected workspace products plus whatever its teams and members already use).
function teamOrgProducts(org = currentOrgId()) {
  const ids = new Set();
  if (org === 'agency') products.filter(p => p.provider === 'oom').forEach(p => ids.add(p.id));
  else Object.entries(wsProducts(org)).forEach(([pid, s]) => { if (s.status !== 'disabled') ids.add(pid); });
  teamOrgTeams(org).forEach(t => t.products.forEach(p => ids.add(p)));
  teamOrgMembers(org).forEach(m => (m.products || []).forEach(p => ids.add(p)));
  if (!ids.size) products.filter(p => p.provider === 'oom').forEach(p => ids.add(p.id));
  return products.filter(p => ids.has(p.id));
}
function teamNameFromEmail(email) {
  const local = String(email).split('@')[0].replace(/[._-]+/g, ' ').replace(/\d+/g, '').trim();
  return local ? local.replace(/\b\w/g, c => c.toUpperCase()) : 'Pending User';
}
function teamWsAgencyMembers(wsId) {

// accessors: { key: item => value | [values] }

function teamSeatCard() {
  const ws = currentWs();
  const list = teamOrgMembers(ws.id);
  const active = list.filter(m => m.status === 'active').length;
  const pending = list.filter(m => m.status === 'pending').length;
  const inactive = list.filter(m => m.status === 'inactive' || m.status === 'deactivated').length;
  const awaiting = list.filter(m => m.status === 'awaiting').length;   // CRM contacts not invited yet: no seat until approved
  const used = active + pending + inactive;
  const pct = Math.min(100, Math.round(used / TEAM_SEATS_TOTAL * 100));
  return `<section class="card team-seat-card" aria-label="Seat usage">
    <div class="row-between"><h2 class="team-seat-name">${esc(ws.name)}</h2><div class="team-seat-count">${used} / ${TEAM_SEATS_TOTAL} Seats Used</div></div>
    <div class="progress team-seat-bar" role="progressbar" aria-valuenow="${used}" aria-valuemin="0" aria-valuemax="${TEAM_SEATS_TOTAL}"><span style="width:${pct}%"></span></div>
    <div class="legend team-seat-legend">
      <span><span class="dot dot-green-strong"></span>${active} Active Member${active === 1 ? '' : 's'}</span>
      <span><span class="dot team-dot-link"></span>${pending} Pending Invite${pending === 1 ? '' : 's'}</span>
      <span><span class="dot dot-grey"></span>${inactive} Inactive Member${inactive === 1 ? '' : 's'}</span>

function teamFormRoleChange() {

function teamSaveMember(id) {
  const org = currentOrgId();
  const agency = isAgency();
  const existing = id ? memberById(id) : null;
  const email = document.getElementById('team-f-email').value.trim();
  if (!existing) {
    if (!email) return teamFieldError('team-f-email', 'Member email is required.');
    if (!isEmail(email)) return teamFieldError('team-f-email', 'Enter a valid email address, e.g. name@example.com.');
    if (members.some(x => x.org === org && x.email.toLowerCase() === email.toLowerCase())) return teamFieldError('team-f-email', 'This email already belongs to a member of this organisation.');
  }
  const teamId = document.getElementById('team-f-team').value || null;
  const roleId = document.getElementById('team-f-role').value;
  const team = teamById(teamId);
  const m = existing || { id: uid('m'), org, name: teamNameFromEmail(email), email, status: 'pending', lastActive: null, lastProduct: null, products: [] };
  if (!existing || existing.teamId !== teamId) m.products = team ? [...team.products] : (existing ? m.products : []);
  m.teamId = teamId;
  m.roleId = roleId;
  if (agency) m.workspaces = roleById(roleId)?.locked ? ['*'] : [...(state.ui.teamFormWs || [])];
  else {
    m.canManage = document.getElementById('team-f-manage').checked;
    const primary = document.getElementById('team-f-primary').checked;
    // V1 strict single Primary Contact: setting one clears every other primary in this workspace.
    if (primary) members.forEach(x => { if (x.org === org) x.isPrimary = false; });
    m.isPrimary = primary;
  }
  if (!existing) members.push(m);
  if (!agency) rerender(); else teamRefresh();
  showToast(existing ? `Access updated for ${m.name}` : `Invitation sent to ${email}`, existing ? 'check-circle' : 'send');
}

function teamSaveTeam(id) {

function teamRoleDraft() {
  const scope = teamScope();
  const key = `${scope}:${state.params.edit}`;
  let d = state.ui.teamRoleDraft;
  if (!d || d.key !== key) {
    const r = state.params.edit === 'new' ? null : roleById(state.params.edit);

    };
  }
  return d;
}
function teamPermMatches(p, s) { return !s || `${p.title} ${p.desc}`.toLowerCase().includes(s); }
function teamRoleNavHtml() {
  const d = teamRoleDraft();
  const s = d.search.trim().toLowerCase();
  const groups = teamPermGroups(d.scope).filter(g => g.subgroups.some(sg => sg.perms.some(p => teamPermMatches(p, s)) || g.name.toLowerCase().includes(s)));

  return groups.map(g => {

  state.ui.teamQueue[state.ctx] = teamQueue().filter(x => x !== id);
  teamAgencyChanged();
  showToast(`Access granted to ${m.name}`, 'user-check');
}
function teamSaveAllQueued() {
  const ids = [...teamQueue()];
  ids.forEach(id => { const m = memberById(id); if (m && !m.workspaces.includes(state.ctx)) m.workspaces.push(state.ctx); });
  state.ui.teamQueue[state.ctx] = [];
  teamAgencyChanged();
  showToast(`Saved access for ${ids.length} member${ids.length === 1 ? '' : 's'}`, 'check-check');
}
function teamConfirmRevoke(id) {
  const m = memberById(id);
  const ws = currentWs();
  confirmDialog({
    title: 'Revoke Agency Access?',
    text: `${m.name} will no longer be able to open ${ws.name}, and it will disappear from their workspace switcher. You can give access again at any time.`,
    confirmLabel: 'Revoke Access', danger: true, icon: 'user-x',
    onConfirm: () => { m.workspaces = m.workspaces.filter(w => w !== state.ctx); teamAgencyChanged(); showToast(`Access revoked for ${m.name}`, 'user-x'); }
  });
}
function teamAgencyTable() {
  const T = 'team-agency';
  const queued = teamQueue().map(memberById).filter(Boolean);
  const assigned = teamAgencyAssigned();
  const cells = m => `<td><div class="team-name">${esc(m.name)}</div></td><td>${esc(roleById(m.roleId)?.name || '—')}</td><td>${esc(teamById(m.teamId)?.name || '—')}</td>
    <td>${esc(m.email)}</td><td>${productChips(m.products)}</td>`;
  const qRows = queued.map(m => `<tr class="team-row-pending">${cells(m)}<td class="team-td-action"><div class="team-row-actions"><span class="team-pending-tag">Pending</span>
      <button type="button" class="btn btn-outline btn-sm" onclick="teamRemoveQueued('${m.id}')">Remove</button><button type="button" class="btn btn-primary btn-sm" onclick="teamSaveQueued('${m.id}')">Save</button></div></td></tr>`).join('');
  const aRows = paginate(assigned, T).map(m => `<tr>${cells(m)}<td class="team-td-action">${m.workspaces.includes('*')
      ? `<span class="team-default-access">Default access ${infoTip('Agency Admins and Owners have access to every client workspace, so they are listed by default and can’t be revoked here.')}</span>`
      : `<button type="button" class="btn btn-danger-outline btn-sm" onclick="teamConfirmRevoke('${m.id}')">Revoke Access</button>`}</td></tr>`).join('');
  const head = `<th>${sortHeader(T, 'name', 'Name', 'teamRefresh')}</th><th>${sortHeader(T, 'role', 'Role', 'teamRefresh')}</th><th>${sortHeader(T, 'team', 'Team', 'teamRefresh')}</th>
    <th>Email</th><th>Product Responsibility</th><th class="team-th-action">Access</th>`;
  return teamTable(T, head, qRows + aRows, assigned.length, emptyState('user-search', 'No agency users have access.', 'Search above to assign.'));
}

function integTargets(pid) { const sc = INTEG_SCHEMA[pid]; return sc ? INTEG_TARGETS[sc.set] : null; }
// A saved mapping is { galaxisKey: vendorField }; anything else (older drafts) falls back to the auto-match.
function integDefaultMapping(pid, saved) {
  const t = integTargets(pid);
  if (!t) return {};
  if (saved && Object.keys(saved).every(k => t.some(x => x.key === k))) return { ...saved };

function integNow() { return new Date().toISOString(); }

// Every connected product is listed under Active Products (one per lane, so there is no connected-but-inactive state).
function integInActiveSection(e) { return !!e; }

function integStatusDots(pid, wsId = state.ctx) {
  const e = integEntry(pid, wsId);
  if (!e) return integDot('grey', 'Not Connected');
  if (e.status === 'pending') return integDot('orange', 'Pending Setup');
  if (e.status === 'error') return integDot('red', 'Error');
  if (e.status === 'disabled') return integDot('grey', 'Disabled');
  return integDot('green', 'Connected') + (e.active ? integDot('green', 'Active') : integDot('grey', 'Inactive'));
}

function integMatches(p) {
  const t = state.ui.integSearch.trim().toLowerCase();
  return !t || [p.name, p.category, p.description, p.dataShared].join(' ').toLowerCase().includes(t);
}

// ---------- Rules: connect / enable / disable / disconnect ----------
// One per lane: a workspace can connect only one CRM, one chat platform and one call tracker (PRODUCT_LANES).
// Connecting a second one asks to replace the current one, which is disconnected when the new one is saved.
function integReplaceText(pid, old) {
  const lane = PRODUCT_LANES[productLane(pid)];
  return `Only one ${lane.noun} can be connected at a time. Connecting ${productById(pid).name} will disconnect ${old.name}. Data already synced from ${old.name} will not be deleted.`;
}

function integConnect(pid) {
  const old = laneOccupant(state.ctx, pid);
  if (old) {
    confirmDialog({ title: `Replace ${old.name}?`, text: integReplaceText(pid, old), confirmLabel: `Replace with ${productById(pid).name}`,
      onConfirm: () => setTimeout(() => integBeginConnect(pid), 0) });
    return;
  }
  integBeginConnect(pid);
}

function integBeginConnect(pid) {
  const p = productById(pid);
  const crm = activeCrm(state.ctx);
  if (INTEG_ROUTABLE.includes(pid) && crm && INTEG_THIRD_CRMS.includes(crm.id) && !integEntry(pid)) { integOpenRouting(pid); return; }
  if (p.flow === 'internal') {
    closeDrawer();
    const old = integCommit(pid).replaced;
    showToast(old ? `${p.name} connected. ${old.name} was disconnected.` : `${p.name} connected and active`);
    return;
  }
  integOpenSetup(pid);
}

// Remove a product's entry; products routed through a CRM lose their path.
function integRemove(pid, verb) {
  if (productById(pid).category === 'CRM') integOrphanRouted(pid, verb);
  delete wsProducts(state.ctx)[pid];
}

// Write a connected entry. Any other product in the same lane is disconnected (one per lane).
// Swaps only happen here, on save, so closing the config drawer changes nothing.
function integCommit(pid, { extra = {} } = {}) {
  const entries = wsProducts(state.ctx);
  const replaced = laneOccupant(state.ctx, pid);
  if (replaced) integRemove(replaced.id, 'replaced');
  const e = Object.assign({}, entries[pid], { status: 'connected', active: true, lastSynced: integNow() }, extra);
  delete e.error;
  entries[pid] = e;
  render();
  return { entry: e, replaced };
}

// Products routed through a CRM lose their path when that CRM stops syncing.
function integOrphanRouted(crmId, verb) {
  const crm = productById(crmId);
  Object.entries(wsProducts(state.ctx)).forEach(([pid, e]) => {
    if (e.routedVia !== crmId) return;
    delete e.routedVia;
    e.status = 'pending'; e.active = false;
    e.error = `Routing via ${crm.name} stopped because ${crm.name} was ${verb}. Connect ${productById(pid).name} directly to resume syncing.`;
  });
}

// Re-enable a disabled product.
function integActivate(pid) {
  const p = productById(pid);
  const e = integEntry(pid);
  e.status = 'connected'; e.active = true; e.lastSynced = integNow(); delete e.error;
  closeDrawer();
  render();
  showToast(`${p.name} is active`);
}

function integDisable(pid) {
  const p = productById(pid);
  confirmDialog({
    title: 'Disabling This Product?',
    text: 'Disabling this product will pause data synchronisation, so new updates will no longer be reflected. You can activate it again whenever you’re ready.',
    confirmLabel: 'Disable',
    onConfirm: () => {
      const e = integEntry(pid);
      e.status = 'disabled'; e.active = false;
      if (p.category === 'CRM') integOrphanRouted(pid, 'disabled');
      closeDrawer();
      render();
      showToast(`${p.name} disabled. Sync is paused.`, 'pause');
    }
  });
}

// Fixes V2: removes only this product's entry instead of resetting every integration.
function integDisconnect(pid) {
  const p = productById(pid);
  confirmDialog({
    title: 'Disconnect This Product?',
    text: 'This will remove the product’s connection from your workspace. Existing data will not be deleted. You’ll need to reconnect it to use the product again. This action cannot be undone.',
    confirmLabel: 'Disconnect',
    danger: true,
    onConfirm: () => {
      integRemove(pid, 'disconnected');
      closeDrawer();
      if (state.page === 'integration-setup') { state.ui.integCfg = null; navigate('integrations'); } else render();
      showToast(`${p.name} disconnected`, 'unplug');
    }
  });
}

}
function integRouteYes(pid) {

// ---------- About slide-over + connection set-up screen ----------
// About stays a slide-over (product details before connecting). Connecting or configuring a product opens the
// dedicated set-up screen ('integration-setup') with breadcrumbed steps. Nothing is saved until the last step.
// Global entry point for other modules: integOpenProduct('sleekflow', 'config') from anywhere in a client workspace.
function integOpenProduct(pid, mode = 'about', wsId) {
  if (wsId && wsId !== state.ctx) state.ctx = wsId;
  if (mode === 'config') { integOpenSetup(pid); return; }
  if (state.page !== 'integrations') navigate('integrations');
  integOpenDrawer(pid, mode);
}

function integOpenDrawer(pid, mode = 'about') {
  if (mode === 'config') { integOpenSetup(pid); return; }
  openDrawer(`<div id="integ-drawer">${integAboutHTML(pid)}</div>`, integDrawerFooter(pid));
}

function integDrawerHead(p) {
  return `<div class="integ-drawer-head">${productLogo(p.id, 40)}<div><div class="h-card">${esc(p.name)}</div><div class="integ-cat">${esc(p.category)}</div><div class="integ-dots">${integStatusDots(p.id)}</div></div></div>`;
}

function integAboutHTML(pid) {
  const p = productById(pid);
  const about = integIsOom(p) ? `${p.name} is an OOm product. ${p.description}` : `Connect ${p.name} to sync ${p.dataShared.toLowerCase().replace(/, ([^,]+)$/, ' and $1')} between your workspace and ${p.name}.`;
  return `${integDrawerHead(p)}
    <h4>About this integration</h4><p class="integ-drawer-p">${esc(about)}</p>
    <h4>What can be synced?</h4><ul>${p.syncs.map(s => `<li>${esc(s)}</li>`).join('')}</ul>
    <h4>Requirements</h4><ul>${p.requirements.map(s => `<li>${esc(s)}</li>`).join('')}</ul>
    <h4>Before you connect</h4><p class="integ-drawer-p">You can connect multiple products, but only one CRM, one chat platform and one call tracker can be connected at a time. Connecting another one replaces the current one.</p>`;
}

function integDrawerFooter(pid) {
  if (!integEntry(pid)) return `<button type="button" class="btn btn-primary" onclick="integConnect('${pid}')">Connect</button>`;
  return `<button type="button" class="btn btn-primary" onclick="integOpenSetup('${pid}')"><i data-lucide="settings-2"></i>Configure</button>`;
}

// Steps by connection type: API products add the optional Webhook step.
function integSetupSteps(p) {
  const g = integGuides[p.id] || {};
  return [
    { key: 'connect', label: p.flow === 'internal' ? 'Connection' : 'Connect account' },
    ...(p.flow === 'api' ? [{ key: 'webhook', label: 'Webhook' }] : []),
    { key: 'mapping', label: g.mapTitle || 'Field mapping' },
    { key: 'review', label: 'Review & sync' }
  ];
}
function integCfgDraft(pid) {
  const p = productById(pid);
  const e = integEntry(pid);
  const g = integGuides[pid] || {};
  return {
    pid, step: 0,
    authed: !!e && e.status === 'connected' && !e.routedVia,
    verified: !!e && e.status === 'connected' && !e.routedVia && p.flow === 'api', webhookTested: false, showKey: false,
    key: e && p.flow === 'api' && !e.routedVia ? 'sk_test_PLACEHOLDER' : '',
    backfill: (e && e.backfill) || 'lifetime',
    // Slack keeps event → channel routing; everything else maps vendor fields to Galaxis fields.
    mapping: pid === 'slack' ? ((e && e.mapping) || Object.fromEntries((g.mappings || []).map(([s, t]) => [s, t]))) : integDefaultMapping(pid, e && e.mapping)
  };
}
function integOpenSetup(pid) {
  closeDrawer();
  state.ui.integCfg = integCfgDraft(pid);
  navigate('integration-setup', { pid });
}
function integCfg() {
  const pid = state.params.pid || 'delacon';
  if (!state.ui.integCfg || state.ui.integCfg.pid !== pid) state.ui.integCfg = integCfgDraft(pid);
  return state.ui.integCfg;
}
function integSetupExit() { state.ui.integCfg = null; navigate('integrations'); }
// Editing an existing, working connection: every step can be opened directly.
function integSetupEditing(c) { const e = integEntry(c.pid); return !!e && e.status === 'connected' && !e.routedVia; }
function integConnOk(c) {
  const p = productById(c.pid);
  return p.flow === 'internal' || (p.flow === 'oauth' ? c.authed : c.verified);
}

function integSetupRender() {
  const c = integCfg();
  const p = productById(c.pid);
  const e = integEntry(c.pid);
  const steps = integSetupSteps(p);
  const editing = integSetupEditing(c);
  const reach = i => editing || i <= c.step || (i === c.step + 1 && integSetupValid(c, false));
  const stepper = steps.map((s, i) => {
    const cls = i === c.step ? 'is-current' : i < c.step ? 'is-done' : '';
    return `<li class="${cls}"><button type="button" onclick="integSetupGo(${i})" ${reach(i) ? '' : 'disabled'} ${i === c.step ? 'aria-current="step"' : ''}>
      <span class="integ-stepper-num">${i < c.step ? '<i data-lucide="check"></i>' : i + 1}</span>${esc(s.label)}</button></li>`;
  }).join('<li class="integ-stepper-sep" aria-hidden="true"><i data-lucide="chevron-right"></i></li>');
  const last = c.step === steps.length - 1;
  return `<div class="integ-setup">
    <nav class="integ-crumbs" aria-label="Breadcrumb">
      <button type="button" class="t-link" onclick="integSetupExit()">Integrations</button><i data-lucide="chevron-right"></i>
      <span>${esc(p.name)}</span><i data-lucide="chevron-right"></i><span class="integ-crumb-current">${editing || e ? 'Configure' : 'Connect'}</span>
    </nav>
    <section class="card integ-setup-head">${integDrawerHead(p)}<span class="integ-tag">${integFlowLabel(p)}</span></section>
    <ol class="integ-stepper" aria-label="Set-up steps">${stepper}</ol>
    <section class="card integ-setup-body">
      <div class="integ-setup-step t-caption t-muted">Step ${c.step + 1} of ${steps.length}</div>
      ${integSetupStepHTML(c, steps[c.step].key)}
    </section>
    <div class="integ-setup-foot">
      ${e ? `<button type="button" class="btn btn-danger-outline" onclick="integDisconnect('${c.pid}')">Disconnect</button>` : ''}
      <span class="grow"></span>
      <button type="button" class="btn btn-ghost" onclick="integSetupExit()">Cancel</button>
      ${c.step ? '<button type="button" class="btn btn-outline" onclick="integSetupGo(state.ui.integCfg.step - 1)"><i data-lucide="arrow-left"></i>Back</button>' : ''}
      ${last ? `<button type="button" class="btn btn-primary" id="integ-save" onclick="integSaveConfig()">${e ? 'Save Configuration' : 'Connect and start sync'}</button>`
        : '<button type="button" class="btn btn-primary" onclick="integSetupNext()">Next<i data-lucide="arrow-right"></i></button>'}
    </div>
  </div>`;
}

// Requirements: Connect needs OAuth authorised or the API key verified; Field mapping needs every required Galaxis field.
function integSetupValid(c, tell = true) {
  const p = productById(c.pid);
  const step = integSetupSteps(p)[c.step].key;
  if (step === 'mapping') {
    const missing = integMissingRequired(c);
    if (missing.length && tell) showToast(`Map ${missing.map(x => x.label).join(', ')} to continue`, 'triangle-alert');
    return !missing.length;
  }
  if (step !== 'connect' || integConnOk(c)) return true;
  if (tell) {
    if (p.flow === 'oauth') showToast(`Connect ${p.name} via OAuth to continue`, 'triangle-alert');
    else if (!c.key.trim()) { showToast('Enter an API key to continue', 'key-round'); document.getElementById('integ-key')?.focus(); }
    else showToast('Verify the connection to continue', 'triangle-alert');
  }
  return false;
}
function integSetupNext() {
  const c = state.ui.integCfg;
  if (!integSetupValid(c)) return;
  integSetupGo(c.step + 1);
}
function integSetupGo(i) {
  const c = state.ui.integCfg;
  const n = integSetupSteps(productById(c.pid)).length;
  if (i > c.step && !integSetupEditing(c) && !integSetupValid(c)) return;
  c.step = Math.max(0, Math.min(n - 1, i));
  rerender();
  window.scrollTo(0, 0);
}
function integRefreshConfig() { if (state.page === 'integration-setup') rerender(); }
function integSetMap(key, field) { state.ui.integCfg.mapping[key] = field; integRefreshConfig(); }

function integSteps(steps, pid) {
  return `<ol class="integ-steps">${steps.map(s => `<li><span>${s.replace(/\{URL\}/g, esc(integWebhookUrl(pid)))}</span></li>`).join('')}</ol>`;
}

function integSetupStepHTML(c, key) {
  const p = productById(c.pid);
  const e = integEntry(c.pid);
  const g = integGuides[c.pid] || {};
  const head = (title, tag = '') => `<div class="integ-cfg-head"><h3 class="h-card">${esc(title)}</h3>${tag}</div>`;

  if (key === 'connect') {

    let conn;
    if (p.flow === 'internal') {

        <button type="button" class="btn btn-outline btn-sm" id="integ-oauth-btn" onclick="integOAuth()">${c.authed ? 'Re-authorise' : 'Connect via OAuth'}</button></div>`;
    } else {
      conn = `<div class="integ-guide"><div class="integ-guide-title">API set-up: connect account and import contacts</div>${integSteps(g.apiSteps || [], c.pid)}</div>
        <div class="field"><label class="field-label" for="integ-key">${esc(g.keyLabel || 'API key / token')}<span class="req">*</span></label>
          <div class="integ-input-row">
            <div class="integ-key grow"><input id="integ-key" class="input mono" type="${c.showKey ? 'text' : 'password'}" placeholder="sk_test_PLACEHOLDER" value="${esc(c.key)}" oninput="state.ui.integCfg.key = this.value; state.ui.integCfg.verified = false" autocomplete="off">
              <button type="button" class="integ-eye" onclick="state.ui.integCfg.showKey = !state.ui.integCfg.showKey; integRefreshConfig()" aria-label="${c.showKey ? 'Hide' : 'Show'} key"><i data-lucide="${c.showKey ? 'eye-off' : 'eye'}"></i></button></div>
            <button type="button" class="btn btn-outline btn-sm" id="integ-verify-btn" onclick="integVerify()">${c.verified ? 'Re-test connection' : 'Verify connection'}</button>
          </div>
          <div class="t-caption ${c.verified ? 't-success' : 't-muted'}" id="integ-verify-status">${c.verified ? '✓ Connection verified and schema synchronised.' : 'Connection has not been verified yet.'}</div>
        </div>`;
    }
    return `${head(p.flow === 'internal' ? 'Connection' : `Connect your ${p.name} account`, `<span class="integ-tag ${ok ? 'integ-tag-ok' : 'integ-tag-warn'}">${ok ? 'Connected' : 'Action Required'}</span>`)}
      <p class="integ-help">Galaxis uses this connection to import lead data and identify conversion events.</p>

      ${routedCrm ? `<div class="integ-managed"><i data-lucide="git-merge"></i><div><div class="t-bold">Routed via ${esc(routedCrm.name)}</div><div class="t-caption t-secondary">Galaxis receives ${esc(p.name)} activity through your ${esc(routedCrm.name)} connection. Finish these steps to connect ${esc(p.name)} directly instead.</div></div></div>` : ''}
      ${conn}`;
  }

  if (key === 'webhook') {
    return `${head('Webhook', '<span class="integ-tag">Optional · Real-Time Sync</span>')}
      <p class="integ-help">${esc(g.webhookNote || 'Enable instant updates from the connected platform. You can skip this step and set it up later.')}</p>
      <div class="integ-guide"><div class="integ-guide-title">Webhook set-up: enable real-time sync</div>${integSteps(g.webhookSteps || [], c.pid)}</div>
      <div class="integ-webhook"><code id="integ-webhook-url">${esc(integWebhookUrl(c.pid))}</code><button type="button" class="btn btn-ghost btn-sm" onclick="integCopyWebhook(this)"><i data-lucide="copy"></i>Copy</button></div>
      <div class="row integ-mt"><button type="button" class="btn btn-outline btn-sm" id="integ-webhook-btn" onclick="integTestWebhook()">Test webhook signal</button>
        <span class="t-caption ${c.webhookTested ? 't-success' : 't-muted'}" id="integ-webhook-status">${c.webhookTested ? '✓ Test callback received successfully' : 'Not tested yet'}</span></div>`;
  }

  if (key === 'mapping') {
    const targets = integTargets(c.pid);
    if (c.pid === 'slack') {
      // Slack: Galaxis events → Slack channels (notification routing, not field mapping).
      return `${head(g.mapTitle)}<p class="integ-help">${esc(g.mapHelp)}</p>

    const sample = (x, field) => {

        const u = usedBy(f);
        return `<option value="${esc(f)}" ${f === cur ? 'selected' : ''} ${u ? 'disabled' : ''}>${esc(f)}${u ? ` (used for ${esc(u.label)})` : ''}</option>`;
      }).join('');
      return `<div class="integ-fmap-row ${x.req && !cur ? 'is-missing' : ''}">
        <div class="integ-fmap-target"><div class="integ-fmap-label">${esc(x.label)}<span class="integ-tag ${x.req ? 'integ-tag-req' : ''}">${x.req ? 'Required' : 'Optional'}</span></div>${x.help ? `<div class="integ-fmap-help">${esc(x.help)}</div>` : ''}</div>
        <i data-lucide="arrow-left" class="integ-fmap-arrow"></i>
        <select class="select" aria-label="${esc(p.name)} field for ${esc(x.label)}" onchange="integSetMap('${x.key}', this.value)">${opts}</select>

      </div>`;
    }).join('');
    return `${head('Field mapping', missing.length ? `<span class="integ-tag integ-tag-warn">${missing.length} required field${missing.length === 1 ? '' : 's'} to map</span>` : '<span class="integ-tag integ-tag-ok">Auto-mapped</span>')}
      <p class="integ-help">Choose which ${esc(p.name)} field holds each Galaxis field. The ${esc(p.name)} fields were read from your account when you connected it, and we've matched them where we could. Each ${esc(p.name)} field can be used once.</p>
      <div class="integ-fmap">
        <div class="integ-fmap-row integ-fmap-head"><div>Galaxis field</div><div></div><div>${esc(p.name)} field</div><div>Sample value</div></div>
        ${rows}
      </div>`;
  }

  // Review & sync: backfill choice, a summary of the earlier steps, and the one-per-lane replacement warning.
  const old = laneOccupant(state.ctx, c.pid);
  const targets = integTargets(c.pid);
  const mapped = targets ? targets.filter(x => c.mapping[x.key]).length : 0;
  const missing = integMissingRequired(c);
  const row = (label, value, ok) => `<div class="integ-review-row"><span class="t-muted">${esc(label)}</span><span class="${ok === false ? 't-warning' : ''}">${value}</span></div>`;
  return `${head('Review & sync')}
    <p class="integ-help">Check the set-up, choose how much history to import, then ${e ? 'save' : 'connect'}.</p>
    ${old ? `<div class="integ-alert integ-alert-warning"><i data-lucide="triangle-alert"></i><div class="t-caption">${esc(integReplaceText(c.pid, old))}</div></div>` : ''}
