}

function integBusy(btnId, label, ms, done) {
  const b = document.getElementById(btnId);
  if (b) { b.disabled = true; b.textContent = label; }
  setTimeout(() => { if (state.ui.integCfg) { done(); integRefreshConfig(); } }, ms);
}
function integOAuth() {
  const p = productById(state.ui.integCfg.pid);
  integBusy('integ-oauth-btn', `Connecting to ${p.name}…`, 900, () => { state.ui.integCfg.authed = true; showToast(`${p.name} connection verified`, 'shield-check'); });
}
function integVerify() {
  const c = state.ui.integCfg;
  const p = productById(c.pid);
  if (!c.key.trim()) { showToast('Enter an API key first', 'key-round'); document.getElementById('integ-key')?.focus(); return; }
  integBusy('integ-verify-btn', 'Testing connection…', 900, () => { c.verified = true; showToast(`${p.name} connection verified`); });
}
function integTestWebhook() {
  integBusy('integ-webhook-btn', 'Testing…', 900, () => { state.ui.integCfg.webhookTested = true; showToast('Webhook signal verified with a sample callback', 'zap'); });
}
function integCopyWebhook(btn) {
  const text = document.getElementById('integ-webhook-url').textContent;
  const done = () => { showToast('Webhook URL copied', 'clipboard-check'); btn.innerHTML = '<i data-lucide="check"></i>Copied'; refreshIcons(); setTimeout(() => { btn.innerHTML = '<i data-lucide="copy"></i>Copy'; refreshIcons(); }, 1200); };
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch (err) { showToast('Copy failed — select the URL manually', 'triangle-alert'); }
    ta.remove();
  };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, fallback);
  else fallback();
}

function integSaveConfig() {
  const c = state.ui.integCfg;
  const p = productById(c.pid);
  if (!integConnOk(c)) { c.step = 0; rerender(); integSetupValid(c); return; }
  if (integMissingRequired(c).length) { c.step = integSetupSteps(p).findIndex(s => s.key === 'mapping'); rerender(); integSetupValid(c); return; }
  const existed = !!integEntry(c.pid);
  const { entry, replaced } = integCommit(c.pid, { extra: { backfill: c.backfill, mapping: { ...c.mapping } } });
  delete entry.routedVia;
  state.ui.integCfg = null;
  navigate('integrations');
  showToast(`${existed ? `Configuration saved for ${p.name}` : `${p.name} connected`}. Sync started.${replaced ? ` ${replaced.name} was disconnected.` : ''}`);
}

function integSearchLink(plat) {
  const input = document.getElementById(`integ-ad-${plat}`);
  const v = (input?.value || '').trim();
  const label = PLATFORM_NAME[plat];
  if (!v) { showToast(`Enter a ${label} Account ID first`, 'triangle-alert'); input?.focus(); return; }
  if (wsAdAccounts(state.ctx).some(a => a.platform === plat)) { showToast(`This workspace already has a ${label} account. Unlink it first.`, 'triangle-alert'); return; }
  const acc = adAccounts.find(a => a.platform === plat && !a.workspaceId && a.id.toLowerCase() === v.toLowerCase());
  if (!acc) { showToast(`Invalid ID or no matching ${label} account exists`, 'circle-x'); input?.classList.add('invalid'); return; }
  const ws = currentWs();
  openModal({
    title: 'Confirm Account Linking',
    desc: 'We found an ad account matching this ID. Please confirm before linking it to the workspace.',
    body: `<div class="integ-kv">
      <div><span>Platform</span><span>${platformBadge(plat, true)}</span></div>
      <div><span>Account name</span><span class="t-bold">${esc(acc.name)}</span></div>
      <div><span>Account ID</span><code class="mono">${esc(acc.id)}</code></div>
      <div class="integ-kv-sep"><span>Target workspace</span><span class="t-bold t-primary">${esc(ws.name)}</span></div>
    </div>`,
    actions: [{ label: 'Cancel', kind: 'outline' }, { label: 'Link to Workspace', kind: 'primary', onClick: () => { acc.workspaceId = ws.id; rerender(); showToast(`Linked ${label} account ${acc.id} to ${ws.name}`, 'link'); } }]
  });
}

function integUnlinkAd(accId) {
  const acc = adAccounts.find(a => a.id === accId);
  confirmDialog({
    title: 'Unlink Ad Account?',
    text: 'Data is not stored in Galaxis. Once unlinked, all platform conversions and spend data from this account will immediately be removed from the Workspace Analytics view.',
    confirmLabel: 'Yes, Unlink Account',
    danger: true,
    onConfirm: () => { acc.workspaceId = null; rerender(); showToast(`${PLATFORM_NAME[acc.platform]} account ${acc.id} unlinked and returned to the agency queue`, 'unlink'); }
  });
}

function integCrmCard() {

  return `<div class="card integ-card ${on ? '' : 'integ-card-error'}" id="integ-crm-card">
    <div class="integ-card-head"><span class="integ-plat-logo integ-crm-logo"><i data-lucide="contact-round"></i></span>
      <div class="grow"><div class="h-card">Agency CRM</div><div class="integ-cat">Internal OOm CRM · API connection</div>

    <div class="integ-meta">
      <div class="integ-meta-row"><i data-lucide="refresh-cw"></i><div><div>Accounts synced</div><div class="integ-meta-val">${fmtNum(agencyCrm.accountsSynced)} accounts synced</div></div></div>
      <div class="integ-meta-row"><i data-lucide="calendar-clock"></i><div><div>Last synced</div><div class="integ-meta-val ${on ? '' : 't-error'}">${fmtDateTime(agencyCrm.lastSynced)}</div></div></div>

// Simulated sync: refreshes the sync time and the synced account count.
function integCrmResync() {
  const b = document.getElementById('integ-crm-sync');
  if (b) { b.disabled = true; b.textContent = 'Syncing…'; }
  setTimeout(() => {
    agencyCrm.lastSynced = new Date().toISOString();
    agencyCrm.accountsSynced = Object.keys(crmAccounts).length;
    if (state.page === 'integrations' && isAgency()) rerender();
    showToast(`Agency CRM synced. ${fmtNum(agencyCrm.accountsSynced)} accounts up to date.`, 'refresh-cw');
  }, 800);
}
function integCrmReconnect() {
  const b = document.getElementById('integ-crm-sync');
  if (b) { b.disabled = true; b.textContent = 'Connecting…'; }
  setTimeout(() => {
    agencyCrm.status = 'connected';
    agencyCrm.lastSynced = new Date().toISOString();
    state.flags.integCrm = 'connected';
    if (state.page === 'integrations' && isAgency()) rerender();
    showToast('Agency CRM reconnected. New conversions will create workspaces again.', 'plug');
  }, 900);
}
// Simulated OAuth: resets the token to valid with a new expiry (Google 1 year, Meta 60 days).
function integReauth(k) {
  const t = masterTokens[k];
  const b = document.getElementById(`integ-reauth-${k}`);
  if (b) { b.disabled = true; b.textContent = `Connecting to ${PLATFORM_NAME[k]}…`; }
  setTimeout(() => {
    const d = new Date();
    if (k === 'google') d.setFullYear(d.getFullYear() + 1); else d.setDate(d.getDate() + 60);
    t.status = 'valid'; t.expires = toDateInput(d);
    state.flags.integToken = Object.values(masterTokens).some(x => x.status === 'expired') ? 'expired' : 'healthy';
    if (state.page === 'integrations' && isAgency()) rerender();
    showToast(`${t.label} re-authenticated. Valid until ${fmtDate(t.expires)}.`, 'shield-check');
  }, 900);
}

function integPickedIds() { return new Set(Object.values(state.ui.integInline).flatMap(o => Object.values(o)).filter(Boolean)); }

    ${list.length ? `<div class="table-wrap"><table class="table integ-table">
      <thead><tr><th>Workspace</th><th>Google Ads</th><th>Meta Ads</th><th></th></tr></thead>
      <tbody>${rows.map(w => {
        const picks = state.ui.integInline[w.id] || {};

          <td>${integInlineCell(w.id, 'google')}</td><td>${integInlineCell(w.id, 'meta')}</td>
          <td class="num"><button type="button" class="btn btn-sm ${has ? 'btn-primary' : 'btn-outline'}" onclick="integSaveInline('${w.id}')">Save</button></td></tr>`;

      ${list.length > 10 ? paginationBar('integ-unl', list.length, 'integRenderUnlinked') : ''}`

}

function integInlineCell(wsId, plat) {
  const picked = (state.ui.integInline[wsId] || {})[plat];
  if (picked) {
    const a = adAccounts.find(x => x.id === picked);
    return `<span class="integ-acc-chip">${platformLogo(plat)}<span class="integ-acc-text"><span class="t-bold">${esc(a.name)}</span><span class="mono t-muted">${esc(a.id)}</span></span>
      <button type="button" class="chip-remove" onclick="integInlineClear('${wsId}','${plat}')" aria-label="Remove"><i data-lucide="x"></i></button></span>`;
  }
  const taken = integPickedIds();
  const opts = adAccounts.filter(a => a.platform === plat && !a.workspaceId && !taken.has(a.id));
  const dl = `integ-dl-${plat}-${wsId}`;
  return `<input class="input integ-inline-input" list="${dl}" placeholder="${opts.length ? 'Search & select…' : 'No unlinked accounts'}" ${opts.length ? '' : 'disabled'}
      oninput="integInlinePick('${wsId}','${plat}', this.value, false)" onchange="integInlinePick('${wsId}','${plat}', this.value, true)" aria-label="${PLATFORM_NAME[plat]} account for ${esc(wsById(wsId).name)}">
    <datalist id="${dl}">${opts.map(a => `<option value="${esc(a.name)} [${esc(a.id)}]"></option>`).join('')}</datalist>`;
}

function integInlinePick(wsId, plat, val, strict) {
  const m = String(val).trim().match(/\[([^\]]+)\]\s*$/);
  const id = m ? m[1] : String(val).trim();
  const acc = adAccounts.find(a => a.platform === plat && !a.workspaceId && a.id === id);
  if (acc) {
    (state.ui.integInline[wsId] = state.ui.integInline[wsId] || {})[plat] = acc.id;
    integRenderUnlinked();
  } else if (strict && val.trim()) showToast(`Pick a ${PLATFORM_NAME[plat]} account from the list`, 'triangle-alert');
}
function integInlineClear(wsId, plat) { if (state.ui.integInline[wsId]) delete state.ui.integInline[wsId][plat]; integRenderUnlinked(); }

function integApplyInline(wsId) {
  const picks = state.ui.integInline[wsId] || {};
  let n = 0;
  ['google', 'meta'].forEach(plat => {
    const acc = picks[plat] && adAccounts.find(a => a.id === picks[plat] && !a.workspaceId);
    if (acc && !wsAdAccounts(wsId).some(a => a.platform === plat)) { acc.workspaceId = wsId; n++; }
  });
  delete state.ui.integInline[wsId];
  return n;
}
function integSaveInline(wsId) {
  if (!Object.values(state.ui.integInline[wsId] || {}).some(Boolean)) { showToast('Select at least one account to link', 'triangle-alert'); return; }
  const n = integApplyInline(wsId);
  rerender();
  showToast(`Linked ${n} account${n === 1 ? '' : 's'} to ${wsById(wsId).name}`, 'link');
}
function integSaveAllInline() {
  const ids = Object.keys(state.ui.integInline).filter(id => Object.values(state.ui.integInline[id]).some(Boolean));
  if (!ids.length) { showToast('No links to save', 'info'); return; }
  const n = ids.reduce((s, id) => s + integApplyInline(id), 0);
  rerender();
  showToast(`Linked ${n} account${n === 1 ? '' : 's'} across ${ids.length} workspace${ids.length === 1 ? '' : 's'}`, 'link');
}

        <td class="num"><button type="button" class="btn btn-primary btn-sm" onclick="integLinkQueued('${q(a.id)}')"><i data-lucide="link"></i>Link account</button></td></tr>`).join('')}</tbody></table></div>
      ${list.length > 10 ? paginationBar('integ-q', list.length, 'integRenderQueue') : ''}`
    : `<div class="empty"><i data-lucide="inbox"></i><div class="empty-title">No unlinked ${f === 'all' ? '' : PLATFORM_NAME[f] + ' '}accounts</div><div class="t-caption">Every discovered account is linked to a workspace.</div></div>`}`;
}

function integLinkQueued(accId) {
  const acc = adAccounts.find(a => a.id === accId);
  const typed = (state.ui.integQueueTarget[accId] || '').trim().toLowerCase();
  const ws = activeWorkspaces().find(w => w.name.toLowerCase() === typed);
  if (!typed) { showToast('Choose a target client workspace first', 'triangle-alert'); return; }
  if (!ws) { showToast('No client workspace matches that name. Pick one from the list.', 'triangle-alert'); return; }
  const existing = wsAdAccounts(ws.id).find(a => a.platform === acc.platform);
  const go = () => {
    if (existing) existing.workspaceId = null;
    acc.workspaceId = ws.id;
    delete state.ui.integQueueTarget[accId];
    rerender();
    showToast(`Linked ${acc.id} to ${ws.name}${existing ? `. ${existing.id} returned to the queue.` : ''}`, 'link');
  };
  // V1 bug fix: never overwrite an existing link silently.
  if (existing) confirmDialog({
    title: `Replace existing ${PLATFORM_NAME[acc.platform]} account?`,
    text: `${ws.name} is already linked to ${existing.name} (${existing.id}). Linking ${acc.name} will unlink it and return it to the queue. Data from the old account will no longer appear in this workspace.`,
    confirmLabel: 'Replace account', onConfirm: go
  });
  else go();
}

// ---- Products across clients (agency-wide integration health; the V2 gap) ----
function integOverviewHTML() {
  const wss = activeWorkspaces();
  const stat = (pid, test) => wss.filter(w => { const e = wsProducts(w.id)[pid]; return e && test(e); });
  const cell = (pid, kind, list, cls) => list.length ? `<button type="button" class="integ-count ${cls}" onclick="integDrill('${pid}','${kind}')">${list.length}</button>` : '<span class="t-muted">0</span>';
  const rows = products.map(p => {
    const conn = stat(p.id, e => e.status === 'connected');
    const act = stat(p.id, e => e.status === 'connected' && e.active);
    const err = stat(p.id, e => e.status === 'error' || e.status === 'pending');
    return `<tr><td><div class="integ-dir-cell">${productLogo(p.id, 24)}<div><div class="t-bold">${esc(p.name)}</div><div class="cell-sub">${esc(p.category)} · ${integIsOom(p) ? 'OOm' : 'Third-party'}</div></div></div></td>

  }).join('');

      <thead><tr><th>Product</th><th class="num">Connected</th><th class="num">Active</th><th class="num">Error / pending</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function integDrill(pid, kind) {
  const p = productById(pid);
  const test = { connected: e => e.status === 'connected', active: e => e.status === 'connected' && e.active, error: e => e.status === 'error' || e.status === 'pending' }[kind];
  const list = activeWorkspaces().filter(w => { const e = wsProducts(w.id)[pid]; return e && test(e); });
  const label = { connected: 'connected', active: 'active', error: 'with errors or pending set-up' }[kind];
  openModal({
    title: `${p.name} — workspaces ${label}`,
    desc: `${list.length} client workspace${list.length === 1 ? '' : 's'}`,
    size: 'lg',
    body: `<div class="integ-drill">${list.map(w => {
      const e = wsProducts(w.id)[pid];
      return `<div class="integ-drill-row"><div class="grow"><div class="t-bold">${esc(w.name)}</div>
        <div class="integ-dots">${integStatusDots(pid, w.id)}</div>${e.error ? `<div class="t-caption t-secondary">${esc(e.error)}</div>` : ''}</div>

    }).join('')}</div>`,
    actions: [{ label: 'Close', kind: 'outline' }]
  });
}

// ---- src/leads.js ----
// Galaxis Hub demo — Leads and Lead Profile (ported from V2). Client workspaces with an active CRM only.
// All leads are generated placeholders: fictional names, example.com emails, +65 0000 00xx phones.

const LEAD_SOURCES = ['Google Ads (Search)', 'Meta WhatsApp Ad', 'SleekFlow', 'Delacon', 'Aurix chat', 'Website form'];
const LEAD_STATUSES = ['New', 'Qualified', 'Converted', 'Lost'];
const LEAD_PILL = { New: 'pill-grey', Qualified: 'pill-blue', Converted: 'pill-green', Lost: 'pill-red' };
const LEAD_FIRST = ['Avery', 'Jordan', 'Casey', 'Riley', 'Morgan', 'Quinn', 'Taylor', 'Skyler', 'Rowan', 'Emerson', 'Harper', 'Kai', 'Remy', 'Sage', 'Reese', 'Dakota', 'Finley', 'Ellis', 'Marlow', 'Jules'];
const LEAD_LAST = ['Sample', 'Example', 'Demo', 'Mockridge', 'Testwell', 'Draftly', 'Placeholder', 'Prototype', 'Specimen', 'Fixture'];
const LEAD_TODAY = '2026-10-21';
const LEAD_PER_PAGE = 15;

state.ui.leadStatus = state.ui.leadStatus || 'All';
state.ui.leadSearch = state.ui.leadSearch || '';

const leadCache = {};

function leadHash(s) { let h = 7; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; }
function leadAddDays(iso, n) { const d = new Date(iso + 'T00:00:00'); d.setDate(d.getDate() + n); return toDateInput(d); }
function leadPick(r, list) { return list[Math.floor(r() * list.length)]; }

// Owners: client staff of the workspace plus agency staff assigned to it.
function leadOwners(wsId) {
  const list = members.filter(m => m.status === 'active' && (m.org === wsId || (m.org === 'agency' && (m.workspaces.includes('*') || m.workspaces.includes(wsId)))));
  return list.length ? list.map(m => m.name) : ['Unassigned'];
}

function leadsFor(wsId) {
  if (leadCache[wsId]) return leadCache[wsId];
  const ws = wsById(wsId);
  const r = seededRandom((ws ? ws.seed : 1) * 7 + 3);
  const owners = leadOwners(wsId);
  const list = [];
  for (let i = 0; i < 45; i++) {
    const first = LEAD_FIRST[(i * 7 + (ws ? ws.seed : 0)) % LEAD_FIRST.length];
    const last = LEAD_LAST[Math.floor(r() * LEAD_LAST.length)];
    const roll = r();
    const status = roll < 0.3 ? 'New' : roll < 0.55 ? 'Qualified' : roll < 0.85 ? 'Converted' : 'Lost';
    // Lifetime value is the sum of contracts: only converted (and some churned, now-lost) leads have any.
    const ltv = status === 'Converted' || (status === 'Lost' && r() < 0.3) ? Math.round((2 + r() * 118)) * 1000 + Math.round(r() * 9) * 111 : 0;
    list.push({
      id: `${wsId}-L${String(i + 1).padStart(3, '0')}`,
      wsId,
      name: `${first} ${last}`,
      email: `${first}.${last}${i + 1}@example.com`.toLowerCase(),
      phone: `+65 0000 00${String(i + 1).padStart(2, '0')}`,
      source: leadPick(r, LEAD_SOURCES),
      owner: leadPick(r, owners),
      status,
      created: leadAddDays(LEAD_TODAY, -Math.floor(i * 2.6 + r() * 2)),
      ltv,
      record: `#${10000 + Math.floor(r() * 89999)}`
    });
  }
  leadCache[wsId] = list;
  return list;
}
function leadById(id) { return state.ctx ? leadsFor(state.ctx).find(l => l.id === id) : null; }

// ---------- Authority: who owns lead data ----------
// 'mirror' = third-party CRM is the system of record (read-only here); 'full' = Galaxis CRM (Galaxis CRM / Institute CRM).
function leadAuthority() {
  if (state.flags.leadAuthority) return state.flags.leadAuthority;
  const crm = activeCrm(state.ctx);
  return crm && crm.provider === 'third' ? 'mirror' : 'full';
}
function leadCanEdit() { return leadAuthority() === 'full'; }
function leadCrmName() { const c = activeCrm(state.ctx); return c ? c.name : 'your CRM'; }
function leadChatChannel() {
  const p = wsProducts(state.ctx);
  if (p.sleekflow && p.sleekflow.status !== 'disabled') return 'SleekFlow';
  if (p.aurix && p.aurix.status !== 'disabled') return 'Aurix';
  return 'SleekFlow';
}
function leadPill(status) { return `<span class="pill ${LEAD_PILL[status] || 'pill-grey'}">${esc(status)}</span>`; }
function leadMoney(n) { return n ? fmtMoney(n) : '<span class="t-muted">—</span>'; }

function leadNoCrmHTML() {
  return `<section class="card"><div class="empty">
    <i data-lucide="contact"></i>
    <div class="empty-title">No CRM connected</div>
    <div class="t-caption">Leads appear here once a CRM is connected and active for ${esc(currentWs()?.name || 'this workspace')}.</div>
    <button type="button" class="btn btn-primary" style="margin-top:16px" onclick="navigate('integrations')"><i data-lucide="blocks"></i>Connect a CRM</button>
  </div></section>`;
}

function leadAuthorityBanner() {
  const crm = leadCrmName();
  if (leadCanEdit()) {
    return `<div class="banner banner-success"><i data-lucide="shield-check"></i><div>
      <div class="banner-title">Galaxis CRM active — full edit</div>
      <div class="banner-text">${esc(crm)} is the system of record. Add leads and update statuses here; channel data from connected products keeps syncing in.</div></div></div>`;
  }
  return `<div class="banner banner-info"><i data-lucide="lock"></i><div>
    <div class="banner-title">Managed in ${esc(crm)} — Read-only mirror</div>
    <div class="banner-text">Edit leads in ${esc(crm)}. Lead details, statuses and deal values sync to Galaxis automatically.</div></div>
    <button type="button" class="banner-action" onclick="showToast('Opening ${q(crm)}…', 'external-link')">Open ${esc(crm)} ↗</button></div>`;
}

// ---------- Contact privacy ----------
// Agency viewers (agency admins inside a client workspace) see emails and phone numbers masked, so client contact
// details are never on screen during showcases. Fixed-length masks, so the real length is not revealed either.
function leadMasked() { return viewerIsAgency(); }
function leadEmail(l) {
  if (!leadMasked()) return l.email;
  const [user, domain = ''] = l.email.split('@');
  const tld = domain.includes('.') ? domain.slice(domain.lastIndexOf('.')) : '';
  return `${user[0] || ''}•••••@${domain[0] || ''}•••••${tld}`;
}
function leadPhone(l) {
  if (!leadMasked() || !l.phone || l.phone === '—') return l.phone;
  const cc = (l.phone.match(/^\+\d{1,3}/) || [''])[0];
  return `${cc ? cc + ' ' : ''}•••• ••${l.phone.replace(/\D/g, '').slice(-2)}`;
}

// ---------- Leads list ----------
function leadFiltered() {
  const term = state.ui.leadSearch.trim().toLowerCase();
  // Masked viewers can't search by email (matches would reveal it).
  return leadsFor(state.ctx).filter(l => !term || l.name.toLowerCase().includes(term) || (!leadMasked() && l.email.includes(term)) || l.source.toLowerCase().includes(term));
}

function leadsRender() {
  if (!activeCrm(state.ctx)) return leadNoCrmHTML();
  const total = leadsFor(state.ctx).length;
  return `<div class="stack">
    ${leadAuthorityBanner()}
    <section class="card">
      <div class="card-header">
        <div><h2 class="h-card lead-card-title">All Leads</h2><div class="card-sub">${total} leads synchronised from ${esc(leadCrmName())}, Google Ads, Meta and connected chat and call products.${leadMasked() ? '<span class="lead-privacy"><i data-lucide="eye-off"></i>Emails and phone numbers are hidden for agency users</span>' : ''}</div></div>
        ${leadCanEdit() ? '<button type="button" class="btn btn-primary" onclick="leadOpenAdd()"><i data-lucide="plus"></i>Add Lead</button>' : ''}
      </div>
      <div class="table-toolbar lead-toolbar">
        <div id="lead-filter-region">${leadFilterHTML()}</div>
        <div class="search lead-search"><input class="input" id="lead-search" placeholder="${leadMasked() ? 'Search name or source' : 'Search name, email or source'}" value="${esc(state.ui.leadSearch)}" oninput="leadOnSearch(this.value)" aria-label="Search leads"><i data-lucide="search"></i></div>
      </div>
      <div id="lead-table-region">${leadTableHTML()}</div>
    </section>
  </div>`;
}

// Stage filter: Galaxis CRM only. External CRMs each have their own stage fields, so a mirror is search-only.
function leadFilterHTML() {
  if (!leadCanEdit()) return '';
  const list = leadFiltered();
  const count = s => s === 'All' ? list.length : list.filter(l => l.status === s).length;
  return `<div class="seg" role="tablist" aria-label="Filter by status">${['All', ...LEAD_STATUSES].map(s =>
    `<button type="button" class="${state.ui.leadStatus === s ? 'active' : ''}" onclick="leadSetStatusFilter('${s}')">${s} <span class="lead-count">${count(s)}</span></button>`).join('')}</div>`;
}

function leadTableHTML() {
  const edit = leadCanEdit();
  let list = leadFiltered();
  const status = edit ? state.ui.leadStatus : 'All';
  if (status !== 'All') list = list.filter(l => l.status === state.ui.leadStatus);
  const order = { New: 0, Qualified: 1, Converted: 2, Lost: 3 };
  list = applySort(list, 'leads', {
    name: l => l.name, phone: l => l.phone, source: l => l.source, owner: l => l.owner, status: l => order[l.status], created: l => l.created, ltv: l => l.ltv
  }, { col: 'created', dir: 'desc' });
  pager('leads', LEAD_PER_PAGE);
  const page = paginate(list, 'leads');
  const th = (col, label, cls = '') => `<th class="${cls}">${sortHeader('leads', col, label, 'leadRefreshTable')}</th>`;
  const term = state.ui.leadSearch.trim();
  const emptyMsg = term ? `No leads found matching “${term}”${status !== 'All' ? ` with status ${status}` : ''}.` : `No ${status === 'All' ? '' : `${status.toLowerCase()} `}leads yet.`;
  const rows = page.map(l => `<tr class="clickable" onclick="leadOpen('${q(l.id)}')">
      <td><div class="t-bold">${esc(l.name)}</div><div class="cell-sub">${esc(leadEmail(l))}</div></td>
      <td class="dash-nowrap">${esc(leadPhone(l))}</td>
      <td>${esc(l.source)}</td>
      <td>${esc(l.owner)}</td>
      <td>${leadPill(l.status)}</td>
      <td>${esc(fmtDate(l.created))}</td>
      <td class="num">${leadMoney(l.ltv)}</td>
      ${edit ? `<td class="lead-actions" onclick="event.stopPropagation()">${rowMenu(`lead-menu-${l.id}`, [
        { label: 'View profile', icon: 'user', onClick: `leadOpen('${q(l.id)}')` },
        { label: 'Edit status', icon: 'pencil', onClick: `leadOpenStatus('${q(l.id)}')` }
      ])}</td>` : ''}
    </tr>`).join('');

// ---------- Lead profile (generated per lead, deterministic) ----------
const LEAD_TL = {
  ad:     { icon: 'mouse-pointer-click', cls: 'lead-tl-blue', label: 'Ad click' },
  chat:   { icon: 'message-circle', cls: 'lead-tl-green', label: 'WhatsApp session' },
  aurix:  { icon: 'bot', cls: 'lead-tl-green', label: 'Chat session' },
  call:   { icon: 'phone-incoming', cls: 'lead-tl-orange', label: 'Inbound call' },
  form:   { icon: 'file-input', cls: 'lead-tl-purple', label: 'Lead created' },
  won:    { icon: 'trophy', cls: 'lead-tl-success', label: 'Deal won' },
  lost:   { icon: 'circle-x', cls: 'lead-tl-red', label: 'Marked lost' }
};
const LEAD_CHAT_FIRST = ['Hi, I’d like to find out more about your packages.', 'Hello, is this still available?', 'Can I get a quote for my team?', 'Hi, I saw your ad and have a few questions.', 'Do you offer a free consultation?'];
const LEAD_CHAT_LAST = ['Thanks, please send the proposal over.', 'Demo confirmed for next Tuesday.', 'Let me check with my manager and revert.', 'Great, see you at the appointment.', 'Could you share the pricing sheet?'];
const LEAD_AI_SUMMARY = ['Asked about pricing tiers and onboarding timeline.', 'Confirmed team size and requested a product demo.', 'Compared plans and asked for a case study [PLACEHOLDER].', 'Requested a callback to discuss contract terms.', 'Shared requirements and preferred start date.'];
const LEAD_INSIGHTS = [['Budget: [PLACEHOLDER] range', 'Decision maker: Yes', 'Timeline: within 3 months'], ['Interested in: annual plan', 'Preferred contact: WhatsApp', 'Team size: 10–50'], ['Main concern: onboarding effort', 'Competitor mentioned: [PLACEHOLDER]', 'Follow-up: proposal requested'], ['Intent: high', 'Asked for: product demo', 'Timeline: this quarter']];
const LEAD_CONTRACTS = ['Annual subscription — [PLACEHOLDER] plan', 'Onboarding & setup services', 'Additional seats', 'Renewal — 12 months', 'Training workshop'];

function leadTime(iso, r) { return `${iso}T${String(9 + Math.floor(r() * 9)).padStart(2, '0')}:${String(Math.floor(r() * 4) * 15).padStart(2, '0')}:00+08:00`; }

function leadDetail(l) {
  const r = seededRandom(leadHash(l.id) % 100000 + 11);
  const chatProduct = leadChatChannel();
  const crm = leadCrmName();
  const events = [];
  let day = leadAddDays(l.created, -Math.floor(r() * 3));
  const push = (type, extra) => {
    let at = leadTime(day, r);
    // Same-day touches must stay in order: place this one 1–3 hours after the previous touch.
    const prev = events[events.length - 1];
    if (prev && new Date(at) <= new Date(prev.at)) at = new Date(new Date(prev.at).getTime() + (1 + Math.floor(r() * 3)) * 3600000).toISOString();
    events.push({ type, at, ...extra });
    day = leadAddDays(day, Math.floor(r() * 3));
  };
  const adPlatform = l.source === 'Meta WhatsApp Ad' ? 'meta' : l.source === 'Google Ads (Search)' ? 'google' : (r() < 0.5 ? 'google' : 'meta');
  const campaign = adPlatform === 'google' ? leadPick(r, ['Search — Brand', 'Search — Generic', 'Performance Max']) : leadPick(r, ['CTWA — Lead Gen', 'Retargeting — Engaged', 'Awareness — Video']);
  const chat = () => {
    const msgs = 4 + Math.floor(r() * 18);
    push(chatProduct === 'Aurix' ? 'aurix' : 'chat', { messages: msgs, mins: 3 + Math.floor(r() * 25), summary: leadPick(r, LEAD_AI_SUMMARY) });
  };
  const call = () => push('call', { duration: `${1 + Math.floor(r() * 9)}m ${String(Math.floor(r() * 60)).padStart(2, '0')}s`, attributed: adPlatform === 'google' ? 'Google Ads (Search)' : 'Meta Ads', handledBy: l.owner });

  // First touch matches the lead's First Touch Source.
  if (l.source === 'Google Ads (Search)' || l.source === 'Meta WhatsApp Ad') push('ad', { platform: adPlatform, campaign });
  if (l.source === 'Meta WhatsApp Ad' || l.source === 'SleekFlow' || l.source === 'Aurix chat') chat();
  if (l.source === 'Delacon') call();
  push('form', { via: l.source === 'Website form' ? 'Website enquiry form' : `${l.source} (auto-created)`, crm });
  // Follow-up touches, keeping the total between 3 and 6 including the outcome.
  const outcome = l.status === 'Converted' ? 'won' : l.status === 'Lost' ? 'lost' : null;
  const max = 6 - (outcome ? 1 : 0);
  const extra = Math.floor(r() * 3);
  for (let i = 0; i < extra && events.length < max; i++) { if (r() < 0.6) chat(); else call(); }
  while (events.length + (outcome ? 1 : 0) < 3) chat();
  if (outcome === 'won') push('won', { value: l.ltv });
  if (outcome === 'lost') push('lost', { reason: leadPick(r, ['Budget not approved', 'Chose another provider', 'No response after follow-ups', 'Timing — revisit next year']) });

  // Contracts: total equals lifetime value.
  const contracts = [];
  if (l.ltv > 0) {
    const n = Math.min(3, 1 + Math.floor(r() * 3));
    let left = l.ltv;
    const startDay = events.find(e => e.type === 'won') ? events.find(e => e.type === 'won').at.slice(0, 10) : l.created;
    for (let i = 0; i < n; i++) {
      const val = i === n - 1 ? left : Math.round(left * (0.55 + r() * 0.2));
      left -= val;
      contracts.push({ id: `CON-2026-${String(100 + (leadHash(l.id + i) % 900)).padStart(4, '0')}`, desc: LEAD_CONTRACTS[(leadHash(l.id) + i) % LEAD_CONTRACTS.length], value: val, created: leadAddDays(startDay, i * 3) });
      if (left <= 0) break;
    }
  }

  const chats = events.filter(e => e.type === 'chat' || e.type === 'aurix');
  return {
    events,
    contracts,
    conversation: chats.length ? {
      product: chatProduct,
      sessions: chats.length,
      messages: chats.reduce((s, e) => s + e.messages, 0),
      first: { at: chats[0].at, text: leadPick(r, LEAD_CHAT_FIRST) },
      latest: { at: chats[chats.length - 1].at, text: leadPick(r, LEAD_CHAT_LAST) },
      insights: LEAD_INSIGHTS[leadHash(l.id) % LEAD_INSIGHTS.length]
    } : null
  };
}

function leadEventHTML(e) {
  const t = LEAD_TL[e.type];
  let title = '', box = '';
  if (e.type === 'ad') {
    title = `${platformLogo(e.platform)} ${e.platform === 'google' ? 'Google Ads' : 'Meta Ads'} click`;
    box = `<div>Campaign: <strong>${esc(e.campaign)}</strong></div><div class="t-muted">Click ID matched to this lead’s first session.</div>`;
  } else if (e.type === 'chat' || e.type === 'aurix') {
    title = `${e.type === 'chat' ? 'WhatsApp session' : 'Aurix chat session'} (${e.messages} messages) · ${esc(e.type === 'chat' ? 'SleekFlow' : 'Aurix')}`;
    box = `<div class="t-muted">Duration: ${e.mins} mins</div><div><strong>AI summary:</strong> ${esc(e.summary)}</div>`;
  } else if (e.type === 'call') {
    title = 'Inbound call · Delacon';
    box = `<div class="lead-call-grid"><div><span class="t-muted">Status</span><strong class="t-success">● Answered (${esc(e.duration)})</strong></div><div><span class="t-muted">Handled by</span><strong>${esc(e.handledBy)}</strong></div><div><span class="t-muted">Attributed source</span><strong>${esc(e.attributed)}</strong></div></div>`;
  } else if (e.type === 'form') {
    title = `Lead created · ${esc(e.crm)}`;
    box = `<div>Trigger: <strong>${esc(e.via)}</strong></div>`;
  } else if (e.type === 'won') {
    title = 'Deal won';
    box = `<div>Closed for <strong>${e.value ? fmtMoney(e.value) : 'an unrecorded value'}</strong>.</div>`;
  } else if (e.type === 'lost') {
    title = 'Marked as lost';
    box = `<div>Reason: <strong>${esc(e.reason)}</strong></div>`;
  }
  return `<li class="lead-tl-item">
    <span class="lead-tl-badge ${t.cls}" title="${esc(t.label)}"><i data-lucide="${t.icon}"></i></span>
    <div class="lead-tl-time">${esc(fmtDateTime(e.at))}</div>
    <div class="lead-tl-title">${title}</div>
    <div class="lead-tl-box">${box}</div>
  </li>`;
}

      <div class="stack">
        <section class="card">
          <h3 class="h-card">Lead Details</h3>
          <div class="lead-dl">
            ${row('Email', esc(leadEmail(l)))}
            ${row('Phone', esc(leadPhone(l)))}
            ${row('Owner', esc(l.owner))}
            ${row('Lifetime Value', `<strong class="t-primary">${fmtMoney(l.ltv)}</strong>`)}
            ${row('Status', leadPill(l.status))}
            ${row('First Touch Source', esc(l.source))}
            ${row('Created', esc(fmtDate(l.created)))}
          </div>
        </section>
      </div>
      <div class="stack">
        <section class="card">
          <div class="card-header"><div><h3 class="h-card">Conversation Summary</h3><div class="card-sub">${conv ? `${esc(conv.product)} · WhatsApp` : 'Chat channels'}</div></div>
            ${conv ? `<button type="button" class="btn btn-outline btn-sm" onclick="showToast('Opening ${q(conv.product)} inbox…', 'external-link')">Open inbox ↗</button>` : ''}</div>
          ${conv ? `
            <div class="lead-conv-stats">
              <div><div class="kv-label">Messages</div><div class="lead-stat">${conv.messages}</div></div>
              <div><div class="kv-label">Sessions</div><div class="lead-stat">${conv.sessions}</div></div>
              <div><div class="kv-label">First message</div><div class="t-caption">${esc(fmtDateTime(conv.first.at))}</div></div>
              <div><div class="kv-label">Latest message</div><div class="t-caption">${esc(fmtDateTime(conv.latest.at))}</div></div>
            </div>
            <div class="lead-quotes">
              <div><div class="t-caption t-muted">First message</div><div class="lead-quote">“${esc(conv.first.text)}”</div></div>
              <div><div class="t-caption t-muted">Latest message</div><div class="lead-quote">“${esc(conv.latest.text)}”</div></div>
            </div>
            <div class="lead-insights"><div class="lead-insights-title"><i data-lucide="sparkles"></i>AI key insights</div>

}

- Dev toggles override the authority for the demo: Auto / Read-only mirror / Galaxis CRM (full edit).

## Table
- Search by name, email or source (agency users: name or source only).
- **Contact privacy (23/10/2026)**: agency users (agency admins viewing a client workspace) see **emails and phone numbers masked** in the table and on the lead profile, so client contact details never appear during showcases or screen shares: \`j•••••@e•••••.com\`, \`+65 •••• ••01\` (fixed-length masks; first letters, country code and last two digits kept so rows can still be told apart). A note under the card title says so, and searching by email is turned off for them. Client users see full details. Product: enforce this server-side (the API returns masked values to agency roles), not only in the UI.
- Status filter (All / New / Qualified / Converted / Lost, with counts that follow the search): **Galaxis CRM (full edit) only**. Read-only mirrors don't have it: each third-party CRM has its own stage fields and values, and the mirror is a searchable list, not a working pipeline. The Status column still shows the status synced from the CRM.
- Columns: Name & Email, Phone, Source, Owner, Status (Converted green, Qualified blue, New grey, Lost red), Created, Lifetime Value.
- All columns sort; default is newest first. 15 per page (V2), with 10 / 20 / 50 also available.
- Empty state: "No leads found matching …".
- Clicking a row opens the Lead Profile.
- Full edit adds a ⋮ menu (View profile / Edit status) and **Add Lead** (name, email, phone, source, owner, status, deal value; email must be valid and unique).

## Data
- About 45 leads per workspace, generated deterministically from the workspace seed. Owners are the workspace's active client members and assigned agency staff.
- Lifetime value is the sum of the lead's contracts, so New and Qualified leads show —.
- All names, emails (example.com) and phones (+65 0000 00xx) are placeholders.

## Open questions
- **Edit rights in Galaxis CRM mode:** can Client Users add or edit leads, or only Admins? Can agency staff edit a client's leads?
- **PDPA retention for mirrored leads:** how long does Galaxis keep a copy of leads mirrored from a third-party CRM, and are deletions in the CRM propagated? Needs a decision from the data protection owner.
- Should Lost leads with past contracts count towards attributed revenue?
- Is bulk export needed? (Not built: it would copy personal data out of the CRM.)`
  },
  'client-lead-profile': {
    title: 'Lead Profile (Client workspace)', status: 'Draft', author: 'Hannah', updatedAt: '21/10/2026',

Ported from V2's Lead Intelligence profile: one lead's details, conversations, attribution journey and contracts.

## Header
- "← Back to Leads", lead name and status pill.
- Read-only mirror: a "Read-only (Synced via {CRM})" badge. Full edit: a status select (choosing Converted asks for the deal value).

## Left column — Lead Details

## Right column

- **Attribution Timeline**: 3–6 touchpoints, newest first; the count in the subtitle matches the list. Badge types: ad click (Google / Meta), WhatsApp or Aurix session with AI summary, inbound call via Delacon (duration, handler, attributed source), lead created (web form or auto-created), deal won / marked lost. The first touchpoint always matches First Touch Source.

## Open questions

- **PDPA retention:** chat transcripts and AI summaries are personal data. Agree retention and who may see them before production.

// Galaxis Hub demo — agency CRM: role mapping, auto set-up when a CRM account converts, and the set-up checklist.
// Data: crmAccounts / agencyCrm (data.js). This module owns crmRoleMap, crmSettings, crmSetups and the conversion queue.
// Every global here is prefixed `crm`. Contract used by the dashboard: crmPendingSetups(), crmOpenSetup(wsId), crmSimulateConversion().
// All companies, people and emails below are fictional placeholders.

// ---------- Role mapping (defaults; no editing UI since 22/10/2026 — where it is managed is an open question) ----------
// Each CRM role maps to a Galaxis agency role and, optionally, a team. On conversion the CRM's named user is used when
// they hold the mapped role (and team); otherwise the least-loaded agency member with that role and team is picked.
// roleId '' means "do not assign".
const crmRoleMap = [
  { crmRole: 'Account Manager', roleId: 'r-a-am', teamId: '' },
  { crmRole: 'SEO Specialist', roleId: 'r-a-seolead', teamId: 't-a-seo' },
  { crmRole: 'Project Lead', roleId: 'r-a-pl', teamId: '' },
  { crmRole: 'Ads Specialist', roleId: 'r-a-am', teamId: 't-a-mkt' }
];
// Hannah's decision: client invites wait for the account manager's approval.
const crmSettings = { approvalRequired: true };
// Set-up record per CRM-created workspace: { crmId, createdAt, assignees: [{ crmRole, memberId|null }], contactIds: [memberIds], removed: n }
// Workspaces without a record were set up before the CRM integration and count as fully set up.
const crmSetups = {};

// Placeholder queue of CRM accounts that convert next. [PLACEHOLDER] — fictional companies, people and budgets.
const crmQueue = [
  { name: 'Northstar Dental Pte Ltd', industry: 'Healthcare', site: 'northstar-dental.example.com',
    services: [{ type: 'SEO', monthlyBudget: 3500 }, { type: 'Google Ads', monthlyBudget: 8000 }, { type: 'Content Marketing', monthlyBudget: 2000 }],
    seo: { contractedKeywords: 60, targetTop10Pct: 50 },
    adAccountIds: { google: '#998-234-1102' },
    accountManager: 'melson.ng@example.com',
    assignees: [{ crmRole: 'SEO Specialist', email: 'mary.lim@example.com' }, { crmRole: 'Project Lead', email: 'serah.chua@example.com' }],
    contacts: [{ name: 'Alex Northstar', email: 'alex@northstar-dental.example.com', role: 'Primary contact' },
      { name: 'Bea Practice', email: 'bea@northstar-dental.example.com', role: 'Marketing' }] },
  { name: 'Harbourview Bakery', industry: 'F&B', site: 'harbourview-bakery.example.com',
    services: [{ type: 'Facebook Ads', monthlyBudget: 3000 }, { type: 'Social Media', monthlyBudget: 1500 }],
    adAccountIds: { meta: 'act_4920194820' },
    accountManager: 'joseph.tan@example.com',
    assignees: [{ crmRole: 'Ads Specialist', email: '' }],
    contacts: [{ name: 'Casey Harbour', email: 'casey@harbourview.example.com', role: 'Primary contact' }] },
  { name: 'Lumen Fitness Studio', industry: 'Other', site: 'lumen-fitness.example.com',
    services: [{ type: 'SEO', monthlyBudget: 2500 }, { type: 'Google Ads', monthlyBudget: 5000 }, { type: 'Facebook Ads', monthlyBudget: 4000 }],
    seo: { contractedKeywords: 40, targetTop10Pct: 45 },
    adAccountIds: { google: '#552-901-7744', meta: 'act_9999999999' },   // the Meta ID isn't discovered yet: stays a manual step
    accountManager: 'joseph.tan@example.com',
    assignees: [{ crmRole: 'SEO Specialist', email: '' }, { crmRole: 'Ads Specialist', email: '' }, { crmRole: 'Project Lead', email: '' }],
    contacts: [{ name: 'Dana Lumen', email: 'dana@lumen-fitness.example.com', role: 'Primary contact' },
      { name: 'Eli Coach', email: 'eli@lumen-fitness.example.com', role: 'Marketing' },

];

// ---------- Helpers ----------
function crmToday() { return toDateInput(new Date()); }
function crmConnected() { return agencyCrm.status === 'connected'; }
function crmMapFor(crmRole) { return crmRoleMap.find(r => r.crmRole === crmRole); }
// Agency members who can fill a CRM role under the current mapping (active, not Owner / Agency Admin, who see every workspace anyway).
function crmCandidates(crmRole) {
  const map = crmMapFor(crmRole);
  if (!map || !map.roleId) return [];
  return members.filter(m => m.org === 'agency' && m.status === 'active' && !(m.workspaces || []).includes('*') &&
    m.roleId === map.roleId && (!map.teamId || m.teamId === map.teamId));
}
// Pick the member for a CRM role: the CRM's named user if they qualify, else the one with the fewest assigned workspaces.
function crmResolve(crmRole, email) {
  const list = crmCandidates(crmRole);
  const named = email && list.find(m => m.email.toLowerCase() === email.toLowerCase());
  if (named) return named;
  return [...list].sort((a, b) => (a.workspaces || []).length - (b.workspaces || []).length || a.name.localeCompare(b.name))[0] || null;
}
// Client role for a CRM contact. The primary contact becomes Super Admin and the workspace Primary Contact.
function crmContactRole(role) {
  if (/primary/i.test(role)) return 'r-c-super';
  if (/marketing/i.test(role)) return 'r-c-hom';
  return 'r-c-employee';
}
function crmAddContactMember(wsId, c, status) {
  const m = { id: uid('m'), org: wsId, name: c.name, email: c.email, teamId: null, roleId: crmContactRole(c.role), status,
    products: [], lastActive: null, lastProduct: null, crmContact: true, crmRole: c.role };
  if (/primary/i.test(c.role) && !wsPrimaryContact(wsId)) m.isPrimary = true;
  members.push(m);
  return m;
}
function crmAwaiting(wsId) { return members.filter(m => m.org === wsId && m.status === 'awaiting'); }
function crmSetupContacts(wsId) {
  const s = crmSetups[wsId];
  return s ? s.contactIds.map(memberById).filter(Boolean) : [];
}

// ---------- Set-up checklist (computed from live data, so manual changes elsewhere tick steps off) ----------
// state: 'done' | 'pending' (needs the account manager) | 'manual' (done outside the checklist)
function crmSetupSteps(wsId) {
  const s = crmSetups[wsId];
  const acc = crmAccounts[wsId];
  if (!s || !acc) return [];
  const steps = [];
  const total = acc.services.reduce((t, x) => t + x.monthlyBudget, 0);
  steps.push({ id: 'created', label: 'Workspace created', state: 'done', detail: `Created from CRM account ${acc.crmId} on ${fmtDate(s.createdAt)}.` });
  steps.push({ id: 'services', label: 'Services & budgets synced', state: 'done', detail: `${acc.services.length} service${acc.services.length === 1 ? '' : 's'} · ${fmtMoney(total)} / month (${acc.services.map(x => x.type).join(', ')}).` });
  const assigned = s.assignees.filter(a => a.memberId && memberById(a.memberId));
  const missing = s.assignees.filter(a => !a.memberId);
  steps.push({ id: 'assignees', label: 'Agency assignees added', state: missing.length ? 'pending' : 'done',
    detail: assigned.map(a => `${memberById(a.memberId).name} (${a.crmRole})`).join(', ') || 'No agency members assigned.',
    warn: missing.length ? `No Galaxis user matches ${missing.map(a => a.crmRole).join(', ')}. Assign one manually.` : '' });
  if (acc.services.some(x => x.type === 'SEO')) {
    const e = wsProducts(wsId)['seo-cloud'];
    steps.push({ id: 'seo', label: 'SEO Cloud project linked', state: seoProjects[wsId] ? 'done' : 'pending',
      detail: seoProjects[wsId] ? `${seoProjects[wsId].contractedKeywords} keywords contracted · target ${seoProjects[wsId].targetTop10Pct}% in top 10.${e && e.status === 'pending' ? ' Keyword set-up in progress in SEO Cloud.' : ''}` : 'SEO is a live service but no SEO Cloud project is linked yet.' });
  }
  const contacts = crmSetupContacts(wsId);
  const waiting = contacts.filter(m => m.status === 'awaiting');
  const sent = contacts.filter(m => m.status !== 'awaiting');
  steps.push({ id: 'invites', label: waiting.length ? 'Client contacts awaiting approval' : 'Client contacts approved', state: waiting.length ? 'pending' : 'done',
    detail: waiting.length ? `${waiting.length} contact${waiting.length === 1 ? '' : 's'} from the CRM will be invited once you approve.`
      : `${sent.length} invite${sent.length === 1 ? '' : 's'} sent${s.removed ? ` · ${s.removed} contact${s.removed === 1 ? '' : 's'} removed` : ''}.` });
  const need = [...new Set(acc.services.filter(x => CRM_AD_SERVICES.includes(x.type)).map(x => x.type === 'Facebook Ads' ? 'meta' : 'google'))];
  if (need.length) {
    const linked = wsPlatforms(wsId);
    const left = need.filter(p => !linked.includes(p));
    const ids = acc.adAccountIds || {};
    const auto = (s.autoLinked || []).map(id => adAccounts.find(a => a.id === id)).filter(a => a && a.workspaceId === wsId);
    const why = p => ids[p] ? `the CRM's ${PLATFORM_NAME[p]} ID ${ids[p]} isn't among the discovered accounts yet` : `the CRM has no ${PLATFORM_NAME[p]} ad account ID`;
    steps.push({ id: 'ads', label: 'Ad accounts linked', state: left.length ? 'manual' : 'done',
      detail: (auto.length ? `Linked automatically from the CRM's ad account IDs: ${auto.map(a => `${PLATFORM_NAME[a.platform]} ${a.id}`).join(', ')}. ` : '')
        + (left.length ? `Link ${left.map(p => PLATFORM_NAME[p]).join(' and ')} in Integrations: ${left.map(why).join('; ')}.` : (auto.length ? '' : `${need.map(p => PLATFORM_NAME[p]).join(' and ')} linked.`)) });
  }
  return steps;
}
function crmSetupProgress(wsId) {
  const steps = crmSetupSteps(wsId);
  return { done: steps.filter(x => x.state === 'done').length, total: steps.length };
}

// Contract: workspaces whose auto set-up still has steps to do.
function crmPendingSetups() {
  return Object.keys(crmSetups).map(wsById).filter(w => w && !w.archived).map(w => {
    const p = crmSetupProgress(w.id);
    return { wsId: w.id, wsName: w.name, pendingInvites: crmAwaiting(w.id).filter(m => m.crmContact).length, stepsDone: p.done, stepsTotal: p.total };
  }).filter(x => x.stepsDone < x.stepsTotal);
}

// ---------- Conversion ----------
// Contract: runs the whole auto set-up for the next account in the queue.
function crmSimulateConversion() {
  if (!crmConnected()) {
    showToast('Agency CRM is disconnected. Reconnect it in Integrations to sync new accounts.', 'triangle-alert');
    return null;
  }
  const next = crmQueue.shift();
  if (!next) { showToast('No more CRM accounts waiting to convert in this demo', 'info'); return null; }
  // Duplicate detection (open question): never create a second workspace with the same name.
  if (typeof teamOrgNameTaken === 'function' && teamOrgNameTaken(next.name)) {
    showToast(`${next.name} already has a workspace. Flagged for review instead of creating a duplicate.`, 'triangle-alert');
    return null;
  }
  const today = crmToday();
  const end = `${Number(today.slice(0, 4)) + 1}${today.slice(4)}`;
  const adBudget = next.services.filter(x => CRM_AD_SERVICES.includes(x.type)).reduce((t, x) => t + x.monthlyBudget, 0);
  const ws = teamCreateWorkspace({ name: next.name, site: next.site, industry: next.industry, budget: adBudget || 0, source: 'crm' });

  // 1–2. CRM record: services and budgets.
  const crmId = `CRM-${2000 + Object.keys(crmSetups).length + 1}`;
  const am = crmResolve('Account Manager', next.accountManager);
  const wanted = [{ crmRole: 'Account Manager', email: next.accountManager }, ...next.assignees];
  const assignees = wanted.map(a => ({ crmRole: a.crmRole, memberId: (a.crmRole === 'Account Manager' ? am : crmResolve(a.crmRole, a.email))?.id || null }));
  crmAccounts[ws.id] = {
    crmId, stage: 'converted', convertedAt: today, source: 'crm',
    services: next.services.map(x => ({ ...x, contractNo: `${today.slice(2, 4)}${today.slice(5, 7)}-${String(crmId.slice(-3)).padStart(3, '0')}`, start: today, end })),
    adAccountIds: { google: next.adAccountIds?.google || null, meta: next.adAccountIds?.meta || null },
    accountManager: am?.id || null,
    assignees: assignees.filter(a => a.memberId).map(a => ({ role: a.crmRole, memberId: a.memberId })),
    clientContacts: next.contacts.map(c => ({ ...c }))
  };
  // 3. Agency assignees via member.workspaces.
  assignees.forEach(a => {
    const m = a.memberId && memberById(a.memberId);
    if (m && !(m.workspaces || []).includes(ws.id)) (m.workspaces = m.workspaces || []).push(ws.id);
  });
  // SEO Cloud project placeholder: pending until keywords are set up.
  if (next.seo) {
    seoProjects[ws.id] = { contractedKeywords: next.seo.contractedKeywords, targetTop10Pct: next.seo.targetTop10Pct, scenarioTop10Pct: 0, startedAt: today };
    wsProducts(ws.id)['seo-cloud'] = { status: 'pending', active: false, lastSynced: null, error: 'SEO Cloud project created; keyword set-up in progress.' };
  }
  // Ad accounts: link automatically when the CRM's Google Ads / Meta IDs match accounts discovered by the master connections.
  const autoLinked = [];
  Object.entries(crmAccounts[ws.id].adAccountIds).forEach(([plat, id]) => {
    const acc = id && adAccounts.find(a => a.id === id && a.platform === plat && !a.workspaceId);
    if (acc && !wsAdAccounts(ws.id).some(a => a.platform === plat)) { acc.workspaceId = ws.id; autoLinked.push(acc); }
  });
  // 4. Client contacts: awaiting approval (or invited straight away when the agency turns approval off).
  const status = crmSettings.approvalRequired ? 'awaiting' : 'pending';
  const contactIds = next.contacts.map(c => crmAddContactMember(ws.id, c, status).id);
  crmSetups[ws.id] = { crmId, createdAt: today, assignees, contactIds, removed: 0, autoLinked: autoLinked.map(a => a.id) };
  agencyCrm.accountsSynced += 1;
  agencyCrm.lastSynced = new Date().toISOString();

  render();
  showToast(`New workspace created from CRM: ${ws.name}`, 'sparkles');
  return ws;
}

// ---------- Approval ----------
function crmApproveAll(wsId) {
  const list = crmAwaiting(wsId);
  if (!list.length) { showToast('No client contacts are awaiting approval', 'info'); return; }
  confirmDialog({
    title: `Send ${list.length} client invite${list.length === 1 ? '' : 's'}?`,
    text: `${list.map(m => m.email).join(', ')} will get an invitation to ${wsById(wsId).name}.`,
    confirmLabel: 'Approve & send invites', icon: 'send',
    onConfirm: () => { crmDoApprove(wsId, list.map(m => m.id)); }
  });
}
function crmApproveContact(memberId) {
  const m = memberById(memberId);
  if (!m || m.status !== 'awaiting') return;
  crmDoApprove(m.org, [m.id]);
}
function crmDoApprove(wsId, ids) {

  showToast(ids.length === 1 ? `Invitation sent to ${memberById(ids[0]).email}` : `Invitations sent to ${ids.length} client contacts`, 'send');
}
function crmRemoveContact(memberId) {
  const m = memberById(memberId);

  confirmDialog({
    title: 'Remove client contact?',
    text: `${m.name} (${m.email}) won’t be invited to ${wsById(m.org).name}. The contact stays in the agency CRM.`,
    confirmLabel: 'Remove', danger: true, icon: 'user-minus',
    onConfirm: () => {
      members.splice(members.indexOf(m), 1);
      const s = crmSetups[m.org];

  });
}
// Re-render the page and, when it is open, the checklist drawer.
function crmChanged(wsId) {

// ---------- Set-up checklist drawer ----------
state.ui.crmDrawerWs = null;
// Contract: open a workspace's set-up checklist (from the dashboard Attention row or the Client Organisation card).
function crmOpenSetup(wsId) {
  const ws = wsById(wsId);

  refreshIcons();
}
const CRM_STEP_ICON = { done: ['check', 'crm-step-done', 'Done'], pending: ['clock', 'crm-step-pending', 'Needs approval'], manual: ['hand', 'crm-step-manual', 'Manual step'] };
function crmSetupHTML(wsId) {
  const ws = wsById(wsId);
  const s = crmSetups[wsId];
  const acc = crmAccounts[wsId];
  if (!s || !acc) {
    return `<h3 class="h-section">${esc(ws.name)}</h3>${emptyState('circle-check', 'No auto set-up for this workspace', 'It was set up before the agency CRM integration, so there is no checklist.')}`;

  const pct = Math.round(p.done / Math.max(1, p.total) * 100);
  const items = steps.map((st, i) => {
    const [icon, cls, label] = CRM_STEP_ICON[st.state];
    let extra = '';
    if (st.id === 'invites') extra = crmContactList(wsId);
    if (st.id === 'ads' && st.state !== 'done') extra = `<button type="button" class="btn btn-outline btn-sm crm-step-btn" onclick="crmLinkAds('${wsId}')"><i data-lucide="link"></i>Link in Integrations</button>`;
    if (st.id === 'assignees' && st.state !== 'done') extra = `<button type="button" class="btn btn-outline btn-sm crm-step-btn" onclick="closeDrawer(); teamOpenAssignMembers('${wsId}')"><i data-lucide="user-plus"></i>Assign members</button>`;
    return `<li class="crm-step ${cls}">
      <span class="crm-step-icon" title="${label}"><i data-lucide="${icon}"></i></span>
      <div class="grow"><div class="row-between"><span class="t-bold">${i + 1}. ${esc(st.label)}</span><span class="crm-step-state">${label}</span></div>
        <div class="t-caption t-secondary crm-step-detail">${esc(st.detail)}</div>
        ${st.warn ? `<div class="t-caption t-warning crm-step-detail">${esc(st.warn)}</div>` : ''}
        ${extra}</div></li>`;
  }).join('');
  return `<div class="crm-setup-head"><span class="team-org-logo">${esc(initials(ws.name))}</span>
      <div class="grow"><h3 class="h-section">${esc(ws.name)}</h3>
        <div class="row crm-setup-meta"><span class="crm-badge"><i data-lucide="sparkles"></i>From CRM</span><span class="t-caption t-muted">${esc(acc.crmId)} · Account manager ${esc(am?.name || 'not mapped')}</span></div></div></div>
    <div class="crm-progress-row"><span class="t-bold">Set-up checklist</span><span class="t-caption t-secondary">${p.done} of ${p.total} steps</span></div>
    <div class="progress crm-progress" role="progressbar" aria-valuenow="${p.done}" aria-valuemin="0" aria-valuemax="${p.total}"><span style="width:${pct}%"></span></div>
    <p class="t-caption t-muted crm-setup-note">Galaxis created this workspace automatically when the account converted in the agency CRM. ${crmSettings.approvalRequired ? 'Client invites wait for the account manager’s approval.' : 'Client invites were sent automatically.'}</p>
    <ol class="crm-steps">${items}</ol>`;
}
function crmContactList(wsId) {
  const list = crmSetupContacts(wsId);
  if (!list.length) return '<div class="t-caption t-muted crm-step-detail">No client contacts left to invite.</div>';
  return `<div class="crm-contacts">${list.map(m => `<div class="crm-contact">
      <div class="grow crm-contact-text"><div class="crm-contact-name"><span class="t-bold">${esc(m.name)}</span><span class="chip">${esc(m.isPrimary ? 'Primary contact' : (m.crmRole || roleById(m.roleId)?.name || 'Contact'))}</span></div><div class="cell-sub">${esc(m.email)}</div></div>
      ${m.status === 'awaiting'
        ? `<button type="button" class="btn btn-outline btn-sm" onclick="crmRemoveContact('${m.id}')">Remove</button><button type="button" class="btn btn-primary btn-sm" onclick="crmApproveContact('${m.id}')">Approve</button>`
        : statusDot(m.status)}</div>`).join('')}</div>`;
}
function crmLinkAds(wsId) {
  closeDrawer();
  state.ctx = null; state.persona = 'agency';
  navigate('integrations');
  showToast(`Link ${wsById(wsId).name}’s ad accounts under “Client workspaces without linked ad accounts”`, 'link');
}

// ---------- Seed: two new workspaces still waiting for approval (Attention row demo) ----------
(function crmSeedPending() {
  const seed = {
    'ws-grizzly': [{ name: 'Gus Grizzly', email: 'gus@grizzly.example.com', role: 'Primary contact' }, { name: 'Hana Bear', email: 'hana@grizzly.example.com', role: 'Marketing' }],
    'ws-beantech': [{ name: 'Ivan Bean', email: 'ivan@beantech.example.com', role: 'Primary contact' }]
  };
  Object.entries(seed).forEach(([wsId, contacts]) => {
    const ws = wsById(wsId), acc = crmAccounts[wsId];
    if (!ws || !acc) return;
    ws.source = 'crm';
    acc.clientContacts = contacts;
    const contactIds = contacts.map(c => crmAddContactMember(wsId, c, 'awaiting').id);
    const assignees = acc.assignees.map(a => ({ crmRole: a.role, memberId: a.memberId }));
    assignees.forEach(a => { const m = memberById(a.memberId); if (m && !(m.workspaces || []).some(w => w === '*' || w === wsId)) m.workspaces.push(wsId); });
    crmSetups[wsId] = { crmId: acc.crmId, createdAt: ws.createdAt, assignees, contactIds, removed: 0 };
  });
})();


// ---- src/app.js ----
// Galaxis Hub demo — start-up. Loaded last, after every screen module has registered itself.

function initApp() {
  // Core pages first in the dev screen selector, then any extra screens modules registered (role editor, lead profile…).
  const extras = devScreens.splice(0);
  const pages = [['dashboard', 'Dashboard'], ['organisation', 'Organisation'], ['team', 'Team & Access'], ['integrations', 'Integrations'], ['leads', 'Leads']];
  pages.forEach(([page, label]) => {
    const def = screens[page];
    if (!def) return;
    // Modules with sub-screens (e.g. one per tab) register their own entries instead.
    const owned = ctx => extras.some(e => e.key === `${ctx}-${page}` || e.key.startsWith(`${ctx}-${page}-`));
    if (owned('agency') || owned('client')) return;
    if (!def.contexts || def.contexts.includes('agency')) registerDevScreen('Agency', `agency-${page}`, label, () => { state.ctx = null; state.persona = 'agency'; navigate(page); });
    if (!def.contexts || def.contexts.includes('client')) registerDevScreen('Client workspace', `client-${page}`, label, () => { state.ctx = devClientCtx(); navigate(page); });
  });
  devScreens.push(...extras);
  devScreens.sort((a, b) => (a.group === b.group ? 0 : a.group === 'Agency' ? -1 : 1));
  render();
}

initApp();
